/* Some phones block localStorage (private browsing, restricted cookie
   settings). Touching it directly would throw and leave the user staring
   at a blank white screen, so fall back to in-memory storage instead:
   the app still works, the session just does not survive a reload. */
const safeStorage = (() => {
  try {
    const probe = '__hv_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    return window.localStorage;
  } catch (e) {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => { mem.set(k, String(v)); },
      removeItem: (k) => { mem.delete(k); },
    };
  }
})();

/** Progressive tax on annual taxable income using the bracket table. */
function calcAnnualTax(taxable, brackets) {
  let tax = 0;
  for (const b of brackets) {
    const lo = Number(b.lower_bound);
    const hi = b.upper_bound == null ? Infinity : Number(b.upper_bound);
    if (taxable <= lo) break;
    tax += (Math.min(taxable, hi) - lo) * Number(b.rate);
  }
  return Math.max(0, tax);
}

function Btn({ variant = 'primary', size = 'md', className, ...p }) {
  const base = 'inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition active:scale-[.97] disabled:opacity-50 disabled:pointer-events-none';
  const v = {
    primary: 'bg-teal-700 text-white hover:bg-teal-800',
    soft: 'bg-teal-50 text-teal-800 hover:bg-teal-100',
    ghost: 'bg-transparent text-slate-600 hover:bg-slate-100',
    outline: 'border border-slate-300 bg-white text-slate-700 hover:bg-slate-50',
    danger: 'bg-rose-600 text-white hover:bg-rose-700',
  }[variant];
  const s = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2.5 text-sm', lg: 'px-5 py-3 text-base w-full' }[size];
  return <button className={cx(base, v, s, className)} {...p} />;
}

}

  const bad = msg.type === 'error';
  return (
    <div className="fixed inset-x-0 top-3 z-[60] flex justify-center px-4">
      <div className={cx('max-w-md rounded-xl px-4 py-2.5 text-sm font-semibold text-white shadow-lg', bad ? 'bg-rose-600' : 'bg-teal-700')}>
        {msg.text}
      </div>
    </div>
  );
}

function Empty({ text }) {

/* =====================================================================
   4. Auth screen
   ===================================================================== */
function AuthScreen({ toast }) {
  const { lang, t, setLang } = useL();
  const [mode, setMode] = useState('in');
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [nameEn, setNameEn] = useState('');
  const [nameAr, setNameAr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!CONFIGURED) return toast(t.notConfigured, 'error');
    setBusy(true);
    try {
      if (mode === 'in') {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signUp({
          email: email.trim(), password: pw,
          options: { data: { full_name_en: nameEn, full_name_ar: nameAr } },
        });
        if (error) throw error;
        toast(t.checkEmail);
        setMode('in');
      }
    } catch (err) { toast(err.message, 'error'); }
    setBusy(false);
  }

  async function reset() {
    if (!email.trim()) return toast(t.email, 'error');
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href });
    toast(error ? error.message : t.resetSent, error ? 'error' : 'ok');
  }

  return (
    <div className="flex min-h-full flex-col justify-center bg-gradient-to-b from-teal-800 to-teal-950 px-4 py-10">
      <div className="mx-auto w-full max-w-sm">
        <div className="mb-6 text-center text-white">
          <div className="mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-2xl bg-white/15 text-3xl">🏖️</div>
          <h1 className="text-xl font-bold">{t.appName}</h1>
          <p className="text-sm text-teal-200">{t.appSub}</p>
        </div>

        <form onSubmit={submit} className="space-y-3 rounded-2xl bg-white p-5 shadow-xl">
          {mode === 'up' && (
            <>
              <Field label={t.fullNameAr}><Input value={nameAr} onChange={(e) => setNameAr(e.target.value)} /></Field>
              <Field label={t.fullNameEn}><Input value={nameEn} onChange={(e) => setNameEn(e.target.value)} /></Field>
            </>
          )}
          <Field label={t.email}>
            <Input type="email" inputMode="email" autoComplete="email" required value={email} onChange={(e) => setEmail(e.target.value)} />
          </Field>
          <Field label={t.password}>
            <Input type="password" autoComplete={mode === 'in' ? 'current-password' : 'new-password'} required minLength={6} value={pw} onChange={(e) => setPw(e.target.value)} />
          </Field>

          <Btn size="lg" disabled={busy}>{busy ? t.loading : mode === 'in' ? t.signIn : t.signUp}</Btn>

          {mode === 'in' ? (
            <div className="flex items-center justify-between pt-1 text-xs">
              <button type="button" onClick={reset} className="text-slate-500 underline">{t.forgotPw}</button>
              <button type="button" onClick={() => setMode('up')} className="font-semibold text-teal-700">{t.noAccount}</button>
            </div>
          ) : (
            <div className="pt-1 text-xs">
              <p className="mb-2 text-slate-500">{t.signupHint}</p>
              <button type="button" onClick={() => setMode('in')} className="font-semibold text-teal-700">{t.haveAccount}</button>
            </div>
          )}
        </form>

        <div className="mt-5 flex items-center justify-center gap-3 text-xs text-teal-200">
          <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="rounded-lg bg-white/10 px-3 py-1.5 font-semibold text-white">
            {lang === 'ar' ? 'English' : 'العربية'}

        </div>
        {!CONFIGURED && <p className="mt-4 rounded-xl bg-amber-100 p-3 text-center text-xs text-amber-800">{t.notConfigured}</p>}
      </div>
    </div>
  );
}

function UsersPage({ me, data, refresh, toast, audit }) {
  const { lang, t } = useL();
  const [q, setQ] = useState('');
  const [editing, setEditing] = useState(null);
  const [inviting, setInviting] = useState(null);

  const list = data.users.filter((u) => {
    const s = (u.email + ' ' + (u.full_name_en || '') + ' ' + (u.full_name_ar || '')).toLowerCase();
    return s.includes(q.toLowerCase());
  });

  async function saveUser(form) {
    const before = data.users.find((u) => u.id === form.id);
    const { data: row, error } = await sb.from('app_users')
      .update({ full_name_en: form.full_name_en, full_name_ar: form.full_name_ar, role: form.role, branch_id: form.branch_id || null, phone: form.phone, is_active: form.is_active })
      .eq('id', form.id).select().single();
    if (error) return toast(error.message, 'error');
    refresh.users((prev) => prev.map((u) => (u.id === row.id ? row : u)));
    audit('update', 'app_users', row.id, before, row);
    setEditing(null);
    toast(t.saved);
  }

  async function saveInvite(form) {
    const { data: row, error } = await sb.from('user_invites')
      .insert({ email: form.email.trim().toLowerCase(), role: form.role, branch_id: form.branch_id || null, full_name_en: form.full_name_en, full_name_ar: form.full_name_ar, created_by: me.id })
      .select().single();
    if (error) return toast(error.message, 'error');
    refresh.invites((prev) => [row, ...prev]);
    audit('insert', 'user_invites', row.id, null, row);
    setInviting(null);
    toast(t.saved);
  }

  const branchName = (id) => {
    const b = data.branches.find((x) => x.id === id);
    return b ? (lang === 'ar' ? b.name_ar : b.name_en) : '—';

  return (
    <>
      <div className="flex gap-2">

      </div>

      <Card title={t.users}>
        {list.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {list.map((u) => (
              <li key={u.id} className="flex items-center justify-between gap-3 py-3">
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-slate-800">
                    {(lang === 'ar' ? u.full_name_ar : u.full_name_en) || u.email}
                  </p>
                  <p className="truncate text-xs text-slate-500">{u.email} &middot; {branchName(u.branch_id)}</p>
                </div>
                <div className="flex shrink-0 items-center gap-2">
                  <Badge tone={u.is_active ? 'teal' : 'red'}>{t.roles[u.role]}</Badge>
                  <Btn variant="ghost" size="sm" onClick={() => setEditing({ ...u })}>{t.edit}</Btn>
                </div>
              </li>
            ))}
          </ul>
        )}
      </Card>

      <Card title={t.pending}>
        {data.invites.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {data.invites.map((i) => (
              <li key={i.id} className="flex items-center justify-between gap-3 py-2.5">
                <div className="min-w-0">
                  <p className="truncate text-sm text-slate-800">{i.email}</p>
                  <p className="text-xs text-slate-500">{t.roles[i.role]} &middot; {branchName(i.branch_id)}</p>

                <Badge tone={i.consumed_at ? 'green' : 'amber'}>{i.consumed_at ? t.consumed : t.pending}</Badge>

            <Field label={t.phone}><Input value={editing.phone || ''} onChange={(e) => setEditing({ ...editing, phone: e.target.value })} /></Field>

              <Select value={editing.role} disabled={editing.id === me.id} onChange={(e) => setEditing({ ...editing, role: e.target.value })}>

              <Select value={inviting.branch_id} onChange={(e) => setInviting({ ...inviting, branch_id: e.target.value })}>

/** Shared save for the app_settings key/value table. */
function useSettingSaver({ me, refresh, toast, audit }) {
  const { t } = useL();
  return useCallback(async (key, value, before) => {
    const { data: row, error } = await sb.from('app_settings')
      .update({ value, updated_by: me.id }).eq('key', key).select().single();
    if (error) return toast(error.message, 'error');
    refresh.settings((prev) => ({ ...prev, [key]: row.value }));
    audit('update', 'app_settings', key, before, row.value);
    toast(t.savedSettings);
  }, [me.id, refresh, toast, audit, t]);
}

function HolidaySettings({ data, refresh, toast, audit }) {
  const { lang, t } = useL();
  const [edit, setEdit] = useState(null);
  const [year, setYear] = useState(String(new Date().getFullYear()));

  const list = data.holidays.filter((h) => h.holiday_date.startsWith(year));

  async function save() {
    const payload = { holiday_date: edit.holiday_date, name_en: edit.name_en, name_ar: edit.name_ar, is_paid: edit.is_paid !== false, branch_id: edit.branch_id || null };
    let res;
    if (edit.id) res = await sb.from('holidays').update(payload).eq('id', edit.id).select().single();
    else res = await sb.from('holidays').insert(payload).select().single();
    if (res.error) return toast(res.error.message, 'error');
    const row = res.data;
    refresh.holidays((prev) => {
      const next = edit.id ? prev.map((h) => (h.id === row.id ? row : h)) : [...prev, row];
      return next.sort((a, b) => a.holiday_date.localeCompare(b.holiday_date));
    });
    audit(edit.id ? 'update' : 'insert', 'holidays', row.id, edit.id ? edit : null, row);
    setEdit(null);
    toast(t.saved);
  }

  async function remove(h) {
    if (!window.confirm(t.confirmDel)) return;
    const { error } = await sb.from('holidays').delete().eq('id', h.id);
    if (error) return toast(error.message, 'error');
    refresh.holidays((prev) => prev.filter((x) => x.id !== h.id));
    audit('delete', 'holidays', h.id, h, null);
    toast(t.saved);
  }

  const years = [];
  for (let y = new Date().getFullYear() - 1; y <= new Date().getFullYear() + 2; y++) years.push(String(y));

  return (
    <Card title={t.holidays}
      action={<Btn size="sm" onClick={() => setEdit({ holiday_date: todayISO(), name_en: '', name_ar: '', is_paid: true, branch_id: '' })}>+ {t.add}</Btn>}>
      <Select className="mb-3" value={year} onChange={(e) => setYear(e.target.value)}>
        {years.map((y) => <option key={y} value={y}>{y}</option>)}
      </Select>
      {list.length === 0 ? <Empty text={t.noData} /> : (
        <ul className="divide-y divide-slate-100">
          {list.map((h) => (
            <li key={h.id} className="flex items-center justify-between gap-3 py-3">
              <div className="min-w-0">
                <p className="truncate text-sm font-semibold text-slate-800">{lang === 'ar' ? h.name_ar : h.name_en}</p>
                <p className="text-xs text-slate-500">{h.holiday_date} &middot; {h.is_paid ? t.paid : t.unpaid}</p>
              </div>
              <div className="flex shrink-0 gap-1">
                <Btn variant="ghost" size="sm" onClick={() => setEdit({ ...h })}>{t.edit}</Btn>
                <Btn variant="ghost" size="sm" className="text-rose-600" onClick={() => remove(h)}>{t.del}</Btn>
              </div>
            </li>
          ))}
        </ul>
      )}

      <Modal open={!!edit} onClose={() => setEdit(null)} title={t.holidays}
        footer={<><Btn className="flex-1" onClick={save}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setEdit(null)}>{t.cancel}</Btn></>}>
        {edit && (
          <>
            <Field label={t.date}><Input type="date" value={edit.holiday_date} onChange={(e) => setEdit({ ...edit, holiday_date: e.target.value })} /></Field>
            <Field label={t.nameAr}><Input value={edit.name_ar} onChange={(e) => setEdit({ ...edit, name_ar: e.target.value })} /></Field>
            <Field label={t.nameEn}><Input value={edit.name_en} onChange={(e) => setEdit({ ...edit, name_en: e.target.value })} /></Field>
            <Field label={t.branch}>
              <Select value={edit.branch_id || ''} onChange={(e) => setEdit({ ...edit, branch_id: e.target.value })}>
                <option value="">{t.allBranches}</option>
                {data.branches.map((b) => <option key={b.id} value={b.id}>{lang === 'ar' ? b.name_ar : b.name_en}</option>)}
              </Select>
            </Field>
            <label className="flex items-center gap-2 text-sm text-slate-700">
              <input type="checkbox" className="h-5 w-5 rounded accent-teal-700" checked={edit.is_paid !== false}
                onChange={(e) => setEdit({ ...edit, is_paid: e.target.checked })} />
              {t.paid}
            </label>
          </>
        )}
      </Modal>
    </Card>
  );
}

function TaxSettings({ data, refresh, toast, audit }) {
  const { t } = useL();
  const [rows, setRows] = useState(data.taxBrackets);
  const [exemption, setExemption] = useState(data.taxSettings?.personal_exemption_annual ?? 20000);
  const [demo, setDemo] = useState(120000);
  useEffect(() => { setRows(data.taxBrackets); }, [data.taxBrackets]);
  useEffect(() => { setExemption(data.taxSettings?.personal_exemption_annual ?? 20000); }, [data.taxSettings]);

  const effective = data.taxSettings?.effective_from || '2025-01-01';

  const setCell = (i, k, v) => setRows(rows.map((r, idx) => (idx === i ? { ...r, [k]: v } : r)));

  function addRow() {
    const last = rows[rows.length - 1];
    setRows([...rows, { id: null, effective_from: effective, seq: rows.length + 1, lower_bound: last ? (last.upper_bound ?? 0) : 0, upper_bound: null, rate: 0 }]);
  }

  async function save() {
    const clean = rows.map((r, i) => ({
      effective_from: effective, seq: i + 1,
      lower_bound: Number(r.lower_bound) || 0,
      upper_bound: r.upper_bound === '' || r.upper_bound == null ? null : Number(r.upper_bound),
      rate: Number(r.rate) || 0,
    }));
    // Replace the whole set for this effective date. If the insert fails we
    // put the previous brackets straight back, so a bad edit can never leave
    // the company with no tax table.
    const previous = data.taxBrackets.map((r) => ({
      effective_from: r.effective_from, seq: r.seq, lower_bound: r.lower_bound,
      upper_bound: r.upper_bound, rate: r.rate,
    }));
    const { error: delErr } = await sb.from('tax_brackets').delete().eq('effective_from', effective);
    if (delErr) return toast(delErr.message, 'error');
    const { data: saved, error } = await sb.from('tax_brackets').insert(clean).select();
    if (error) {
      if (previous.length) await sb.from('tax_brackets').insert(previous);
      return toast(error.message, 'error');
    }
    const sorted = saved.sort((a, b) => a.seq - b.seq);
    refresh.taxBrackets(() => sorted);
    audit('update', 'tax_brackets', effective, data.taxBrackets, sorted);

    const { data: ts, error: tsErr } = await sb.from('tax_settings')
      .update({ personal_exemption_annual: Number(exemption) })
      .eq('effective_from', effective).select().single();
    if (tsErr) return toast(tsErr.message, 'error');
    refresh.taxSettings(() => ts);
    audit('update', 'tax_settings', effective, data.taxSettings, ts);
    toast(t.saved);
  }

  const taxable = Math.max(0, Number(demo) - Number(exemption));
  const annualTax = calcAnnualTax(taxable, rows.map((r) => ({ ...r, rate: Number(r.rate) })));

  return (
    <>
      <Card title={t.tax} action={<Btn size="sm" variant="soft" onClick={addRow}>+ {t.addBracket}</Btn>}>
        <p className="mb-3 text-xs text-slate-500">{t.taxHint}</p>
        <Field label={t.personalExemption}>
          <Input type="number" inputMode="decimal" value={exemption} onChange={(e) => setExemption(e.target.value)} />
        </Field>

        <div className="mt-4 space-y-2">
          {rows.map((r, i) => (
            <div key={i} className="grid grid-cols-[1fr_1fr_5rem_2rem] items-end gap-2">
              <Field label={i === 0 ? t.from : ''}>
                <Input type="number" inputMode="decimal" value={r.lower_bound ?? ''} onChange={(e) => setCell(i, 'lower_bound', e.target.value)} />
              </Field>
              <Field label={i === 0 ? t.to : ''}>
                <Input type="number" inputMode="decimal" placeholder={t.upTo} value={r.upper_bound ?? ''} onChange={(e) => setCell(i, 'upper_bound', e.target.value === '' ? null : e.target.value)} />
              </Field>
              <Field label={i === 0 ? t.rate : ''}>
                <Input type="number" inputMode="decimal" step="0.0001" value={r.rate ?? 0} onChange={(e) => setCell(i, 'rate', e.target.value)} />
              </Field>
              <button onClick={() => setRows(rows.filter((_, idx) => idx !== i))}
                className="mb-1 rounded-lg px-2 py-2 text-lg leading-none text-rose-500 hover:bg-rose-50">&times;</button>
            </div>
          ))}
        </div>
        <p className="mt-2 text-xs text-slate-400">{t.rate}: 0.20 = 20%</p>
        <Btn className="mt-4" onClick={save}>{t.save}</Btn>
      </Card>

      <Card title={t.preview}>
        <Field label={t.annualIncome}><Input type="number" inputMode="decimal" value={demo} onChange={(e) => setDemo(e.target.value)} /></Field>
        <div className="mt-3 grid grid-cols-2 gap-3 text-center">
          <div className="rounded-xl bg-slate-50 p-3">
            <p className="text-xs text-slate-500">{t.taxDue}</p>
            <p className="text-lg font-bold text-slate-800">{money(annualTax)}</p>
          </div>
          <div className="rounded-xl bg-slate-50 p-3">
            <p className="text-xs text-slate-500">{t.monthlyTax}</p>
            <p className="text-lg font-bold text-slate-800">{money(annualTax / 12)}</p>
          </div>
        </div>
      </Card>
    </>
  );
}

function InsuranceSettings({ data, refresh, toast, audit }) {
  const { t } = useL();
  const cur = data.insurance;
  const [f, setF] = useState(cur || {});
  useEffect(() => { setF(data.insurance || {}); }, [data.insurance]);

  async function save() {
    const { data: row, error } = await sb.from('insurance_rates').update({
      employer_rate: Number(f.employer_rate),
      employee_rate: Number(f.employee_rate),
      min_insurance_wage: Number(f.min_insurance_wage),
      max_insurance_wage: Number(f.max_insurance_wage),
      notes: f.notes,
    }).eq('id', cur.id).select().single();
    if (error) return toast(error.message, 'error');
    refresh.insurance(() => row);
    audit('update', 'insurance_rates', row.id, cur, row);
    toast(t.saved);
  }

  if (!cur) return <Card title={t.insurance}><Empty text={t.noData} /></Card>;

  return (
    <Card title={t.insurance}>
      <p className="mb-3 text-xs text-slate-500">{t.insHint}</p>
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label={t.effectiveFrom}><Input value={cur.effective_from} disabled /></Field>
        <Field label={t.employerRate} hint={pct(f.employer_rate || 0) + '%'}>
          <Input type="number" step="0.0001" inputMode="decimal" value={f.employer_rate ?? ''} onChange={(e) => setF({ ...f, employer_rate: e.target.value })} />
        </Field>
        <Field label={t.employeeRate} hint={pct(f.employee_rate || 0) + '%'}>
          <Input type="number" step="0.0001" inputMode="decimal" value={f.employee_rate ?? ''} onChange={(e) => setF({ ...f, employee_rate: e.target.value })} />
        </Field>
        <Field label={t.minWage}><Input type="number" inputMode="decimal" value={f.min_insurance_wage ?? ''} onChange={(e) => setF({ ...f, min_insurance_wage: e.target.value })} /></Field>
        <Field label={t.maxWage}><Input type="number" inputMode="decimal" value={f.max_insurance_wage ?? ''} onChange={(e) => setF({ ...f, max_insurance_wage: e.target.value })} /></Field>
      </div>
      <Field label={t.notes}><Input value={f.notes || ''} onChange={(e) => setF({ ...f, notes: e.target.value })} /></Field>
      <Btn className="mt-4" onClick={save}>{t.save}</Btn>
    </Card>
  );
}

   ===================================================================== */
function ProfilePage({ me, setMe, toast }) {
  const { lang, t, setLang } = useL();
  const [f, setF] = useState(me);
  useEffect(() => { setF(me); }, [me]);

  async function save() {
    const { data: row, error } = await sb.from('app_users')
      .update({ full_name_en: f.full_name_en, full_name_ar: f.full_name_ar, phone: f.phone, lang })
      .eq('id', me.id).select().single();
    if (error) return toast(error.message, 'error');
    setMe(row);
    toast(t.saved);
  }

  return (
    <Card title={t.profile}>
      <Field label={t.email}><Input value={me.email} disabled /></Field>
      <Field label={t.role}><Input value={t.roles[me.role]} disabled /></Field>
      <Field label={t.fullNameAr}><Input value={f.full_name_ar || ''} onChange={(e) => setF({ ...f, full_name_ar: e.target.value })} /></Field>
      <Field label={t.fullNameEn}><Input value={f.full_name_en || ''} onChange={(e) => setF({ ...f, full_name_en: e.target.value })} /></Field>
      <Field label={t.phone}><Input value={f.phone || ''} onChange={(e) => setF({ ...f, phone: e.target.value })} /></Field>
      <Field label={t.language}>
        <Select value={lang} onChange={(e) => setLang(e.target.value)}>
          <option value="ar">العربية</option>
          <option value="en">English</option>
        </Select>
      </Field>
      <Btn className="mt-4" onClick={save}>{t.save}</Btn>
      <p className="mt-4 text-center text-xs text-slate-400">{APP_VERSION}</p>
    </Card>
  );
}

/* =====================================================================
   11. Root
   ===================================================================== */
function App() {
  const [lang, setLangState] = useState(() => safeStorage.getItem('hv_lang') || 'ar');
  const [session, setSession] = useState(undefined);   // undefined = still checking
  const [me, setMe] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [msg, setMsg] = useState(null);
  const [ready, setReady] = useState(false);

  const [users, setUsers] = useState([]);
  const [invites, setInvites] = useState([]);
  const [branches, setBranches] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [settings, setSettings] = useState({});
  const [taxBrackets, setTaxBrackets] = useState([]);
  const [taxSettings, setTaxSettings] = useState(null);
  const [insurance, setInsurance] = useState(null);

  const t = T[lang];

  const setLang = useCallback((l) => {
    setLangState(l);
    safeStorage.setItem('hv_lang', l);
  }, []);

  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  }, [lang]);

  const toast = useCallback((text, type) => {
    setMsg({ text, type });
    setTimeout(() => setMsg(null), 3500);
  }, []);

  /* auth session */
  useEffect(() => {
    if (!CONFIGURED) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => sub.subscription.unsubscribe();
  }, []);

  /* load everything once signed in */
  useEffect(() => {
    if (!session) { setMe(null); setReady(false); return; }
    let cancelled = false;

    (async () => {
      const uid = session.user.id;
      const { data: profile, error } = await sb.from('app_users').select('*').eq('id', uid).maybeSingle();
      if (cancelled) return;
      if (error) { toast(error.message, 'error'); return; }
      if (!profile) { toast('Profile not found. Run migration_001.sql first.', 'error'); return; }
      if (!profile.is_active) { toast(t.inactive, 'error'); await sb.auth.signOut(); return; }

      setMe(profile);
      if (profile.lang && profile.lang !== lang) setLang(profile.lang);
      sb.from('app_users').update({ last_login_at: new Date().toISOString() }).eq('id', uid).then(() => {});

      const [b, h, s, tb, ts, ir] = await Promise.all([
        sb.from('branches').select('*').order('code'),
        sb.from('holidays').select('*').order('holiday_date'),
        sb.from('app_settings').select('*'),
        sb.from('tax_brackets').select('*').order('seq'),
        sb.from('tax_settings').select('*').order('effective_from', { ascending: false }).limit(1).maybeSingle(),
        sb.from('insurance_rates').select('*').order('effective_from', { ascending: false }).limit(1).maybeSingle(),
      ]);
      if (cancelled) return;
      setBranches(b.data || []);
      setHolidays(h.data || []);
      setSettings(Object.fromEntries((s.data || []).map((r) => [r.key, r.value])));
      setTaxBrackets(tb.data || []);
      setTaxSettings(ts.data || null);
      setInsurance(ir.data || null);

      if (['ceo', 'hr', 'accountant', 'manager'].includes(profile.role)) {
        const [u, inv] = await Promise.all([
          sb.from('app_users').select('*').order('created_at'),
          sb.from('user_invites').select('*').order('created_at', { ascending: false }),
        ]);
        if (cancelled) return;
        setUsers(u.data || []);
        setInvites(inv.data || []);
      }
      setReady(true);
    })();

    return () => { cancelled = true; };
  }, [session]);

  /* audit helper -- every sensitive write goes through here */
  const audit = useCallback(async (action, entity, entityId, before, after) => {
    if (!me) return;
    await sb.from('audit_log').insert({
      actor_id: me.id, actor_email: me.email, actor_role: me.role,
      action, entity, entity_id: entityId == null ? null : String(entityId),
      before_data: before ?? null, after_data: after ?? null,
    });
  }, [me]);

  const ctx = useMemo(() => ({ lang, t, setLang }), [lang, t, setLang]);

  if (session === undefined) {
    return <L.Provider value={ctx}><div className="flex h-full items-center justify-center text-slate-400">{t.loading}</div></L.Provider>;
  }

  if (!session || !me) {
    return (
      <L.Provider value={ctx}>
        <Toast msg={msg} />
        <AuthScreen toast={toast} />
      </L.Provider>
    );
  }

  const data = { users, invites, branches, holidays, settings, taxBrackets, taxSettings, insurance };
  const refresh = {
    users: setUsers, invites: setInvites, branches: setBranches, holidays: setHolidays,
    settings: setSettings, taxBrackets: setTaxBrackets, taxSettings: setTaxSettings, insurance: setInsurance,
  };
  const shared = { me, setMe, data, refresh, toast, audit };
  const allowed = NAV.find((n) => n.key === page)?.roles.includes(me.role);

  return (
    <L.Provider value={ctx}>
      <Toast msg={msg} />
      <Shell me={me} page={page} setPage={setPage} onSignOut={() => sb.auth.signOut()}>
        {!ready ? <Empty text={t.loading} />
          : !allowed ? <Card><Empty text={t.noPermission} /></Card>
          : page === 'dashboard' ? <Dashboard {...shared} />
          : page === 'users' ? <UsersPage {...shared} />
          : page === 'settings' ? <SettingsPage {...shared} />
          : page === 'audit' ? <AuditPage />
          : page === 'profile' ? <ProfilePage {...shared} />
          : null}
      </Shell>
    </L.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
