      if (shift && lastOut) { const over = minutesOf(lastOut.punch_time) - timeToMin(shift.end_time); if (over >= shift.min_overtime_minutes) o.ot += over; }
      if (!lastOut) o.missing++;
    }
    return Object.values(out).sort((a, b) => b.days - a.days);
  }, [att, data.employees, data.shifts]);

  const leaveRows = lv ? active.map((e) => {
    const b = leaveBalance(e, now.getFullYear(), lv.reqs, lv.adjs, lv.types);
    const monthly = (Number(e.basic_salary) || 0) + (e.allowances || []).reduce((s, a) => s + (Number(a.amount) || 0), 0);
    const dayRate = monthly / ((data.settings.work_week || {}).standard_days_per_month || 30);
    const days = b.ent.dueYet ? Math.max(0, b.annualRemaining) : 0;
    return { emp: e, days, dayRate: r2(dayRate), amount: r2(days * dayRate) };
  }).filter((r) => r.days > 0).sort((a, b) => b.amount - a.amount) : [];

  const Bar = ({ v, max }) => <div className="h-2 rounded bg-brand-100"><div className="h-2 rounded bg-brand-600" style={{ width: (max ? Math.round(v / max * 100) : 0) + '%' }} /></div>;
  const Tbl = ({ head, rows }) => (
    <div className="overflow-x-auto"><table className="w-full min-w-[520px] text-sm">
      <thead><tr>{head.map((h, i) => <th key={i} className="py-2 text-start text-xs font-semibold text-slate-400">{h}</th>)}</tr></thead>
      <tbody>{rows.map((r, i) => <tr key={i} className={cx('border-t border-slate-100', r._total && 'bg-slate-50 font-bold')}>{r.cells.map((c, j) => <td key={j} className="py-2 pe-2">{c}</td>)}</tr>)}</tbody>
    </table></div>
  );
  const totalRow = (rows, fields) => ({ _total: true, ...Object.fromEntries(['count', ...fields].map((f) => [f, rows.reduce((s, r) => s + (Number(r[f]) || 0), 0)])) });

  const exportRows = (head, rows) => downloadCsv(tab + '-' + todayISO() + '.csv', [head, ...rows]);

  const MonthRange = () => (
    <div className="grid grid-cols-4 gap-2">
      <Select value={range.fm} onChange={(e) => setRange({ ...range, fm: Number(e.target.value) })}>{Array.from({ length: 12 }, (_, i) => <option key={i + 1} value={i + 1}>{t.fromMonth} {i + 1}</option>)}</Select>
      <Select value={range.fy} onChange={(e) => setRange({ ...range, fy: Number(e.target.value) })}>{[now.getFullYear() - 1, now.getFullYear()].map((y) => <option key={y} value={y}>{y}</option>)}</Select>
      <Select value={range.tm} onChange={(e) => setRange({ ...range, tm: Number(e.target.value) })}>{Array.from({ length: 12 }, (_, i) => <option key={i + 1} value={i + 1}>{t.toMonth} {i + 1}</option>)}</Select>
      <Select value={range.ty} onChange={(e) => setRange({ ...range, ty: Number(e.target.value) })}>{[now.getFullYear() - 1, now.getFullYear()].map((y) => <option key={y} value={y}>{y}</option>)}</Select>
      <label className="col-span-4 flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" className="h-4 w-4 accent-brand-700" checked={range.approvedOnly} onChange={(e) => setRange({ ...range, approvedOnly: e.target.checked })} />{t.approvedOnly}</label>
    </div>
  );

  const tabs = [['payroll', t.rptPayroll], ['headcount', t.rptHeadcount], ['overtime', t.rptOvertime], ['leave', t.rptLeave], ['attendance', t.rptAttendance]];

  return (
    <>
      <div className="no-scrollbar flex gap-2 overflow-x-auto pb-1">
        {tabs.map(([k, l]) => <button key={k} onClick={() => setTab(k)} className={cx('shrink-0 rounded-full px-3.5 py-1.5 text-sm font-semibold', tab === k ? 'bg-brand-700 text-white' : 'border border-slate-300 bg-white text-slate-600')}>{l}</button>)}
      </div>

      {tab === 'payroll' && (
        <>
          <MonthRange />
          {pr === null ? <Empty text={t.loading} /> : payrollRows.length === 0 ? <Card><Empty text={t.noRuns} /></Card> : (
            <>
              {[['byBranch', (r) => r.branch_id, branchName], ['byDepartment', (r) => r.department_id, deptName]].map(([title, keyFn, nameFn]) => {
                const g = groupSum(payrollRows, keyFn, costFields).sort((a, b) => b.cost - a.cost);
                const max = Math.max(...g.map((x) => x.cost));
                const tot = totalRow(g, costFields);
                const head = [t[title], t.countLbl, t.grossLbl, t.dedLbl, t.netLbl, t.employerIns, t.totalCost];
                const rowsCsv = [...g.map((x) => [nameFn(x.key), x.count, r2(x.gross_pay), r2(x.total_deductions), r2(x.net_pay), r2(x.insurance_employer), r2(x.cost)]), [t.totalCost, tot.count, r2(tot.gross_pay), r2(tot.total_deductions), r2(tot.net_pay), r2(tot.insurance_employer), r2(tot.cost)]];
                return (
                  <Card key={title} title={t.rptPayroll + ' — ' + t[title]} action={<Btn size="sm" variant="soft" onClick={() => exportRows(head, rowsCsv)}>⬇️ {t.exportExcel}</Btn>}>
                    <div className="mb-3 space-y-2">{g.map((x) => <div key={x.key}><div className="flex justify-between text-xs"><span className="font-semibold text-slate-700">{nameFn(x.key)}</span><span>{money(x.cost)}</span></div><Bar v={x.cost} max={max} /></div>)}</div>
                    <Tbl head={head} rows={[...g.map((x) => ({ cells: [nameFn(x.key), x.count, money(x.gross_pay), money(x.total_deductions), money(x.net_pay), money(x.insurance_employer), money(x.cost)] })), { _total: true, cells: [t.totalCost, tot.count, money(tot.gross_pay), money(tot.total_deductions), money(tot.net_pay), money(tot.insurance_employer), money(tot.cost)] }]} />
                  </Card>
                );
              })}
            </>
          )}
        </>
      )}

      {tab === 'headcount' && (
        <>
          <div className="grid grid-cols-2 gap-3 text-center">
            <div className="rounded-2xl border border-slate-200 bg-white p-3"><p className="text-xs text-slate-500">{t.activeEmployees}</p><p className="text-2xl font-bold">{active.length}</p></div>
            <div className="rounded-2xl border border-slate-200 bg-white p-3"><p className="text-xs text-slate-500">{t.hires} / {t.exits} · {now.getFullYear()}</p>
              <p className="text-2xl font-bold">{data.employees.filter((e) => (e.hire_date || '').startsWith(String(now.getFullYear()))).length} / {data.employees.filter((e) => (e.termination_date || '').startsWith(String(now.getFullYear()))).length}</p></div>
          </div>
          {[['byBranch', (e) => branchName(e.branch_id)], ['byDepartment', (e) => deptName(e.department_id)], ['byGender', (e) => e.gender ? t[e.gender] : '—'], ['byContract', (e) => t.contractTypes[e.contract_type]]].map(([title, keyFn]) => {
            const g = groupSum(active.map((e) => ({ k: keyFn(e) })), (r) => r.k, []).sort((a, b) => b.count - a.count);
            const max = Math.max(...g.map((x) => x.count), 1);
            return (
              <Card key={title} title={t.rptHeadcount + ' — ' + t[title]} action={<Btn size="sm" variant="soft" onClick={() => exportRows([t[title], t.countLbl], g.map((x) => [x.key, x.count]))}>⬇️ {t.exportExcel}</Btn>}>
                <div className="space-y-2">{g.map((x) => <div key={x.key}><div className="flex justify-between text-xs"><span className="font-semibold text-slate-700">{x.key}</span><span>{x.count}</span></div><Bar v={x.count} max={max} /></div>)}</div>
              </Card>
            );
          })}
        </>
      )}

      {tab === 'overtime' && (
        <>
          <MonthRange />
          {pr === null ? <Empty text={t.loading} /> : payrollRows.length === 0 ? <Card><Empty text={t.noRuns} /></Card> : (() => {
            const g = groupSum(payrollRows, (r) => r.employee_id, ['ot_minutes', 'ot_amount', 'late_minutes', 'late_deduction']).sort((a, b) => b.ot_amount - a.ot_amount);
            const tot = totalRow(g, ['ot_minutes', 'ot_amount', 'late_minutes', 'late_deduction']);
            const head = [t.selectEmployee, t.otLbl + ' (' + t.minutesLbl + ')', t.otLbl, t.lateDedLbl + ' (' + t.minutesLbl + ')', t.lateDedLbl];
            return (
              <Card title={t.rptOvertime} action={<Btn size="sm" variant="soft" onClick={() => exportRows(head, [...g.map((x) => [eName(empById(x.key)), x.ot_minutes, r2(x.ot_amount), x.late_minutes, r2(x.late_deduction)]), ['Total', tot.ot_minutes, r2(tot.ot_amount), tot.late_minutes, r2(tot.late_deduction)]])}>⬇️ {t.exportExcel}</Btn>}>
                <Tbl head={head} rows={[...g.map((x) => ({ cells: [eName(empById(x.key)), x.ot_minutes, money(x.ot_amount), x.late_minutes, money(x.late_deduction)] })), { _total: true, cells: ['Σ', tot.ot_minutes, money(tot.ot_amount), tot.late_minutes, money(tot.late_deduction)] }]} />
              </Card>
            );
          })()}
        </>
      )}

      {tab === 'leave' && (
        lv === null ? <Empty text={t.loading} /> : (() => {
          const totDays = leaveRows.reduce((s, r) => s + r.days, 0), totAmt = r2(leaveRows.reduce((s, r) => s + r.amount, 0));
          const head = [t.selectEmployee, t.branch, t.liabilityDays, t.dayRateLbl, t.liabilityAmount];
          return (
            <Card title={t.rptLeave + ' — ' + now.getFullYear()} action={<Btn size="sm" variant="soft" onClick={() => exportRows(head, [...leaveRows.map((r) => [eName(r.emp), branchName(r.emp.branch_id), r.days, r.dayRate, r.amount]), ['Total', '', totDays, '', totAmt]])}>⬇️ {t.exportExcel}</Btn>}>
              <div className="mb-3 grid grid-cols-2 gap-3 text-center">
                <div className="rounded-xl bg-slate-50 p-3"><p className="text-xs text-slate-500">{t.liabilityDays}</p><p className="text-xl font-bold">{totDays}</p></div>
                <div className="rounded-xl bg-brand-50 p-3"><p className="text-xs text-slate-500">{t.liabilityAmount}</p><p className="text-xl font-bold text-brand-800">{money(totAmt)}</p></div>
              </div>
              {leaveRows.length === 0 ? <Empty text={t.noData} /> : <Tbl head={head} rows={leaveRows.map((r) => ({ cells: [eName(r.emp), branchName(r.emp.branch_id), r.days, money(r.dayRate), money(r.amount)] }))} />}
            </Card>
          );
        })()
      )}

      {tab === 'attendance' && (
        <>
          <div className="grid grid-cols-2 gap-2">
            <Input type="date" value={range.from} onChange={(e) => setRange({ ...range, from: e.target.value })} />
            <Input type="date" value={range.to} onChange={(e) => setRange({ ...range, to: e.target.value })} />
          </div>
          {att === null ? <Empty text={t.loading} /> : (() => {
            const head = [t.selectEmployee, t.branch, t.presentDays, t.lateTotal, t.otLbl + ' (' + t.minutesLbl + ')', t.missingOut];
            return (
              <Card title={t.rptAttendance + ' · ' + range.from + ' → ' + range.to} action={<Btn size="sm" variant="soft" onClick={() => exportRows(head, attRows.map((r) => [eName(r.emp), branchName(r.emp.branch_id), r.days, r.late, r.ot, r.missing]))}>⬇️ {t.exportExcel}</Btn>}>
                {attRows.length === 0 ? <Empty text={t.noData} /> : <Tbl head={head} rows={attRows.map((r) => ({ cells: [eName(r.emp), branchName(r.emp.branch_id), r.days, r.late, r.ot, r.missing] }))} />}
              </Card>
            );
          })()}
        </>
      )}
    </>
  );
}

/* =====================================================================
   7k. Sales KPIs & leaderboard
   ===================================================================== */
function KpiPage({ me, data, toast, audit }) {
  const { lang, t } = useL();
  const isHr = ['ceo', 'hr'].includes(me.role);
  const myEmp = data.employees.find((e) => e.user_id === me.id);
  const now = new Date();
  const [month, setMonth] = useState({ y: now.getFullYear(), m: now.getMonth() + 1 });
  const [tab, setTab] = useState('board');
  const [metrics, setMetrics] = useState([]);
  const [entries, setEntries] = useState(null);
  const [form, setForm] = useState(null);
  const [mForm, setMForm] = useState(null);

  const pad2 = (n) => String(n).padStart(2, '0');
  const mFirst = month.y + '-' + pad2(month.m) + '-01';
  const mLast = month.y + '-' + pad2(month.m) + '-' + pad2(new Date(month.y, month.m, 0).getDate());

  useEffect(() => { sb.from('kpi_metrics').select('*').order('sort').then(({ data: d }) => setMetrics(d || [])); }, []);
  useEffect(() => {
    setEntries(null);
    sb.from('kpi_entries').select('*').gte('entry_date', mFirst).lte('entry_date', mLast).order('entry_date', { ascending: false })
      .then(({ data: d }) => setEntries(d || []));
  }, [mFirst]);

  const eName = (e) => e ? ((lang === 'ar' ? e.full_name_ar : e.full_name_en) || e.full_name_en) : '—';
  const empById = (id) => data.employees.find((e) => e.id === id);
  const metricById = (id) => metrics.find((x) => x.id === id);
  const mName = (mt) => mt ? (lang === 'ar' ? mt.name_ar : mt.name_en) : '—';
  const points = (en) => {
    const mt = metricById(en.metric_id); if (!mt) return 0;
    return r2(Number(en.quantity) * Number(mt.points_per_unit) + (Number(en.value_egp) || 0) / 1000000 * Number(mt.value_points_per_million));
  };

  const board = useMemo(() => {
    if (!entries) return [];
    const acc = {};
    for (const en of entries.filter((x) => x.status === 'approved')) {
      const a = acc[en.employee_id] = acc[en.employee_id] || { employee_id: en.employee_id, points: 0, value: 0, counts: {} };
      a.points = r2(a.points + points(en));
      a.value += Number(en.value_egp) || 0;
      const mt = metricById(en.metric_id);
      if (mt) a.counts[mt.code] = (a.counts[mt.code] || 0) + Number(en.quantity);
    }
    return Object.values(acc).sort((a, b) => b.points - a.points);
  }, [entries, metrics]);
  const myRank = myEmp ? board.findIndex((b) => b.employee_id === myEmp.id) + 1 : 0;

  const canApprove = (en) => {
    if (isHr) return true;
    const emp = empById(en.employee_id);
    return !!(myEmp && emp && emp.manager_id === myEmp.id);
  };
  const pending = (entries || []).filter((x) => x.status === 'pending' && canApprove(x) && !(myEmp && x.employee_id === myEmp.id && !isHr));

  async function save() {
    const mt = metricById(form.metric_id);
    const { data: row, error } = await sb.from('kpi_entries').insert({
      employee_id: form.employee_id, metric_id: form.metric_id, entry_date: form.entry_date,
      quantity: Number(form.quantity) || 1, value_egp: mt && mt.has_value ? (Number(form.value_egp) || null) : null,
      reference: form.reference || null, notes: form.notes || null, created_by: me.id,
    }).select().single();
    if (error) return toast(error.message, 'error');
    setEntries((prev) => [row, ...(prev || [])]);
    setForm(null);
    toast(t.saved);
  }

  async function decide(en, status) {
    const { data: row, error } = await sb.from('kpi_entries').update({ status, approved_by: me.id, approved_at: new Date().toISOString() }).eq('id', en.id).select().single();
    if (error) return toast(error.message, 'error');
    setEntries((prev) => prev.map((x) => (x.id === row.id ? row : x)));
    audit(status === 'approved' ? 'approve' : 'reject', 'kpi_entries', row.id, en, row);
    toast(t.saved);
  }

  async function removeEntry(en) {
    if (!window.confirm(t.confirmDel)) return;
    const { error } = await sb.from('kpi_entries').delete().eq('id', en.id);
    if (error) return toast(error.message, 'error');
    setEntries((prev) => prev.filter((x) => x.id !== en.id));
  }

  async function saveMetric() {
    const payload = { name_en: mForm.name_en, name_ar: mForm.name_ar, points_per_unit: Number(mForm.points_per_unit) || 0,
      value_points_per_million: Number(mForm.value_points_per_million) || 0, has_value: !!mForm.has_value, is_active: mForm.is_active !== false };
    let res;
    if (mForm.id) res = await sb.from('kpi_metrics').update(payload).eq('id', mForm.id).select().single();
    else res = await sb.from('kpi_metrics').insert({ ...payload, code: (mForm.code || mForm.name_en).toLowerCase().replace(/[^a-z0-9]+/g, '_'), sort: metrics.length + 1 }).select().single();
    if (res.error) return toast(res.error.message, 'error');
    setMetrics((prev) => (mForm.id ? prev.map((x) => (x.id === res.data.id ? res.data : x)) : [...prev, res.data]));
    setMForm(null);
    toast(t.saved);
  }

  const tabs = [['board', t.leaderboard], ...(myEmp ? [['mine', t.myEntries]] : []), ...(pending.length || isHr || (myEmp && data.employees.some((e) => e.manager_id === myEmp.id)) ? [['approvals', t.approvals + (pending.length ? ' (' + pending.length + ')' : '')]] : []), ...(isHr ? [['metrics', t.metricsTab]] : [])];
  const kTone = (s) => s === 'approved' ? 'green' : s === 'rejected' ? 'red' : 'amber';
  const medal = (i) => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';

  const EntryRow = ({ en, showName, actions }) => (
    <li className="space-y-2 py-2.5">
      <div className="flex items-center justify-between gap-2">
        <div className="min-w-0">
          <p className="truncate text-sm font-semibold text-slate-800">{showName ? eName(empById(en.employee_id)) + ' · ' : ''}{mName(metricById(en.metric_id))} × {Number(en.quantity)}</p>
          <p className="text-xs text-slate-500">{en.entry_date}{en.reference ? ' · ' + en.reference : ''}{en.value_egp ? ' · ' + money(en.value_egp) : ''} · <b>{points(en)} {t.pointsLbl}</b></p>
        </div>
        <Badge tone={kTone(en.status)}>{t.kpiStatus[en.status]}</Badge>
      </div>
      {actions}
    </li>
  );

  return (
    <>
      <div className="flex items-center gap-2">
        <div className="no-scrollbar flex flex-1 gap-2 overflow-x-auto">
          {tabs.map(([k, l]) => <button key={k} onClick={() => setTab(k)} className={cx('shrink-0 rounded-full px-3.5 py-1.5 text-sm font-semibold', tab === k ? 'bg-brand-700 text-white' : 'border border-slate-300 bg-white text-slate-600')}>{l}</button>)}
        </div>
        <Input type="month" className="!w-auto" value={month.y + '-' + pad2(month.m)} onChange={(e) => { const [y, m] = e.target.value.split('-'); if (y && m) setMonth({ y: Number(y), m: Number(m) }); }} />
      </div>

      {tab === 'board' && (
        <>
          {board.length > 0 && (
            <div className="rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 p-5 text-white shadow">
              <p className="text-sm opacity-90">🏆 {t.winner} · {month.m}/{month.y}</p>
              <p className="text-2xl font-bold">{eName(empById(board[0].employee_id))}</p>
              <p className="text-sm opacity-90">{board[0].points} {t.pointsLbl}{board[0].value ? ' · ' + money(board[0].value) : ''}</p>
            </div>
          )}
          {myEmp && myRank > 0 && <p className="text-center text-sm text-slate-600">{t.yourRank}: <b>#{myRank}</b> · {board[myRank - 1].points} {t.pointsLbl}</p>}
          <Card title={t.leaderboard}>
            {entries === null ? <Empty text={t.loading} /> : board.length === 0 ? <Empty text={t.noResults} /> : (
              <ul className="divide-y divide-slate-100">
                {board.map((b, i) => (
                  <li key={b.employee_id} className={cx('flex items-center gap-3 py-3', myEmp && b.employee_id === myEmp.id && 'rounded-lg bg-brand-50 px-2')}>
                    <span className="w-8 text-center text-lg font-bold">{medal(i)}</span>
                    <div className="min-w-0 flex-1">
                      <p className="truncate text-sm font-semibold text-slate-800">{eName(empById(b.employee_id))}</p>
                      <p className="truncate text-xs text-slate-500">{metrics.filter((mt) => b.counts[mt.code]).map((mt) => mName(mt) + ' ' + b.counts[mt.code]).join(' · ')}{b.value ? ' · ' + money(b.value) : ''}</p>
                    </div>
                    <span className="shrink-0 text-base font-bold text-brand-800">{b.points}</span>
                  </li>
                ))}
              </ul>
            )}
          </Card>
        </>
      )}

      {tab === 'mine' && myEmp && (
        <>
          <Btn size="lg" onClick={() => setForm({ employee_id: myEmp.id, metric_id: (metrics[0] || {}).id || '', entry_date: todayISO(), quantity: 1, value_egp: '', reference: '', notes: '' })}>+ {t.addEntry}</Btn>
          <Card title={t.myEntries}>
            {entries === null ? <Empty text={t.loading} /> : entries.filter((x) => x.employee_id === myEmp.id).length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100">
                {entries.filter((x) => x.employee_id === myEmp.id).map((en) => <EntryRow key={en.id} en={en} showName={false}
                  actions={en.status === 'pending' ? <Btn size="sm" variant="ghost" className="text-rose-600" onClick={() => removeEntry(en)}>{t.del}</Btn> : null} />)}
              </ul>
            )}
          </Card>
        </>
      )}

      {tab === 'approvals' && (
        <>
          {(isHr || (myEmp && data.employees.some((e) => e.manager_id === myEmp.id))) && (
            <Btn onClick={() => setForm({ employee_id: '', metric_id: (metrics[0] || {}).id || '', entry_date: todayISO(), quantity: 1, value_egp: '', reference: '', notes: '' })}>+ {t.addEntry}</Btn>
          )}
          <Card title={t.approvals}>
            {entries === null ? <Empty text={t.loading} /> : pending.length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100">
                {pending.map((en) => <EntryRow key={en.id} en={en} showName={true}
                  actions={<div className="flex gap-2"><Btn size="sm" className="flex-1" onClick={() => decide(en, 'approved')}>{t.approve}</Btn><Btn size="sm" variant="danger" className="flex-1" onClick={() => decide(en, 'rejected')}>{t.reject}</Btn></div>} />)}
              </ul>
            )}
          </Card>
        </>
      )}

      {tab === 'metrics' && (
        <Card title={t.metricsTab} action={<Btn size="sm" onClick={() => setMForm({ name_en: '', name_ar: '', code: '', points_per_unit: 1, value_points_per_million: 0, has_value: false, is_active: true })}>+ {t.add}</Btn>}>
          <ul className="divide-y divide-slate-100">
            {metrics.map((mt) => (
              <li key={mt.id} className="flex items-center justify-between gap-2 py-2.5">
                <div><p className="text-sm font-semibold text-slate-800">{mName(mt)}{!mt.is_active && <Badge tone="red"> {t.inactiveLbl}</Badge>}</p>
                  <p className="text-xs text-slate-500">{Number(mt.points_per_unit)} {t.perUnit}{mt.has_value ? ' · ' + Number(mt.value_points_per_million) + ' ' + t.perMillion : ''}</p></div>
                <Btn variant="ghost" size="sm" onClick={() => setMForm({ ...mt })}>{t.edit}</Btn>
              </li>
            ))}
          </ul>
        </Card>
      )}

      <Modal open={!!form} onClose={() => setForm(null)} title={t.addEntry}
        footer={<><Btn className="flex-1" disabled={!form || !form.employee_id || !form.metric_id} onClick={save}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setForm(null)}>{t.cancel}</Btn></>}>
        {form && (
          <>
            {(!myEmp || form.employee_id !== myEmp.id) && (
              <Field label={t.selectEmployee}>
                <Select value={form.employee_id} onChange={(e) => setForm({ ...form, employee_id: e.target.value })}>
                  <option value="">—</option>
                  {data.employees.filter((e) => e.status === 'active' && (isHr || (myEmp && e.manager_id === myEmp.id))).map((e) => <option key={e.id} value={e.id}>{eName(e)}</option>)}
                </Select>
              </Field>
            )}
            <Field label={t.kpi}>
              <Select value={form.metric_id} onChange={(e) => setForm({ ...form, metric_id: e.target.value })}>
                {metrics.filter((x) => x.is_active).map((mt) => <option key={mt.id} value={mt.id}>{mName(mt)} · {Number(mt.points_per_unit)} {t.pointsLbl}</option>)}
              </Select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.date}><Input type="date" value={form.entry_date} onChange={(e) => setForm({ ...form, entry_date: e.target.value })} /></Field>
              <Field label={t.quantityLbl}><Input type="number" inputMode="numeric" min="1" value={form.quantity} onChange={(e) => setForm({ ...form, quantity: e.target.value })} /></Field>
            </div>
            {(metricById(form.metric_id) || {}).has_value && (
              <Field label={t.dealValue}><Input type="number" inputMode="decimal" value={form.value_egp} onChange={(e) => setForm({ ...form, value_egp: e.target.value })} /></Field>
            )}
            <Field label={t.referenceLbl}><Input value={form.reference} onChange={(e) => setForm({ ...form, reference: e.target.value })} /></Field>
            <Field label={t.notes}><Input value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
          </>
        )}
      </Modal>

      <Modal open={!!mForm} onClose={() => setMForm(null)} title={t.metricsTab}
        footer={<><Btn className="flex-1" disabled={!mForm || !(mForm.name_en || mForm.name_ar)} onClick={saveMetric}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setMForm(null)}>{t.cancel}</Btn></>}>
        {mForm && (
          <>
            <Field label={t.nameAr}><Input value={mForm.name_ar} onChange={(e) => setMForm({ ...mForm, name_ar: e.target.value })} /></Field>
            <Field label={t.nameEn}><Input value={mForm.name_en} onChange={(e) => setMForm({ ...mForm, name_en: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.perUnit}><Input type="number" step="0.5" value={mForm.points_per_unit} onChange={(e) => setMForm({ ...mForm, points_per_unit: e.target.value })} /></Field>
              <Field label={t.perMillion}><Input type="number" step="0.5" value={mForm.value_points_per_million} onChange={(e) => setMForm({ ...mForm, value_points_per_million: e.target.value })} /></Field>
            </div>
            <label className="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" className="h-5 w-5 accent-brand-700" checked={!!mForm.has_value} onChange={(e) => setMForm({ ...mForm, has_value: e.target.checked })} />{t.hasValue}</label>
            <label className="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" className="h-5 w-5 accent-brand-700" checked={mForm.is_active !== false} onChange={(e) => setMForm({ ...mForm, is_active: e.target.checked })} />{t.active}</label>
          </>
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   8. Settings
   ===================================================================== */
function SettingsPage({ me, data, refresh, toast, audit }) {
  const { t } = useL();
  const tabs = [
    { k: 'company', label: t.company },
    { k: 'workWeek', label: t.workWeek },
    { k: 'shifts', label: t.shiftsLbl },
    { k: 'branches', label: t.branches },
    { k: 'holidays', label: t.holidays },
    { k: 'tax', label: t.tax },
    { k: 'insurance', label: t.insurance },
  ];
  const [tab, setTab] = useState('company');
  const props = { me, data, refresh, toast, audit };

  return (
    <>
      <div className="no-scrollbar flex gap-2 overflow-x-auto pb-1">
        {tabs.map((x) => (
          <button key={x.k} onClick={() => setTab(x.k)}
            className={cx('shrink-0 rounded-full px-3.5 py-1.5 text-sm font-semibold', tab === x.k ? 'bg-brand-700 text-white' : 'border border-slate-300 bg-white text-slate-600')}>
            {x.label}
          </button>
        ))}

      {tab === 'branches' && <BranchSettings {...props} />}
      {tab === 'holidays' && <HolidaySettings {...props} />}
      {tab === 'tax' && <TaxSettings {...props} />}

  );
}

/** Shared save for the app_settings key/value table. */
function useSettingSaver({ me, refresh, toast, audit }) {
  const { t } = useL();
  return useCallback(async (key, value, before) => {
    const { data: row, error } = await sb.from('app_settings')
      .update({ value, updated_by: me.id }).eq('key', key).select().single();
    if (error) return toast(error.message, 'error');
    refresh.settings((prev) => ({ ...prev, [key]: row.value }));
    audit('update', 'app_settings', key, before, row.value);
    toast(t.savedSettings);
  }, [me.id, refresh, toast, audit, t]);
}

function CompanySettings(props) {
  const { t } = useL();
  const save = useSettingSaver(props);
  const initial = props.data.settings.company || {};
  const [f, setF] = useState(initial);
  useEffect(() => { setF(props.data.settings.company || {}); }, [props.data.settings.company]);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  return (
    <Card title={t.company}>
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label={t.nameAr}><Input value={f.name_ar || ''} onChange={set('name_ar')} /></Field>
        <Field label={t.nameEn}><Input value={f.name_en || ''} onChange={set('name_en')} /></Field>
        <Field label={t.city}><Input value={f.city || ''} onChange={set('city')} /></Field>
        <Field label={t.country}><Input value={f.country || ''} onChange={set('country')} /></Field>
        <Field label={t.currency}><Input value={f.currency || 'EGP'} onChange={set('currency')} /></Field>
        <Field label={t.taxFileNo}><Input value={f.tax_file_no || ''} onChange={set('tax_file_no')} /></Field>
        <Field label={t.taxOffice}><Input value={f.tax_office || ''} onChange={set('tax_office')} /></Field>
        <Field label={t.nosiOffice}><Input value={f.nosi_office || ''} onChange={set('nosi_office')} /></Field>
        <Field label={t.employerNo}><Input dir="ltr" value={f.nosi_employer_no || ''} onChange={set('nosi_employer_no')} /></Field>

function TaxSettings({ data, refresh, toast, audit }) {
  const { t } = useL();
  const [rows, setRows] = useState(data.taxBrackets);
  const [exemption, setExemption] = useState(data.taxSettings?.personal_exemption_annual ?? 20000);
  const [demo, setDemo] = useState(120000);
  useEffect(() => { setRows(data.taxBrackets); }, [data.taxBrackets]);
  useEffect(() => { setExemption(data.taxSettings?.personal_exemption_annual ?? 20000); }, [data.taxSettings]);

  const effective = data.taxSettings?.effective_from || '2025-01-01';

  const setCell = (i, k, v) => setRows(rows.map((r, idx) => (idx === i ? { ...r, [k]: v } : r)));

  function addRow() {
    const last = rows[rows.length - 1];
    setRows([...rows, { id: null, effective_from: effective, seq: rows.length + 1, lower_bound: last ? (last.upper_bound ?? 0) : 0, upper_bound: null, rate: 0 }]);
  }

  async function save() {
    const clean = rows.map((r, i) => ({
      effective_from: effective, seq: i + 1,
      lower_bound: Number(r.lower_bound) || 0,
      upper_bound: r.upper_bound === '' || r.upper_bound == null ? null : Number(r.upper_bound),
      rate: Number(r.rate) || 0,
    }));
    // Replace the whole set for this effective date. If the insert fails we
    // put the previous brackets straight back, so a bad edit can never leave
    // the company with no tax table.
    const previous = data.taxBrackets.map((r) => ({
      effective_from: r.effective_from, seq: r.seq, lower_bound: r.lower_bound,
      upper_bound: r.upper_bound, rate: r.rate,
    }));
    const { error: delErr } = await sb.from('tax_brackets').delete().eq('effective_from', effective);
    if (delErr) return toast(delErr.message, 'error');
    const { data: saved, error } = await sb.from('tax_brackets').insert(clean).select();
    if (error) {
      if (previous.length) await sb.from('tax_brackets').insert(previous);
      return toast(error.message, 'error');
    }
    const sorted = saved.sort((a, b) => a.seq - b.seq);
    refresh.taxBrackets(() => sorted);
    audit('update', 'tax_brackets', effective, data.taxBrackets, sorted);

    const { data: ts, error: tsErr } = await sb.from('tax_settings')
      .update({ personal_exemption_annual: Number(exemption) })
      .eq('effective_from', effective).select().single();
    if (tsErr) return toast(tsErr.message, 'error');
    refresh.taxSettings(() => ts);
    audit('update', 'tax_settings', effective, data.taxSettings, ts);
    toast(t.saved);
  }

  const taxable = Math.max(0, Number(demo) - Number(exemption));
  const annualTax = calcAnnualTax(taxable, rows.map((r) => ({ ...r, rate: Number(r.rate) })));

  return (
    <>
      <Card title={t.tax} action={<Btn size="sm" variant="soft" onClick={addRow}>+ {t.addBracket}</Btn>}>
        <p className="mb-3 text-xs text-slate-500">{t.taxHint}</p>
        <Field label={t.personalExemption}>
          <Input type="number" inputMode="decimal" value={exemption} onChange={(e) => setExemption(e.target.value)} />
        </Field>

        <div className="mt-4 space-y-2">
          {rows.map((r, i) => (
            <div key={i} className="grid grid-cols-[1fr_1fr_5rem_2rem] items-end gap-2">
              <Field label={i === 0 ? t.from : ''}>
                <Input type="number" inputMode="decimal" value={r.lower_bound ?? ''} onChange={(e) => setCell(i, 'lower_bound', e.target.value)} />
              </Field>
              <Field label={i === 0 ? t.to : ''}>
                <Input type="number" inputMode="decimal" placeholder={t.upTo} value={r.upper_bound ?? ''} onChange={(e) => setCell(i, 'upper_bound', e.target.value === '' ? null : e.target.value)} />
              </Field>
              <Field label={i === 0 ? t.rate : ''}>
                <Input type="number" inputMode="decimal" step="0.0001" value={r.rate ?? 0} onChange={(e) => setCell(i, 'rate', e.target.value)} />
              </Field>
              <button onClick={() => setRows(rows.filter((_, idx) => idx !== i))}
                className="mb-1 rounded-lg px-2 py-2 text-lg leading-none text-rose-500 hover:bg-rose-50">&times;</button>
            </div>
          ))}
        </div>
        <p className="mt-2 text-xs text-slate-400">{t.rate}: 0.20 = 20%</p>
        <Btn className="mt-4" onClick={save}>{t.save}</Btn>
      </Card>

      <Card title={t.preview}>
        <Field label={t.annualIncome}><Input type="number" inputMode="decimal" value={demo} onChange={(e) => setDemo(e.target.value)} /></Field>
        <div className="mt-3 grid grid-cols-2 gap-3 text-center">
          <div className="rounded-xl bg-slate-50 p-3">
            <p className="text-xs text-slate-500">{t.taxDue}</p>
            <p className="text-lg font-bold text-slate-800">{money(annualTax)}</p>
          </div>
          <div className="rounded-xl bg-slate-50 p-3">
            <p className="text-xs text-slate-500">{t.monthlyTax}</p>
            <p className="text-lg font-bold text-slate-800">{money(annualTax / 12)}</p>
          </div>
        </div>
      </Card>
    </>
  );
}

    let qb = sb.from('audit_log').select('*').eq('source', f.source).order('created_at', { ascending: false }).range(offset, offset + PAGE - 1);
    if (f.entity) qb = qb.eq('entity', f.entity);
    if (f.action) qb = qb.eq('action', f.action);
    if (f.from) qb = qb.gte('created_at', new Date(f.from + 'T00:00:00').toISOString());
    if (f.to) { const d = new Date(f.to + 'T00:00:00'); d.setDate(d.getDate() + 1); qb = qb.lt('created_at', d.toISOString()); }
    const { data, error } = await qb;
    if (error) return;
    setRows((prev) => (offset === 0 ? data : [...(prev || []), ...data]));
    setMore(data.length === PAGE);
  }
  useEffect(() => { setRows(null); load(0); }, [f.source, f.entity, f.action, f.from, f.to]);

  const q = f.q.trim().toLowerCase();
  const list = (rows || []).filter((r) => !q || (r.actor_email || '').toLowerCase().includes(q) || (r.entity_id || '').toLowerCase().includes(q) || (r.note || '').toLowerCase().includes(q));
  const actions = ['insert', 'update', 'delete', 'approve', 'reject', 'cancel', 'lock', 'unlock'];

  /** Keys whose value changed between before and after. */
  const diff = (r) => {
    const b = r.before_data || {}, a = r.after_data || {};
    const keys = [...new Set([...Object.keys(b), ...Object.keys(a)])].filter((k) => !['updated_at', 'created_at'].includes(k));
    return keys.filter((k) => JSON.stringify(b[k]) !== JSON.stringify(a[k])).map((k) => [k, b[k], a[k]]);
  };
  const fmtV = (v) => v == null ? '—' : typeof v === 'object' ? JSON.stringify(v) : String(v);

  return (
    <>
      <div className="grid grid-cols-2 gap-2">
        <Select value={f.source} onChange={(e) => setF({ ...f, source: e.target.value })}>
          <option value="app">{t.srcApp}</option><option value="db">{t.srcDb}</option>
        </Select>
        <Select value={f.entity} onChange={(e) => setF({ ...f, entity: e.target.value })}>
          <option value="">{t.entity}: {t.allLbl}</option>
          {ENTITIES.map((x) => <option key={x} value={x}>{x}</option>)}
        </Select>
        <Select value={f.action} onChange={(e) => setF({ ...f, action: e.target.value })}>
          <option value="">{t.action}: {t.allLbl}</option>
          {actions.map((x) => <option key={x} value={x}>{x}</option>)}
        </Select>
        <Input placeholder={t.search} value={f.q} onChange={(e) => setF({ ...f, q: e.target.value })} />
        <Input type="date" value={f.from} onChange={(e) => setF({ ...f, from: e.target.value })} />
        <Input type="date" value={f.to} onChange={(e) => setF({ ...f, to: e.target.value })} />
      </div>

      <Card title={t.audit + (rows ? ' (' + list.length + ')' : '')}>
        {rows === null ? <Empty text={t.loading} /> : list.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {list.map((r) => (
              <li key={r.id} className="cursor-pointer py-2.5" onClick={() => setView(r)}>
                <div className="flex items-center justify-between gap-2">
                  <p className="truncate text-sm font-semibold text-slate-800">{r.entity} · {r.action}</p>
                  <span className="shrink-0 text-xs text-slate-400">{fmtDateTime(r.created_at)}</span>
                </div>
                <p className="truncate text-xs text-slate-500">{r.actor_email || (r.source === 'db' ? 'system / SQL' : '—')} {r.actor_role ? '(' + r.actor_role + ')' : ''} {r.entity_id ? '#' + String(r.entity_id).slice(0, 8) : ''}</p>
              </li>
            ))}
          </ul>
        )}
        {more && <Btn variant="outline" className="mt-3 w-full" onClick={() => load(rows.length)}>{t.loadMore}</Btn>}
      </Card>

      <Modal open={!!view} onClose={() => setView(null)} title={view ? view.entity + ' · ' + view.action : ''}>
        {view && (
          <>
            <p className="text-xs text-slate-500">{view.actor_email || 'system'} · {fmtDateTime(view.created_at)} · #{view.entity_id}</p>
            {diff(view).length === 0 ? <Empty text={t.noData} /> : (
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead><tr className="text-slate-400"><th className="py-1 text-start">{t.changes}</th><th className="py-1 text-start">{t.before}</th><th className="py-1 text-start">{t.after}</th></tr></thead>
                  <tbody>
                    {diff(view).map(([k, b, a]) => (
                      <tr key={k} className="border-t border-slate-100 align-top">
                        <td className="py-1 pe-2 font-semibold text-slate-700">{k}</td>
                        <td className="max-w-[140px] break-words py-1 pe-2 text-rose-600" dir="auto">{fmtV(b)}</td>
                        <td className="max-w-[140px] break-words py-1 text-emerald-700" dir="auto">{fmtV(a)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </>
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   10. Profile
   ===================================================================== */
function ProfilePage({ me, setMe, toast }) {
  const { lang, t, setLang } = useL();
  const [f, setF] = useState(me);
  useEffect(() => { setF(me); }, [me]);

  async function save() {
    const { data: row, error } = await sb.from('app_users')
      .update({ full_name_en: f.full_name_en, full_name_ar: f.full_name_ar, phone: f.phone, lang })
      .eq('id', me.id).select().single();
    if (error) return toast(error.message, 'error');
    setMe(row);
    toast(t.saved);
  }

  return (
    <Card title={t.profile}>
      <Field label={t.email}><Input value={me.email} disabled /></Field>
      <Field label={t.role}><Input value={t.roles[me.role]} disabled /></Field>
      <Field label={t.fullNameAr}><Input value={f.full_name_ar || ''} onChange={(e) => setF({ ...f, full_name_ar: e.target.value })} /></Field>
      <Field label={t.fullNameEn}><Input value={f.full_name_en || ''} onChange={(e) => setF({ ...f, full_name_en: e.target.value })} /></Field>
      <Field label={t.phone}><Input value={f.phone || ''} onChange={(e) => setF({ ...f, phone: e.target.value })} /></Field>
      <Field label={t.language}>
        <Select value={lang} onChange={(e) => setLang(e.target.value)}>
          <option value="ar">العربية</option>
          <option value="en">English</option>
        </Select>
      </Field>
      <Btn className="mt-4" onClick={save}>{t.save}</Btn>
      <p className="mt-4 text-center text-xs text-slate-400">{APP_VERSION}</p>
    </Card>
  );
}

/* =====================================================================
   11. Root
   ===================================================================== */
function App() {
  const [lang, setLangState] = useState(() => safeStorage.getItem('hv_lang') || 'ar');
  const [session, setSession] = useState(undefined);   // undefined = still checking
  const [me, setMe] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [msg, setMsg] = useState(null);
  const [ready, setReady] = useState(false);

  const [users, setUsers] = useState([]);
  const [invites, setInvites] = useState([]);
  const [branches, setBranches] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [settings, setSettings] = useState({});
  const [taxBrackets, setTaxBrackets] = useState([]);
  const [taxSettings, setTaxSettings] = useState(null);
  const [insurance, setInsurance] = useState(null);
  const [employees, setEmployees] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [expiringDocs, setExpiringDocs] = useState([]);
  const [shifts, setShifts] = useState([]);

  const t = T[lang];

  // Persist language choice: locally always, and to the user's profile
  // when signed in — otherwise the next profile load snaps it back.
  const meRef = useRef(null);
  const setLang = useCallback((l) => {
    setLangState(l);
    safeStorage.setItem('hv_lang', l);
    if (meRef.current && sb) {
      sb.from('app_users').update({ lang: l }).eq('id', meRef.current.id).then(() => {});
    }
  }, []);

  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  }, [lang]);

  const toast = useCallback((text, type) => {
    setMsg({ text, type });
    setTimeout(() => setMsg(null), 3500);
  }, []);

  /* auth session */
  useEffect(() => {
    if (!CONFIGURED) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => sub.subscription.unsubscribe();
  }, []);

  /* load everything once signed in */
  useEffect(() => {
    if (!session) { setMe(null); meRef.current = null; setReady(false); return; }
    let cancelled = false;

    (async () => {
      const uid = session.user.id;
      const { data: profile, error } = await sb.from('app_users').select('*').eq('id', uid).maybeSingle();
      if (cancelled) return;
      if (error) { toast(error.message, 'error'); return; }
      if (!profile) { toast('Profile not found. Run migration_001.sql first.', 'error'); return; }
      if (!profile.is_active) { toast(t.inactive, 'error'); await sb.auth.signOut(); return; }

      setMe(profile);
      meRef.current = profile;
      // The profile's language only wins when this device has no local
      // choice yet (first login on a new phone) — a language the user
      // picked here must never be overridden by a background reload.
      if (!safeStorage.getItem('hv_lang') && profile.lang && profile.lang !== lang) setLang(profile.lang);
      sb.from('app_users').update({ last_login_at: new Date().toISOString() }).eq('id', uid).then(() => {});

      // employees is loaded for everyone: RLS trims it to "just me" for
      // staff and "my team" for managers, so the same code serves all roles.
      const [b, h, s, tb, ts, ir, dep, emp, sh] = await Promise.all([
        sb.from('branches').select('*').order('code'),
        sb.from('holidays').select('*').order('holiday_date'),
        sb.from('app_settings').select('*'),
        sb.from('tax_brackets').select('*').order('seq'),
        sb.from('tax_settings').select('*').order('effective_from', { ascending: false }).limit(1).maybeSingle(),
        sb.from('insurance_rates').select('*').order('effective_from', { ascending: false }).limit(1).maybeSingle(),
        sb.from('departments').select('*').order('name_en'),
        sb.from('employees').select('*').order('full_name_en'),
        sb.from('shifts').select('*').order('start_time'),
      ]);
      if (cancelled) return;
      setBranches(b.data || []);
      setHolidays(h.data || []);
      setSettings(Object.fromEntries((s.data || []).map((r) => [r.key, r.value])));
      setTaxBrackets(tb.data || []);
      setTaxSettings(ts.data || null);
      setInsurance(ir.data || null);
      setDepartments(dep.data || []);
      setEmployees(emp.data || []);
      setShifts(sh.data || []);

      if (['ceo', 'hr', 'accountant', 'manager'].includes(profile.role)) {
        const in60 = new Date(Date.now() + 60 * 86400000).toISOString().slice(0, 10);
        const [u, inv, xd] = await Promise.all([
          sb.from('app_users').select('*').order('created_at'),
          sb.from('user_invites').select('*').order('created_at', { ascending: false }),
          sb.from('employee_documents').select('*').not('expiry_date', 'is', null).lte('expiry_date', in60).order('expiry_date'),
        ]);
        if (cancelled) return;
        setUsers(u.data || []);
        setInvites(inv.data || []);
        setExpiringDocs(xd.data || []);
      }
      setReady(true);
    })();

    return () => { cancelled = true; };
    // Keyed on the user id, not the session object: Supabase refreshes the
    // token in the background (and on tab focus), which yields a new session
    // object for the same user — that must not re-trigger a full reload.
  }, [session && session.user.id]);

  /* audit helper -- every sensitive write goes through here */
  const audit = useCallback(async (action, entity, entityId, before, after) => {
    if (!me) return;
    await sb.from('audit_log').insert({
      actor_id: me.id, actor_email: me.email, actor_role: me.role,
      action, entity, entity_id: entityId == null ? null : String(entityId),
      before_data: before ?? null, after_data: after ?? null,
    });
  }, [me]);

  const ctx = useMemo(() => ({ lang, t, setLang }), [lang, t, setLang]);

  if (session === undefined) {
    return <L.Provider value={ctx}><div className="flex h-full items-center justify-center text-slate-400">{t.loading}</div></L.Provider>;
  }

  if (!session || !me) {
    return (
      <L.Provider value={ctx}>
        <Toast msg={msg} />
        <AuthScreen toast={toast} />
      </L.Provider>
    );
  }

  const data = { users, invites, branches, holidays, settings, taxBrackets, taxSettings, insurance, employees, departments, expiringDocs, shifts };
  const refresh = {
    users: setUsers, invites: setInvites, branches: setBranches, holidays: setHolidays,
    settings: setSettings, taxBrackets: setTaxBrackets, taxSettings: setTaxSettings, insurance: setInsurance,
    employees: setEmployees, departments: setDepartments, expiringDocs: setExpiringDocs, shifts: setShifts,
  };
  const shared = { me, setMe, data, refresh, toast, audit };
  const allowed = NAV.find((n) => n.key === page)?.roles.includes(me.role);

  return (
    <L.Provider value={ctx}>
      <Toast msg={msg} />
      <Shell me={me} page={page} setPage={setPage} onSignOut={() => sb.auth.signOut()}>
        {!ready ? <Empty text={t.loading} />
          : !allowed ? <Card><Empty text={t.noPermission} /></Card>
          : page === 'dashboard' ? (me.role === 'staff' ? <MyPage {...shared} setPage={setPage} /> : <Dashboard {...shared} />)
          : page === 'me' ? <MyPage {...shared} setPage={setPage} />
          : page === 'attendance' ? <AttendancePage {...shared} />
          : page === 'leave' ? <LeavePage {...shared} />
          : page === 'kpi' ? <KpiPage {...shared} />
          : page === 'employees' ? <EmployeesPage {...shared} />
          : page === 'payroll' ? <PayrollPage {...shared} />
          : page === 'loans' ? <LoansPage {...shared} />
          : page === 'jobs' ? <JobsPage {...shared} />
          : page === 'compliance' ? <CompliancePage {...shared} />
          : page === 'reports' ? <ReportsPage {...shared} />
          : page === 'users' ? <UsersPage {...shared} />
          : page === 'settings' ? <SettingsPage {...shared} />
          : page === 'audit' ? <AuditPage {...shared} />
          : page === 'profile' ? <ProfilePage {...shared} />
          : null}
      </Shell>
    </L.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
