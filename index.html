/* ---------------------------------------------------------------------
   CONFIG -- Supabase project.
   Both values are safe to keep in this file: this is the *publishable*
   key, which is public by design. Row Level Security is what actually
   protects the data. Never put the service_role / secret key here.
   --------------------------------------------------------------------- */
const SUPABASE_URL      = 'https://plwyzkqlbzcikmuurjqg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jdkL0GvmNoJGHnzadNAqgA_vuiFLthv';

const CONFIGURED = !SUPABASE_URL.startsWith('PASTE_');

/* Some phones block localStorage (private browsing, restricted cookie
   settings). Touching it directly would throw and leave the user staring
   at a blank white screen, so fall back to in-memory storage instead:
   the app still works, the session just does not survive a reload. */
const safeStorage = (() => {
  try {
    const probe = '__hv_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    return window.localStorage;
  } catch (e) {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => { mem.set(k, String(v)); },
      removeItem: (k) => { mem.delete(k); },
    };
  }
})();

const sb = CONFIGURED
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { storage: safeStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    })
  : null;

const cx = (...a) => a.filter(Boolean).join(' ');
const todayISO = () => new Date().toISOString().slice(0, 10);
const money = (n, cur) => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + (cur || 'EGP');
const pct = (n) => (Number(n) * 100).toFixed(2).replace(/\.00$/, '');

/** Egyptian national ID: [century][YYMMDD][gov][serial][check].
    Digit 1: 2 = 1900s, 3 = 2000s. Digit 13 odd = male, even = female. */
function parseNationalId(nid) {
  if (!/^[23]\d{13}$/.test(nid)) return null;
  const century = nid[0] === '2' ? 1900 : 2000;
  const y = century + Number(nid.slice(1, 3));
  const m = Number(nid.slice(3, 5));
  const d = Number(nid.slice(5, 7));
  const date = new Date(Date.UTC(y, m - 1, d));
  if (date.getUTCFullYear() !== y || date.getUTCMonth() !== m - 1 || date.getUTCDate() !== d) return null;
  const pad = (n) => String(n).padStart(2, '0');
  return {
    birth_date: y + '-' + pad(m) + '-' + pad(d),
    gender: Number(nid[12]) % 2 === 1 ? 'male' : 'female',
  };
}

/** Whole days from today until dateStr (negative = already past). */
const daysUntil = (dateStr) => Math.floor((new Date(dateStr + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);

/** Great-circle distance between two GPS points, in kilometers. */
function haversineKm(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180, R = 6371;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/** Promise wrapper around the browser GPS. */
const getGps = () => new Promise((resolve, reject) => {
  if (!navigator.geolocation) return reject(new Error('no geolocation'));
  navigator.geolocation.getCurrentPosition(
    (p) => resolve({ lat: Number(p.coords.latitude.toFixed(6)), lng: Number(p.coords.longitude.toFixed(6)), acc: Math.round(p.coords.accuracy) }),
    (e) => reject(e), { enableHighAccuracy: true, timeout: 20000, maximumAge: 10000 }
  );
});

/** Minimal Markdown -> HTML for AI-generated documents (headings, bullets,
    bold, hr). Input is escaped first, so generated text can't inject HTML. */
function mdToHtml(md) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const lines = String(md || '').split('\n');
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^\s*[-*]\s+/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>';
    } else if (/^###\s+/.test(line)) { closeList(); html += '<h3>' + inline(line.slice(4)) + '</h3>'; }
    else if (/^##\s+/.test(line)) { closeList(); html += '<h2>' + inline(line.slice(3)) + '</h2>'; }
    else if (/^#\s+/.test(line)) { closeList(); html += '<h1>' + inline(line.slice(2)) + '</h1>'; }
    else if (/^\s*---+\s*$/.test(line)) { closeList(); html += '<hr/>'; }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); html += '<p>' + inline(line) + '</p>'; }
  }
  closeList();
  return html;
}

/** Open a print-ready window for a generated document. */
function printDoc(title, md, dirRtl) {
  const w = window.open('', '_blank');
  if (!w) return;
  w.document.write('<!doctype html><html dir="' + (dirRtl ? 'rtl' : 'ltr') + '"><head><meta charset="utf-8"><title>' + title + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">' +
    '<style>body{font-family:Cairo,Inter,sans-serif;max-width:800px;margin:32px auto;padding:0 28px;color:#111;line-height:1.7}' +
    'h1{font-size:22px;color:#12405c;border-bottom:3px solid #1d6fa3;padding-bottom:10px}h2{font-size:17px;color:#1a4a60;margin-top:22px}' +
    'h3{font-size:15px;color:#1a4a60}li{margin:4px 0}hr{margin:26px 0;border:none;border-top:1.5px solid #cbd5e1}' +
    '.lg{height:52px;margin-bottom:14px}@media print{body{margin:0 auto}}</style></head><body>' +
    '<img class="lg" src="' + LOGO_LOCKUP + '"/>' + mdToHtml(md) +
    '<script>window.onload=function(){window.print()}<\/script></body></html>');
  w.document.close();
}

const localDay = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const minutesOf = (ts) => { const d = new Date(ts); return d.getHours() * 60 + d.getMinutes(); };
const timeToMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };

/** Progressive tax on annual taxable income using the bracket table. */
function calcAnnualTax(taxable, brackets) {
  let tax = 0;
  for (const b of brackets) {
    const lo = Number(b.lower_bound);
    const hi = b.upper_bound == null ? Infinity : Number(b.upper_bound);
    if (taxable <= lo) break;
    tax += (Math.min(taxable, hi) - lo) * Number(b.rate);
  }
  return Math.max(0, tax);
}

document.querySelector('link[rel="icon"]').setAttribute('href', LOGO_MARK);

function Logo({ className }) {
  return <img src={LOGO_MARK} className={className} alt="Home Vacation" />;
}
function LogoFull({ className }) {
  return <img src={LOGO_LOCKUP} className={className} alt="Home Vacation — Investment for Real Estate" />;
}

function Btn({ variant = 'primary', size = 'md', className, ...p }) {
  const base = 'inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition active:scale-[.97] disabled:opacity-50 disabled:pointer-events-none';
  const v = {
    primary: 'bg-brand-700 text-white hover:bg-brand-800',
    soft: 'bg-brand-50 text-brand-800 hover:bg-brand-100',
    ghost: 'bg-transparent text-slate-600 hover:bg-slate-100',
    outline: 'border border-slate-300 bg-white text-slate-700 hover:bg-slate-50',
    danger: 'bg-rose-600 text-white hover:bg-rose-700',
  }[variant];
  const s = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2.5 text-sm', lg: 'px-5 py-3 text-base w-full' }[size];
  return <button className={cx(base, v, s, className)} {...p} />;
}

function Field({ label, children, hint }) {
  return (
    <label className="block">
      <span className="mb-1 block text-xs font-semibold text-slate-600">{label}</span>
      {children}
      {hint && <span className="mt-1 block text-xs text-slate-400">{hint}</span>}
    </label>
  );
}

const inputCls = 'w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-100';
const Input = (p) => <input {...p} className={cx(inputCls, p.className)} />;
const Select = (p) => <select {...p} className={cx(inputCls, 'appearance-none', p.className)} />;

function Card({ title, action, children, className }) {
  return (
    <section className={cx('rounded-2xl border border-slate-200 bg-white shadow-sm', className)}>
      {(title || action) && (
        <header className="flex items-center justify-between gap-3 border-b border-slate-100 px-4 py-3">
          <h2 className="text-sm font-bold text-slate-800">{title}</h2>
          {action}
        </header>
      )}
      <div className="p-4">{children}</div>
    </section>
  );
}

function Modal({ open, onClose, title, children, footer }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/50 p-0 sm:items-center sm:p-4" onClick={onClose}>
      <div className="max-h-[92vh] w-full overflow-y-auto rounded-t-3xl bg-white sm:max-w-lg sm:rounded-2xl" onClick={(e) => e.stopPropagation()}>
        <header className="sticky top-0 flex items-center justify-between border-b border-slate-100 bg-white px-4 py-3">
          <h3 className="font-bold text-slate-800">{title}</h3>
          <button onClick={onClose} className="rounded-lg px-2 py-1 text-xl leading-none text-slate-400 hover:bg-slate-100">&times;</button>
        </header>
        <div className="space-y-3 p-4">{children}</div>
        {footer && <footer className="sticky bottom-0 flex gap-2 border-t border-slate-100 bg-white p-4 pb-safe">{footer}</footer>}
      </div>
    </div>
  );
}

function Toast({ msg }) {
  if (!msg) return null;
  const bad = msg.type === 'error';
  return (
    <div className="fixed inset-x-0 top-3 z-[60] flex justify-center px-4">
      <div className={cx('max-w-md rounded-xl px-4 py-2.5 text-sm font-semibold text-white shadow-lg', bad ? 'bg-rose-600' : 'bg-brand-700')}>
        {msg.text}
      </div>
    </div>
  );
}

function Empty({ text }) {
  return <p className="py-8 text-center text-sm text-slate-400">{text}</p>;
}

function Badge({ tone = 'slate', children }) {
  const tones = { slate: 'bg-slate-100 text-slate-600', green: 'bg-emerald-100 text-emerald-700', red: 'bg-rose-100 text-rose-700', teal: 'bg-brand-100 text-brand-800', amber: 'bg-amber-100 text-amber-700' };
  return <span className={cx('inline-block rounded-full px-2 py-0.5 text-xs font-semibold', tones[tone])}>{children}</span>;
}

/* =====================================================================
   4. Auth screen
   ===================================================================== */
function AuthScreen({ toast }) {
  const { lang, t, setLang } = useL();
  const [mode, setMode] = useState('in');
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [nameEn, setNameEn] = useState('');
  const [nameAr, setNameAr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!CONFIGURED) return toast(t.notConfigured, 'error');
    setBusy(true);
    try {
      if (mode === 'in') {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signUp({
          email: email.trim(), password: pw,
          options: { data: { full_name_en: nameEn, full_name_ar: nameAr } },
        });
        if (error) throw error;
        toast(t.checkEmail);
        setMode('in');
      }
    } catch (err) { toast(err.message, 'error'); }
    setBusy(false);
  }

  async function reset() {
    if (!email.trim()) return toast(t.email, 'error');
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href });
    toast(error ? error.message : t.resetSent, error ? 'error' : 'ok');
  }

  return (
    <div className="flex min-h-full flex-col justify-center bg-gradient-to-b from-brand-800 to-brand-950 px-4 py-10">
      <div className="mx-auto w-full max-w-sm">
        <div className="mb-6 text-center text-white">
          <div className="mx-auto mb-4 w-fit rounded-2xl bg-white px-5 py-4 shadow-xl">
            <LogoFull className="w-56 max-w-full" />
          </div>
          <h1 className="text-xl font-bold">{t.appName}</h1>
          <p className="text-sm text-brand-200">{t.appSub}</p>
        </div>

        <form onSubmit={submit} className="space-y-3 rounded-2xl bg-white p-5 shadow-xl">
          {mode === 'up' && (
            <>
              <Field label={t.fullNameAr}><Input value={nameAr} onChange={(e) => setNameAr(e.target.value)} /></Field>
              <Field label={t.fullNameEn}><Input value={nameEn} onChange={(e) => setNameEn(e.target.value)} /></Field>
            </>
          )}
          <Field label={t.email}>
            <Input type="email" inputMode="email" autoComplete="email" required value={email} onChange={(e) => setEmail(e.target.value)} />
          </Field>
          <Field label={t.password}>
            <Input type="password" autoComplete={mode === 'in' ? 'current-password' : 'new-password'} required minLength={6} value={pw} onChange={(e) => setPw(e.target.value)} />
          </Field>

          <Btn size="lg" disabled={busy}>{busy ? t.loading : mode === 'in' ? t.signIn : t.signUp}</Btn>

          {mode === 'in' ? (
            <div className="flex items-center justify-between pt-1 text-xs">
              <button type="button" onClick={reset} className="text-slate-500 underline">{t.forgotPw}</button>
              <button type="button" onClick={() => setMode('up')} className="font-semibold text-brand-700">{t.noAccount}</button>
            </div>
          ) : (
            <div className="pt-1 text-xs">
              <p className="mb-2 text-slate-500">{t.signupHint}</p>
              <button type="button" onClick={() => setMode('in')} className="font-semibold text-brand-700">{t.haveAccount}</button>
            </div>
          )}
        </form>

        <div className="mt-5 flex items-center justify-center gap-3 text-xs text-brand-200">
          <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="rounded-lg bg-white/10 px-3 py-1.5 font-semibold text-white">
            {lang === 'ar' ? 'English' : 'العربية'}
          </button>
          <span>{APP_VERSION}</span>
        </div>
        {!CONFIGURED && <p className="mt-4 rounded-xl bg-amber-100 p-3 text-center text-xs text-amber-800">{t.notConfigured}</p>}
      </div>
    </div>
  );
}

function Dashboard({ me, data }) {
  const { lang, t } = useL();
  const year = new Date().getFullYear();
  const admin = me.role !== 'staff';
  const stats = [
    // Staff never load these lists, so don't show them misleading zeros.
    ...(admin ? [
      { label: t.activeEmployees, value: data.employees.filter((e) => e.status === 'active').length, icon: '🧑‍💼' },
      { label: t.headcountUsers, value: data.users.length, icon: '👥' },
    ] : []),
    { label: t.activeBranches, value: data.branches.filter((b) => b.is_active).length, icon: '🏢' },
    { label: t.holidaysThisYear, value: data.holidays.filter((h) => h.holiday_date.startsWith(String(year))).length, icon: '📅' },
  ];
  const name = (lang === 'ar' ? me.full_name_ar : me.full_name_en) || me.email;

  /* contract / probation / document expiries within 60 days */
  const eName = (e) => e ? ((lang === 'ar' ? e.full_name_ar : e.full_name_en) || e.full_name_en) : '—';
  const expiry = [];
  if (admin) {
    for (const e of data.employees.filter((x) => x.status === 'active')) {
      for (const [field, label] of [['contract_end', t.contractEnd], ['probation_end', t.probationEnd]]) {
        if (e[field] && daysUntil(e[field]) <= 60) expiry.push({ who: eName(e), what: label, date: e[field], d: daysUntil(e[field]) });
      }
    }
    for (const doc of data.expiringDocs) {
      expiry.push({ who: eName(data.employees.find((e) => e.id === doc.employee_id)), what: t.docTypes[doc.doc_type] || doc.title, date: doc.expiry_date, d: daysUntil(doc.expiry_date) });
    }
    expiry.sort((a, b) => a.d - b.d);
  }

  return (
    <>
      <div className="rounded-2xl bg-gradient-to-br from-brand-700 to-brand-900 p-5 text-white">
        <p className="text-sm text-brand-200">{t.welcome}</p>
        <p className="text-xl font-bold">{name}</p>
        <p className="mt-1 text-sm text-brand-200">{t.yourRole}: {t.roles[me.role]}</p>
      </div>

      <div className={cx('grid gap-3', stats.length === 4 ? 'grid-cols-2 sm:grid-cols-4' : stats.length === 3 ? 'grid-cols-3' : 'grid-cols-2')}>
        {stats.map((s) => (
          <div key={s.label} className="rounded-2xl border border-slate-200 bg-white p-3 text-center">
            <div className="text-xl">{s.icon}</div>
            <div className="text-2xl font-bold text-slate-800">{s.value}</div>
            <div className="text-[11px] leading-tight text-slate-500">{s.label}</div>
          </div>
        ))}
      </div>

      {admin && expiry.length > 0 && (
        <Card title={'⚠️ ' + t.expiryAlerts}>
          <ul className="divide-y divide-slate-100">
            {expiry.slice(0, 10).map((x, i) => (
              <li key={i} className="flex items-center justify-between gap-2 py-2">
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-slate-800">{x.who}</p>
                  <p className="text-xs text-slate-500">{x.what}</p>
                </div>
                <Badge tone={x.d < 0 ? 'red' : 'amber'}>{x.d < 0 ? t.expiredLbl : x.date}</Badge>
              </li>
            ))}
          </ul>
        </Card>
      )}

      <Card title={t.moduleSoon}>
        <p className="text-sm text-slate-500">
          {lang === 'ar'
            ? 'الوحدة 3 جاهزة: الحضور بالموقع الجغرافي والمشاوير والورديات والقفل الشهري. التالي: الإجازات.'
            : 'Module 3 is live: GPS attendance, car trips, shifts and monthly locks. Next up: leave management.'}
        </p>
      </Card>
    </>
  );
}

function UsersPage({ me, data, refresh, toast, audit }) {
  const { lang, t } = useL();
  const [q, setQ] = useState('');
  const [editing, setEditing] = useState(null);
  const [inviting, setInviting] = useState(null);

  const list = data.users.filter((u) => {
    const s = (u.email + ' ' + (u.full_name_en || '') + ' ' + (u.full_name_ar || '')).toLowerCase();
    return s.includes(q.toLowerCase());
  });

  async function saveUser(form) {
    const before = data.users.find((u) => u.id === form.id);
    const { data: row, error } = await sb.from('app_users')
      .update({ full_name_en: form.full_name_en, full_name_ar: form.full_name_ar, role: form.role, branch_id: form.branch_id || null, phone: form.phone, is_active: form.is_active })
      .eq('id', form.id).select().single();
    if (error) return toast(error.message, 'error');
    refresh.users((prev) => prev.map((u) => (u.id === row.id ? row : u)));
    audit('update', 'app_users', row.id, before, row);
    setEditing(null);
    toast(t.saved);
  }

  async function saveInvite(form) {
    const { data: row, error } = await sb.from('user_invites')
      .insert({ email: form.email.trim().toLowerCase(), role: form.role, branch_id: form.branch_id || null, full_name_en: form.full_name_en, full_name_ar: form.full_name_ar, created_by: me.id })
      .select().single();
    if (error) return toast(error.message, 'error');
    refresh.invites((prev) => [row, ...prev]);
    audit('insert', 'user_invites', row.id, null, row);
    setInviting(null);
    toast(t.saved);
  }

  const branchName = (id) => {
    const b = data.branches.find((x) => x.id === id);

              <li key={u.id} className="flex items-center justify-between gap-3 py-3">
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-slate-800">
                    {(lang === 'ar' ? u.full_name_ar : u.full_name_en) || u.email}
                  </p>
                  <p className="truncate text-xs text-slate-500">{u.email} &middot; {branchName(u.branch_id)}</p>
                </div>
                <div className="flex shrink-0 items-center gap-2">
                  <Badge tone={u.is_active ? 'teal' : 'red'}>{t.roles[u.role]}</Badge>
                  <Btn variant="ghost" size="sm" onClick={() => setEditing({ ...u })}>{t.edit}</Btn>
                </div>
              </li>
            ))}
          </ul>
        )}
      </Card>

      <Card title={t.pending}>
        {data.invites.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {data.invites.map((i) => (

                <div className="min-w-0">

  );

    if (!view) { setDocs(null); return; }
    let gone = false;
    sb.from('employee_documents').select('*').eq('employee_id', view.id).order('created_at', { ascending: false })
      .then(({ data: d }) => { if (!gone) setDocs(d || []); });
    return () => { gone = true; };
  }, [view && view.id]);

  function blank() {
    return {
      employee_code: 'HV-' + String(data.employees.length + 1).padStart(3, '0'),
      full_name_en: '', full_name_ar: '', national_id: '', birth_date: '', gender: '',
      phone: '', personal_email: '', address: '',
      branch_id: '', department_id: '', job_title_en: '', job_title_ar: '', manager_id: '',
      hire_date: todayISO(), contract_type: 'indefinite', contract_end: '', probation_end: '',
      weekend_days: null, basic_salary: 0, allowances: [], insurance_base: 0,

  function onNid(v) {
    const next = { ...form, national_id: v };
    const parsed = parseNationalId(v);
    if (parsed) { next.birth_date = parsed.birth_date; next.gender = parsed.gender; }
    setForm(next);

    if (form.national_id && !parseNationalId(form.national_id)) return toast(t.invalidNid, 'error');
    const nn = (v) => (v === '' || v == null ? null : v);
    const payload = {
      employee_code: form.employee_code.trim(), full_name_en: form.full_name_en, full_name_ar: form.full_name_ar,
      national_id: nn(form.national_id), birth_date: nn(form.birth_date), gender: nn(form.gender),
      phone: nn(form.phone), personal_email: nn(form.personal_email), address: nn(form.address),
      branch_id: nn(form.branch_id), department_id: nn(form.department_id),
      job_title_en: nn(form.job_title_en), job_title_ar: nn(form.job_title_ar), manager_id: nn(form.manager_id),
      hire_date: form.hire_date, contract_type: form.contract_type,
      contract_end: nn(form.contract_end), probation_end: nn(form.probation_end),
      weekend_days: form.weekend_days, basic_salary: Number(form.basic_salary) || 0,
      allowances: (form.allowances || []).filter((a) => a.name_en || a.name_ar || a.amount),
      insurance_base: Number(form.insurance_base) || 0, nosi_number: nn(form.nosi_number),
      bank_name: nn(form.bank_name), bank_account: nn(form.bank_account),
      status: form.status, termination_date: nn(form.termination_date), user_id: nn(form.user_id), notes: nn(form.notes),
      shift_id: nn(form.shift_id), device_code: nn(form.device_code),
    };
    let res;
    if (form.id) res = await sb.from('employees').update(payload).eq('id', form.id).select().single();
    else res = await sb.from('employees').insert(payload).select().single();
    if (res.error) return toast(res.error.message, 'error');
    const row = res.data;
    refresh.employees((prev) => (form.id ? prev.map((e) => (e.id === row.id ? row : e)) : [...prev, row]));
    audit(form.id ? 'update' : 'insert', 'employees', row.id, form.id ? data.employees.find((e) => e.id === form.id) : null, row);
    if (view && view.id === row.id) setView(row);
    setForm(null);
    toast(t.saved);
  }

  async function uploadDoc(file) {
    if (!file || !view) return;
    setUploading(true);
    const path = view.id + '/' + Date.now() + '_' + file.name.replace(/[^\w.\-]/g, '_');
    const { error: upErr } = await sb.storage.from('employee-docs').upload(path, file);
    if (upErr) { setUploading(false); return toast(upErr.message, 'error'); }
    const { data: row, error } = await sb.from('employee_documents').insert({
      employee_id: view.id, doc_type: docForm.doc_type, title: docForm.title || file.name,
      file_path: path, expiry_date: docForm.expiry_date || null, uploaded_by: me.id,
    }).select().single();
    setUploading(false);
    if (error) return toast(error.message, 'error');
    setDocs((prev) => [row, ...(prev || [])]);
    audit('insert', 'employee_documents', row.id, null, { ...row, file: file.name });
    setDocForm({ doc_type: 'other', title: '', expiry_date: '' });
    toast(t.saved);
  }

  async function openDoc(doc) {
    const { data: s, error } = await sb.storage.from('employee-docs').createSignedUrl(doc.file_path, 300);
    if (error) return toast(error.message, 'error');
    window.open(s.signedUrl, '_blank');
  }

  async function removeDoc(doc) {
    if (!window.confirm(t.confirmDel)) return;
    const { error } = await sb.from('employee_documents').delete().eq('id', doc.id);
    if (error) return toast(error.message, 'error');
    await sb.storage.from('employee-docs').remove([doc.file_path]);
    setDocs((prev) => prev.filter((d) => d.id !== doc.id));
    audit('delete', 'employee_documents', doc.id, doc, null);
  }

  const gross = form ? (Number(form.basic_salary) || 0) + (form.allowances || []).reduce((s, a) => s + (Number(a.amount) || 0), 0) : 0;
  const setAllow = (i, k, v) => setForm({ ...form, allowances: form.allowances.map((a, idx) => (idx === i ? { ...a, [k]: v } : a)) });
  const expBadge = (d) => { const n = daysUntil(d); return n < 0 ? <Badge tone="red">{t.expiredLbl}</Badge> : n <= 60 ? <Badge tone="amber">{t.expiresOn} {d}</Badge> : null; };

  const linkableUsers = data.users.filter((u) => {
    const owner = data.employees.find((e) => e.user_id === u.id);
    return !owner || (form && owner.id === form.id);
  });

  return (
    <>
      <div className="flex gap-2">
        <Input placeholder={t.search} value={q} onChange={(e) => setQ(e.target.value)} />
        {canEdit && <Btn onClick={() => setForm(blank())}>+ {t.add}</Btn>}
      </div>
      <div className="grid grid-cols-2 gap-2">
        <Select value={fBranch} onChange={(e) => setFBranch(e.target.value)}>
          <option value="">{t.allBranches}</option>
          {data.branches.map((b) => <option key={b.id} value={b.id}>{lang === 'ar' ? b.name_ar : b.name_en}</option>)}
        </Select>
        <Select value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
          <option value="">{t.status}</option>
          {Object.keys(t.empStatus).map((s) => <option key={s} value={s}>{t.empStatus[s]}</option>)}
        </Select>
      </div>

      <Card title={t.employees + ' (' + list.length + ')'}>
        {list.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {list.map((e) => (
              <li key={e.id} className="flex cursor-pointer items-center justify-between gap-3 py-3" onClick={() => { setView(e); setTab('profile'); }}>
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-slate-800">{eName(e)}</p>
                  <p className="truncate text-xs text-slate-500">
                    {e.employee_code} &middot; {(lang === 'ar' ? e.job_title_ar : e.job_title_en) || deptName(e.department_id)} &middot; {branchName(e.branch_id)}
                  </p>
                </div>
                <Badge tone={e.status === 'active' ? 'teal' : e.status === 'suspended' ? 'amber' : 'red'}>{t.empStatus[e.status]}</Badge>
              </li>
            ))}
          </ul>
        )}
      </Card>

      {/* ---------- detail modal ---------- */}
      <Modal open={!!view} onClose={() => setView(null)} title={view ? eName(view) : ''}
        footer={canEdit && view ? <><Btn className="flex-1" onClick={() => setForm({ ...view, allowances: view.allowances || [] })}>{t.edit}</Btn><Btn variant="outline" className="flex-1" onClick={() => setView(null)}>{t.close}</Btn></> : null}>
        {view && (
          <>
            <div className="flex gap-2">
              {['profile', 'salary', 'docs'].map((k) => (
                <button key={k} onClick={() => setTab(k)}
                  className={cx('flex-1 rounded-lg py-1.5 text-sm font-semibold', tab === k ? 'bg-brand-700 text-white' : 'bg-slate-100 text-slate-600')}>
                  {k === 'profile' ? t.profileTab : k === 'salary' ? t.salaryTab : t.docsTab}
                </button>
              ))}
            </div>

            {tab === 'profile' && (
              <dl className="grid grid-cols-2 gap-x-3 gap-y-2 text-sm">
                {[
                  [t.empCode, view.employee_code], [t.status, t.empStatus[view.status]],
                  [t.nationalId, view.national_id], [t.birthDate, view.birth_date],
                  [t.gender, view.gender ? t[view.gender] : '—'], [t.phone, view.phone],
                  [t.branch, branchName(view.branch_id)], [t.department, deptName(view.department_id)],
                  [t.managerLbl, view.manager_id ? eName(data.employees.find((x) => x.id === view.manager_id) || { full_name_en: '—' }) : '—'],
                  [t.hireDate, view.hire_date], [t.contractType, t.contractTypes[view.contract_type]],
                  [t.contractEnd, view.contract_end], [t.probationEnd, view.probation_end],
                  [t.scheduleLbl, view.weekend_days ? view.weekend_days.map((d) => t.daysShort[d]).join('، ') : t.companyDefaultWeek],
                ].map(([k, v], i) => (
                  <div key={i}><dt className="text-xs text-slate-400">{k}</dt><dd className="font-medium text-slate-800">{v || '—'}</dd></div>
                ))}
                {(view.contract_end || view.probation_end) && (
                  <div className="col-span-2 flex gap-2">
                    {view.contract_end && expBadge(view.contract_end)}
                    {view.probation_end && expBadge(view.probation_end)}
                  </div>
                )}
              </dl>
            )}

            {tab === 'salary' && (
              <div className="space-y-2 text-sm">
                <div className="flex justify-between"><span className="text-slate-500">{t.basicSalary}</span><b>{money(view.basic_salary)}</b></div>
                {(view.allowances || []).map((a, i) => (
                  <div key={i} className="flex justify-between"><span className="text-slate-500">{(lang === 'ar' ? a.name_ar : a.name_en) || t.allowancesLbl}</span><b>{money(a.amount)}</b></div>
                ))}
                <div className="flex justify-between border-t border-slate-100 pt-2"><span className="font-semibold">{t.salaryTotal}</span>
                  <b>{money((Number(view.basic_salary) || 0) + (view.allowances || []).reduce((s, a) => s + (Number(a.amount) || 0), 0))}</b></div>
                <div className="flex justify-between"><span className="text-slate-500">{t.insuranceBase}</span><b>{money(view.insurance_base)}</b></div>
                <div className="flex justify-between"><span className="text-slate-500">{t.nosiNumber}</span><b>{view.nosi_number || '—'}</b></div>
                <div className="flex justify-between"><span className="text-slate-500">{t.bankName}</span><b>{view.bank_name || '—'}</b></div>
                <div className="flex justify-between"><span className="text-slate-500">{t.bankAccount}</span><b dir="ltr">{view.bank_account || '—'}</b></div>
              </div>
            )}

            {tab === 'docs' && (
              <div className="space-y-3">
                {docs === null ? <Empty text={t.loading} /> : docs.length === 0 ? <Empty text={t.noData} /> : (
                  <ul className="divide-y divide-slate-100">
                    {docs.map((d) => (
                      <li key={d.id} className="flex items-center justify-between gap-2 py-2.5">
                        <div className="min-w-0">
                          <p className="truncate text-sm font-semibold text-slate-800">{d.title}</p>
                          <p className="text-xs text-slate-500">{t.docTypes[d.doc_type]} {d.expiry_date ? <>&middot; {expBadge(d.expiry_date) || d.expiry_date}</> : null}</p>
                        </div>
                        <div className="flex shrink-0 gap-1">
                          <Btn variant="ghost" size="sm" onClick={() => openDoc(d)}>{t.download}</Btn>
                          {canEdit && <Btn variant="ghost" size="sm" className="text-rose-600" onClick={() => removeDoc(d)}>{t.del}</Btn>}
                        </div>
                      </li>
                    ))}
                  </ul>
                )}
                {canEdit && (
                  <div className="space-y-2 rounded-xl bg-slate-50 p-3">
                    <div className="grid grid-cols-2 gap-2">
                      <Select value={docForm.doc_type} onChange={(e) => setDocForm({ ...docForm, doc_type: e.target.value })}>
                        {Object.keys(t.docTypes).map((k) => <option key={k} value={k}>{t.docTypes[k]}</option>)}
                      </Select>
                      <Input type="date" value={docForm.expiry_date} onChange={(e) => setDocForm({ ...docForm, expiry_date: e.target.value })} />
                    </div>
                    <Input placeholder={t.docTitle} value={docForm.title} onChange={(e) => setDocForm({ ...docForm, title: e.target.value })} />
                    <input ref={fileRef} type="file" className="hidden" onChange={(e) => { uploadDoc(e.target.files[0]); e.target.value = ''; }} />
                    <Btn variant="soft" size="sm" disabled={uploading} onClick={() => fileRef.current.click()}>
                      📎 {uploading ? t.uploading : t.upload}
                    </Btn>
                  </div>
                )}
              </div>
            )}
          </>
        )}
      </Modal>

      {/* ---------- add / edit form ---------- */}
      <Modal open={!!form} onClose={() => setForm(null)} title={form && form.id ? t.edit : t.addEmployee}
        footer={<><Btn className="flex-1" onClick={save}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setForm(null)}>{t.cancel}</Btn></>}>
        {form && (
          <>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.empCode}><Input value={form.employee_code} onChange={(e) => setForm({ ...form, employee_code: e.target.value })} /></Field>
              <Field label={t.status}>
                <Select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
                  {Object.keys(t.empStatus).map((s) => <option key={s} value={s}>{t.empStatus[s]}</option>)}
                </Select>
              </Field>
            </div>
            {form.status === 'terminated' && (
              <Field label={t.terminationDate}><Input type="date" value={form.termination_date || ''} onChange={(e) => setForm({ ...form, termination_date: e.target.value })} /></Field>
            )}
            <Field label={t.fullNameAr}><Input value={form.full_name_ar} onChange={(e) => setForm({ ...form, full_name_ar: e.target.value })} /></Field>
            <Field label={t.fullNameEn}><Input value={form.full_name_en} onChange={(e) => setForm({ ...form, full_name_en: e.target.value })} /></Field>
            <Field label={t.nationalId} hint={t.nidHint}>
              <Input inputMode="numeric" maxLength={14} dir="ltr" value={form.national_id || ''} onChange={(e) => onNid(e.target.value.replace(/\D/g, ''))} />

            <div className="grid grid-cols-2 gap-3">
              <Field label={t.birthDate}><Input type="date" value={form.birth_date || ''} onChange={(e) => setForm({ ...form, birth_date: e.target.value })} /></Field>
              <Field label={t.gender}>
                <Select value={form.gender || ''} onChange={(e) => setForm({ ...form, gender: e.target.value })}>
                  <option value="">—</option><option value="male">{t.male}</option><option value="female">{t.female}</option>
                </Select>
              </Field>
              <Field label={t.phone}><Input inputMode="tel" dir="ltr" value={form.phone || ''} onChange={(e) => setForm({ ...form, phone: e.target.value })} /></Field>
              <Field label={t.personalEmail}><Input type="email" dir="ltr" value={form.personal_email || ''} onChange={(e) => setForm({ ...form, personal_email: e.target.value })} /></Field>
            </div>
            <Field label={t.address}><Input value={form.address || ''} onChange={(e) => setForm({ ...form, address: e.target.value })} /></Field>

            <div className="grid grid-cols-2 gap-3">
              <Field label={t.branch}>
                <Select value={form.branch_id || ''} onChange={(e) => setForm({ ...form, branch_id: e.target.value })}>
                  <option value="">—</option>
                  {data.branches.map((b) => <option key={b.id} value={b.id}>{lang === 'ar' ? b.name_ar : b.name_en}</option>)}
                </Select>
              </Field>
              <Field label={t.department}>
                <Select value={form.department_id || ''} onChange={(e) => setForm({ ...form, department_id: e.target.value })}>
                  <option value="">—</option>
                  {data.departments.map((d) => <option key={d.id} value={d.id}>{lang === 'ar' ? d.name_ar : d.name_en}</option>)}
                </Select>
              </Field>
              <Field label={t.jobTitleAr}><Input value={form.job_title_ar || ''} onChange={(e) => setForm({ ...form, job_title_ar: e.target.value })} /></Field>
              <Field label={t.jobTitleEn}><Input value={form.job_title_en || ''} onChange={(e) => setForm({ ...form, job_title_en: e.target.value })} /></Field>
            </div>
            <Field label={t.managerLbl}>
              <Select value={form.manager_id || ''} onChange={(e) => setForm({ ...form, manager_id: e.target.value })}>
                <option value="">{t.noneLbl}</option>
                {data.employees.filter((x) => x.status === 'active' && x.id !== form.id).map((x) => <option key={x.id} value={x.id}>{eName(x)}</option>)}
              </Select>
            </Field>
            <Field label={t.linkedAccount}>
              <Select value={form.user_id || ''} onChange={(e) => setForm({ ...form, user_id: e.target.value })}>
                <option value="">{t.noneLbl}</option>
                {linkableUsers.map((u) => <option key={u.id} value={u.id}>{u.email}</option>)}
              </Select>
            </Field>

            <div className="grid grid-cols-2 gap-3">
              <Field label={t.hireDate}><Input type="date" value={form.hire_date} onChange={(e) => setForm({ ...form, hire_date: e.target.value })} /></Field>
              <Field label={t.contractType}>
                <Select value={form.contract_type} onChange={(e) => setForm({ ...form, contract_type: e.target.value })}>
                  {Object.keys(t.contractTypes).map((k) => <option key={k} value={k}>{t.contractTypes[k]}</option>)}
                </Select>
              </Field>
              {(form.contract_type === 'fixed_term' || form.contract_end) && (
                <Field label={t.contractEnd}><Input type="date" value={form.contract_end || ''} onChange={(e) => setForm({ ...form, contract_end: e.target.value })} /></Field>
              )}
              <Field label={t.probationEnd}><Input type="date" value={form.probation_end || ''} onChange={(e) => setForm({ ...form, probation_end: e.target.value })} /></Field>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label={t.shift}>
                <Select value={form.shift_id || ''} onChange={(e) => setForm({ ...form, shift_id: e.target.value })}>
                  <option value="">—</option>
                  {data.shifts.map((s) => <option key={s.id} value={s.id}>{lang === 'ar' ? s.name_ar : s.name_en}</option>)}
                </Select>
              </Field>
              <Field label={t.deviceCode}>
                <Input dir="ltr" inputMode="numeric" value={form.device_code || ''} onChange={(e) => setForm({ ...form, device_code: e.target.value })} />

            </div>
            <Field label={t.scheduleLbl}>
              <Select value={form.weekend_days ? 'custom' : 'default'}

              </Select>

            {form.weekend_days && (
              <div className="grid grid-cols-4 gap-2 sm:grid-cols-7">
                {t.daysShort.map((d, i) => (
                  <button key={i} type="button"
                    onClick={() => setForm({ ...form, weekend_days: form.weekend_days.includes(i) ? form.weekend_days.filter((x) => x !== i) : [...form.weekend_days, i].sort() })}

                    {d}

                ))}
              </div>

            <Field label={t.basicSalary}><Input type="number" inputMode="decimal" value={form.basic_salary} onChange={(e) => setForm({ ...form, basic_salary: e.target.value })} /></Field>
            <div>
              <div className="mb-1 flex items-center justify-between">
                <span className="text-xs font-semibold text-slate-600">{t.allowancesLbl}</span>
                <Btn variant="soft" size="sm" onClick={() => setForm({ ...form, allowances: [...(form.allowances || []), { name_ar: '', name_en: '', amount: '' }] })}>+ {t.addAllowance}</Btn>
              </div>
              {(form.allowances || []).map((a, i) => (
                <div key={i} className="mb-2 grid grid-cols-[1fr_1fr_5rem_2rem] items-center gap-2">
                  <Input placeholder={t.nameAr} value={a.name_ar} onChange={(e) => setAllow(i, 'name_ar', e.target.value)} />
                  <Input placeholder={t.nameEn} value={a.name_en} onChange={(e) => setAllow(i, 'name_en', e.target.value)} />
                  <Input type="number" inputMode="decimal" placeholder={t.amount} value={a.amount} onChange={(e) => setAllow(i, 'amount', e.target.value)} />
                  <button onClick={() => setForm({ ...form, allowances: form.allowances.filter((_, idx) => idx !== i) })}
                    className="rounded-lg px-2 py-2 text-lg leading-none text-rose-500 hover:bg-rose-50">&times;</button>
                </div>
              ))}
              <p className="text-end text-xs font-semibold text-slate-500">{t.salaryTotal}: {money(gross)}</p>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.insuranceBase}><Input type="number" inputMode="decimal" value={form.insurance_base} onChange={(e) => setForm({ ...form, insurance_base: e.target.value })} /></Field>
              <Field label={t.nosiNumber}><Input dir="ltr" value={form.nosi_number || ''} onChange={(e) => setForm({ ...form, nosi_number: e.target.value })} /></Field>
              <Field label={t.bankName}><Input value={form.bank_name || ''} onChange={(e) => setForm({ ...form, bank_name: e.target.value })} /></Field>
              <Field label={t.bankAccount}><Input dir="ltr" value={form.bank_account || ''} onChange={(e) => setForm({ ...form, bank_account: e.target.value })} /></Field>
            </div>
            <Field label={t.notes}><Input value={form.notes || ''} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
          </>
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   7c. Attendance + trips
   ===================================================================== */
function AttendancePage({ me, data, toast, audit }) {
  const { lang, t } = useL();
  const isHr = ['ceo', 'hr'].includes(me.role);
  const admin = me.role !== 'staff';
  const myEmp = data.employees.find((e) => e.user_id === me.id);
  const tabs = [
    ...(myEmp ? [{ k: 'checkin', label: t.checkIn }, { k: 'trips', label: t.tripsTab }] : []),
    ...(admin ? [{ k: 'review', label: t.reviewTab }] : []),
    ...(!myEmp && !admin ? [] : []),
    ...(isHr ? [{ k: 'lock', label: t.lockTab }] : []),
  ];
  const [tab, setTab] = useState(tabs.length ? tabs[0].k : 'none');
  const eName = (e) => e ? ((lang === 'ar' ? e.full_name_ar : e.full_name_en) || e.full_name_en) : '—';

  if (!tabs.length) return <Card><Empty text={t.noEmpLink} /></Card>;

  return (
    <>
      <div className="no-scrollbar flex gap-2 overflow-x-auto pb-1">
        {tabs.map((x) => (
          <button key={x.k} onClick={() => setTab(x.k)}
            className={cx('shrink-0 rounded-full px-3.5 py-1.5 text-sm font-semibold', tab === x.k ? 'bg-brand-700 text-white' : 'border border-slate-300 bg-white text-slate-600')}>
            {x.label}
          </button>
        ))}
      </div>
      {tab === 'checkin' && <CheckInTab me={me} myEmp={myEmp} data={data} toast={toast} />}
      {tab === 'trips' && <TripsTab me={me} myEmp={myEmp} data={data} toast={toast} eName={eName} admin={admin} />}
      {tab === 'review' && <ReviewTab me={me} data={data} toast={toast} audit={audit} eName={eName} isHr={isHr} />}
      {tab === 'lock' && <LockTab me={me} data={data} toast={toast} audit={audit} />}
    </>
  );
}

function CheckInTab({ me, myEmp, data, toast }) {
  const { t } = useL();
  const [todays, setTodays] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    sb.from('attendance_punches').select('*').eq('employee_id', myEmp.id)
      .gte('punch_time', start.toISOString()).order('punch_time')
      .then(({ data: d }) => setTodays(d || []));
  }, [myEmp.id]);

  const last = todays && todays.length ? todays[todays.length - 1] : null;
  const nextDir = last && last.direction === 'in' ? 'out' : 'in';

  async function punch() {
    setBusy(true);
    let gps;
    try { gps = await getGps(); }
    catch (e) { setBusy(false); return toast(e.code === 1 ? t.geoDenied : e.message, 'error'); }

    const geoBranches = data.branches.filter((b) => b.is_active && b.latitude != null && b.longitude != null);
    let nearest = null, distM = null;
    for (const b of geoBranches) {
      const d = haversineKm(gps.lat, gps.lng, Number(b.latitude), Number(b.longitude)) * 1000;
      if (distM === null || d < distM) { distM = d; nearest = b; }
    }
    const within = nearest ? distM <= (nearest.geofence_radius_m || 200) : null;

    const { data: row, error } = await sb.from('attendance_punches').insert({
      employee_id: myEmp.id,
      employee_device_code: myEmp.device_code || myEmp.employee_code,
      punch_time: new Date().toISOString(),
      direction: nextDir, device_id: 'web', source: 'web',
      latitude: gps.lat, longitude: gps.lng, accuracy_m: gps.acc,
      within_geofence: within, branch_id: nearest ? nearest.id : null,
    }).select().single();
    setBusy(false);
    if (error) return toast(error.message.includes('ATTENDANCE_LOCKED') ? t.monthLocked : error.message, 'error');
    setTodays((prev) => [...(prev || []), row]);
    if (!geoBranches.length) toast(t.noBranchGeo, 'error');
    else if (!within) toast(t.outsideBranch + ' (' + Math.round(distM) + ' ' + t.mAway + ')', 'error');
    else toast(t.saved);
  }

  return (
    <>
      <Card>
        <div className="py-2 text-center">
          <Btn size="lg" disabled={busy || todays === null}
            className={nextDir === 'out' ? '!bg-amber-600 hover:!bg-amber-700' : ''}
            onClick={punch}>
            {busy ? t.gettingLoc : nextDir === 'in' ? '🕐 ' + t.checkIn : '🏁 ' + t.checkOut}
          </Btn>
        </div>
      </Card>
      <Card title={t.myDay}>
        {todays === null ? <Empty text={t.loading} /> : todays.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {todays.map((p) => (
              <li key={p.id} className="flex items-center justify-between py-2.5 text-sm">
                <span className="font-semibold text-slate-800">{p.direction === 'in' ? t.dirIn : p.direction === 'out' ? t.dirOut : '—'} · {fmtTime(p.punch_time)}</span>
                {p.source === 'web'
                  ? <Badge tone={p.within_geofence ? 'green' : 'red'}>{p.within_geofence ? t.insideBranch : t.outsideBranch}</Badge>
                  : <Badge>{p.source}</Badge>}
              </li>
            ))}
          </ul>
        )}
      </Card>
    </>
  );
}

function TripsTab({ me, myEmp, data, toast, eName, admin }) {
  const { t } = useL();
  const [open, setOpen] = useState(undefined);   // undefined = loading
  const [trips, setTrips] = useState([]);
  const [purpose, setPurpose] = useState('');
  const [busy, setBusy] = useState(false);

  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);

  useEffect(() => {
    (async () => {
      const { data: o } = await sb.from('trips').select('*').eq('employee_id', myEmp.id).eq('status', 'open').limit(1).maybeSingle();
      setOpen(o || null);
      const { data: list } = await sb.from('trips').select('*').gte('started_at', monthStart.toISOString()).order('started_at', { ascending: false });
      setTrips(list || []);
    })();
  }, [myEmp.id]);

  const tripKm = (tr) => tr.manual_km != null ? Number(tr.manual_km) : tr.distance_km != null ? Number(tr.distance_km) : 0;
  const chainKm = (pts) => { let s = 0; for (let i = 1; i < pts.length; i++) s += haversineKm(pts[i-1].lat, pts[i-1].lng, pts[i].lat, pts[i].lng); return Math.round(s * 100) / 100; };

  async function withGps(fn) {
    setBusy(true);
    try { const gps = await getGps(); await fn(gps); }
    catch (e) { toast(e.code === 1 ? t.geoDenied : e.message, 'error'); }
    setBusy(false);
  }

  const start = () => withGps(async (gps) => {
    const { data: row, error } = await sb.from('trips').insert({
      employee_id: myEmp.id, purpose: purpose || null,
      started_at: new Date().toISOString(),
      waypoints: [{ t: new Date().toISOString(), lat: gps.lat, lng: gps.lng }],
    }).select().single();
    if (error) return toast(error.message, 'error');
    setOpen(row); setPurpose('');
    setTrips((prev) => [row, ...prev]);
    toast(t.saved);
  });

  const addPoint = () => withGps(async (gps) => {
    const pts = [...(open.waypoints || []), { t: new Date().toISOString(), lat: gps.lat, lng: gps.lng }];
    const { data: row, error } = await sb.from('trips').update({ waypoints: pts }).eq('id', open.id).select().single();
    if (error) return toast(error.message, 'error');
    setOpen(row);
    setTrips((prev) => prev.map((x) => (x.id === row.id ? row : x)));
    toast(t.saved);
  });

  const end = () => withGps(async (gps) => {
    const pts = [...(open.waypoints || []), { t: new Date().toISOString(), lat: gps.lat, lng: gps.lng }];
    const { data: row, error } = await sb.from('trips').update({
      waypoints: pts, ended_at: new Date().toISOString(), status: 'closed', distance_km: chainKm(pts),
    }).eq('id', open.id).select().single();
    if (error) return toast(error.message, 'error');
    setOpen(null);
    setTrips((prev) => prev.map((x) => (x.id === row.id ? row : x)));
    toast(t.saved + ' — ' + chainKm(pts) + ' ' + t.km);
  });

  const mine = trips.filter((x) => x.employee_id === myEmp.id);
  const others = trips.filter((x) => x.employee_id !== myEmp.id);
  const byEmp = {};
  for (const tr of others) (byEmp[tr.employee_id] = byEmp[tr.employee_id] || []).push(tr);

  return (
    <>
      <Card title={open ? '🚗 ' + t.openTripLbl : t.startTrip}>
        {open === undefined ? <Empty text={t.loading} /> : open ? (
          <div className="space-y-3">
            <p className="text-sm text-slate-600">
              {open.purpose || '—'} · {fmtTime(open.started_at)} · {(open.waypoints || []).length} {t.pointsN} · ~{chainKm(open.waypoints || [])} {t.km}
            </p>
            <div className="flex gap-2">
              <Btn variant="soft" className="flex-1" disabled={busy} onClick={addPoint}>📍 {t.recordPoint}</Btn>
              <Btn className="flex-1 !bg-amber-600 hover:!bg-amber-700" disabled={busy} onClick={end}>🏁 {t.endTrip}</Btn>
            </div>
          </div>
        ) : (
          <div className="space-y-3">
            <Input placeholder={t.tripPurpose} value={purpose} onChange={(e) => setPurpose(e.target.value)} />
            <Btn size="lg" disabled={busy} onClick={start}>🚗 {busy ? t.gettingLoc : t.startTrip}</Btn>
          </div>
        )}
      </Card>

      <Card title={t.tripsTab + ' — ' + t.thisMonth + ' (' + t.totalKm + ': ' + mine.reduce((s, x) => s + tripKm(x), 0).toFixed(1) + ' ' + t.km + ')'}>
        {mine.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {mine.map((tr) => (
              <li key={tr.id} className="flex items-center justify-between gap-2 py-2.5 text-sm">
                <div className="min-w-0">
                  <p className="truncate font-semibold text-slate-800">{tr.purpose || '—'}</p>
                  <p className="text-xs text-slate-500">{localDay(tr.started_at)} · {fmtTime(tr.started_at)}{tr.ended_at ? '–' + fmtTime(tr.ended_at) : ''}</p>
                </div>
                {tr.status === 'open' ? <Badge tone="amber">{t.openTripLbl}</Badge> : <Badge tone="teal">{tripKm(tr).toFixed(1)} {t.km}</Badge>}
              </li>
            ))}
          </ul>
        )}
      </Card>

      {admin && others.length > 0 && (
        <Card title={t.tripsTab + ' — ' + t.employees}>
          <ul className="divide-y divide-slate-100">
            {Object.entries(byEmp).map(([empId, list]) => (
              <li key={empId} className="flex items-center justify-between py-2.5 text-sm">
                <span className="font-semibold text-slate-800">{eName(data.employees.find((e) => e.id === empId))}</span>
                <span className="text-slate-500">{list.length} · {list.reduce((s, x) => s + tripKm(x), 0).toFixed(1)} {t.km}</span>
              </li>
            ))}
          </ul>
        </Card>
      )}
    </>
  );
}

function ReviewTab({ me, data, toast, audit, eName, isHr }) {
  const { t } = useL();
  const first = todayISO().slice(0, 8) + '01';
  const [from, setFrom] = useState(first);
  const [to, setTo] = useState(todayISO());
  const [fEmp, setFEmp] = useState('');
  const [punches, setPunches] = useState(null);
  const [dayView, setDayView] = useState(null);   // {emp, date, punches}
  const [manual, setManual] = useState(null);

  useEffect(() => {
    setPunches(null);
    const end = new Date(to + 'T00:00:00'); end.setDate(end.getDate() + 1);
    sb.from('attendance_punches').select('*')
      .gte('punch_time', new Date(from + 'T00:00:00').toISOString())
      .lt('punch_time', end.toISOString())
      .order('punch_time')
      .then(({ data: d, error }) => { if (error) toast(error.message, 'error'); setPunches(d || []); });
  }, [from, to]);

  const companyWeekend = (data.settings.work_week || {}).weekend_days || [5, 6];
  const defShift = data.shifts[0];

  const rows = useMemo(() => {
    if (!punches) return [];
    const groups = {};
    for (const p of punches) {
      if (!p.employee_id) continue;
      if (fEmp && p.employee_id !== fEmp) continue;
      const k = p.employee_id + '|' + localDay(p.punch_time);
      (groups[k] = groups[k] || []).push(p);
    }
    return Object.entries(groups).map(([k, list]) => {
      const [empId, date] = k.split('|');
      const emp = data.employees.find((e) => e.id === empId);
      const shift = data.shifts.find((s) => s.id === (emp && emp.shift_id)) || defShift;
      const ins = list.filter((p) => p.direction === 'in');
      const outs = list.filter((p) => p.direction === 'out');
      const firstIn = ins.length ? ins[0] : list[0];
      const lastOut = outs.length ? outs[outs.length - 1] : (list.length > 1 ? list[list.length - 1] : null);
      const weekend = (emp && emp.weekend_days ? emp.weekend_days : companyWeekend).includes(new Date(date + 'T00:00:00').getDay());
      let late = 0, ot = 0, hours = 0;
      if (shift && firstIn) late = Math.max(0, minutesOf(firstIn.punch_time) - (timeToMin(shift.start_time) + shift.grace_minutes));
      if (firstIn && lastOut) hours = Math.round((new Date(lastOut.punch_time) - new Date(firstIn.punch_time)) / 36000) / 100;
      if (shift && lastOut) {
        const over = minutesOf(lastOut.punch_time) - timeToMin(shift.end_time);
        if (over >= shift.min_overtime_minutes) ot = over;
      }
      const flagged = list.some((p) => p.source === 'web' && p.within_geofence === false);
      return { emp, date, list, firstIn, lastOut, late: weekend ? 0 : late, ot, hours, weekend, missing: !lastOut, flagged };
    }).sort((a, b) => b.date.localeCompare(a.date) || eName(a.emp).localeCompare(eName(b.emp)));
  }, [punches, fEmp, data.employees, data.shifts]);

  async function saveManual() {
    if (!manual.employee_id || !manual.note) return toast(t.punchNote, 'error');
    const emp = data.employees.find((e) => e.id === manual.employee_id);
    const iso = new Date(manual.date + 'T' + manual.time).toISOString();
    const { data: row, error } = await sb.from('attendance_punches').insert({
      employee_id: emp.id, employee_device_code: emp.device_code || emp.employee_code,
      punch_time: iso, direction: manual.direction, device_id: 'manual', source: 'manual',
      note: manual.note, created_by: me.id,
    }).select().single();
    if (error) return toast(error.message.includes('ATTENDANCE_LOCKED') ? t.monthLocked : error.message, 'error');
    setPunches((prev) => [...prev, row].sort((a, b) => a.punch_time.localeCompare(b.punch_time)));
    audit('insert', 'attendance_punches', row.id, null, row);
    setManual(null);
    toast(t.saved);
  }

  async function removePunch(p) {
    if (!window.confirm(t.confirmDel)) return;
    const { error } = await sb.from('attendance_punches').delete().eq('id', p.id);
    if (error) return toast(error.message.includes('ATTENDANCE_LOCKED') ? t.monthLocked : error.message, 'error');
    setPunches((prev) => prev.filter((x) => x.id !== p.id));
    setDayView((prev) => prev ? { ...prev, list: prev.list.filter((x) => x.id !== p.id) } : null);
    audit('delete', 'attendance_punches', p.id, p, null);
  }

  return (
    <>
      <div className="grid grid-cols-2 gap-2">
        <Input type="date" value={from} onChange={(e) => setFrom(e.target.value)} />
        <Input type="date" value={to} onChange={(e) => setTo(e.target.value)} />
      </div>
      <div className="flex gap-2">
        <Select value={fEmp} onChange={(e) => setFEmp(e.target.value)}>
          <option value="">{t.selectEmployee} — {t.allBranches}</option>
          {data.employees.map((e) => <option key={e.id} value={e.id}>{eName(e)}</option>)}
        </Select>
        {isHr && <Btn onClick={() => setManual({ employee_id: fEmp || '', date: todayISO(), time: '09:00', direction: 'in', note: '' })}>+ {t.manualPunch}</Btn>}
      </div>

      <Card title={t.reviewTab}>
        {punches === null ? <Empty text={t.loading} /> : rows.length === 0 ? <Empty text={t.noData} /> : (
          <div className="overflow-x-auto">
            <table className="w-full min-w-[560px] text-sm">
              <thead><tr className="text-start text-xs text-slate-400">
                {[t.date, t.selectEmployee, t.firstIn, t.lastOut, t.lateMin, t.workedH, t.otMin, ''].map((h, i) => <th key={i} className="py-2 text-start font-semibold">{h}</th>)}
              </tr></thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={i} className="cursor-pointer border-t border-slate-100 hover:bg-slate-50" onClick={() => setDayView(r)}>
                    <td className="py-2 text-xs">{r.date.slice(5)}</td>
                    <td className="max-w-[130px] truncate font-semibold text-slate-800">{eName(r.emp)}</td>
                    <td>{r.firstIn ? fmtTime(r.firstIn.punch_time) : '—'}</td>
                    <td>{r.lastOut ? fmtTime(r.lastOut.punch_time) : '—'}</td>
                    <td className={r.late > 0 ? 'font-bold text-rose-600' : ''}>{r.late || ''}</td>
                    <td>{r.hours || ''}</td>
                    <td className={r.ot > 0 ? 'font-bold text-emerald-600' : ''}>{r.ot || ''}</td>
                    <td className="text-xs">
                      {r.weekend && <Badge>{t.weekendLbl}</Badge>}
                      {r.missing && !r.weekend && <Badge tone="amber">{t.missingOut}</Badge>}
                      {r.flagged && <Badge tone="red">📍</Badge>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Modal open={!!dayView} onClose={() => setDayView(null)} title={dayView ? eName(dayView.emp) + ' · ' + dayView.date : ''}>
        {dayView && (
          <ul className="divide-y divide-slate-100">
            {dayView.list.map((p) => (
              <li key={p.id} className="flex items-center justify-between gap-2 py-2.5 text-sm">
                <div>
                  <p className="font-semibold text-slate-800">{p.direction === 'in' ? t.dirIn : p.direction === 'out' ? t.dirOut : '—'} · {fmtTime(p.punch_time)}</p>
                  <p className="text-xs text-slate-500">
                    {p.source}{p.note ? ' · ' + p.note : ''}
                    {p.source === 'web' && p.within_geofence === false ? ' · ' + t.outsideBranch : ''}
                    {p.latitude != null && <> · <a className="text-brand-700 underline" target="_blank" rel="noreferrer"
                      href={'https://maps.google.com/?q=' + p.latitude + ',' + p.longitude} onClick={(e) => e.stopPropagation()}>📍</a></>}
                  </p>
                </div>
                {isHr && <Btn variant="ghost" size="sm" className="text-rose-600" onClick={() => removePunch(p)}>{t.del}</Btn>}
              </li>
            ))}
          </ul>
        )}
      </Modal>

      <Modal open={!!manual} onClose={() => setManual(null)} title={t.manualPunch}
        footer={<><Btn className="flex-1" onClick={saveManual}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setManual(null)}>{t.cancel}</Btn></>}>
        {manual && (
          <>
            <Field label={t.selectEmployee}>
              <Select value={manual.employee_id} onChange={(e) => setManual({ ...manual, employee_id: e.target.value })}>
                <option value="">—</option>
                {data.employees.map((e) => <option key={e.id} value={e.id}>{eName(e)}</option>)}
              </Select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.date}><Input type="date" value={manual.date} onChange={(e) => setManual({ ...manual, date: e.target.value })} /></Field>
              <Field label={t.punchTime}><Input type="time" value={manual.time} onChange={(e) => setManual({ ...manual, time: e.target.value })} /></Field>
            </div>
            <Field label={t.direction || ''}>
              <Select value={manual.direction} onChange={(e) => setManual({ ...manual, direction: e.target.value })}>
                <option value="in">{t.dirIn}</option><option value="out">{t.dirOut}</option>
              </Select>
            </Field>
            <Field label={t.punchNote}><Input value={manual.note} onChange={(e) => setManual({ ...manual, note: e.target.value })} /></Field>
          </>
        )}
      </Modal>
    </>
  );
}

function LockTab({ me, data, toast, audit }) {
  const { lang, t } = useL();
  const now = new Date();
  const [locks, setLocks] = useState(null);
  const [form, setForm] = useState({ branch_id: '', year: now.getFullYear(), month: now.getMonth() + 1 });

  useEffect(() => {
    sb.from('attendance_locks').select('*').order('year', { ascending: false }).order('month', { ascending: false })
      .then(({ data: d }) => setLocks(d || []));
  }, []);

  async function lock() {
    if (!form.branch_id) return toast(t.branch, 'error');
    const { data: row, error } = await sb.from('attendance_locks').insert({
      branch_id: form.branch_id, year: Number(form.year), month: Number(form.month), locked_by: me.id,
    }).select().single();
    if (error) return toast(error.message, 'error');
    setLocks((prev) => [row, ...(prev || [])]);
    audit('lock', 'attendance_locks', row.id, null, row);
    toast(t.saved);
  }

  async function unlock(l) {
    if (!window.confirm(t.confirmDel)) return;
    const { error } = await sb.from('attendance_locks').delete().eq('id', l.id);
    if (error) return toast(error.message, 'error');
    setLocks((prev) => prev.filter((x) => x.id !== l.id));
    audit('unlock', 'attendance_locks', l.id, l, null);
  }

  const branchName = (id) => { const b = data.branches.find((x) => x.id === id); return b ? (lang === 'ar' ? b.name_ar : b.name_en) : '—'; };

  return (
    <>
      <Card title={t.lockMonth}>
        <p className="mb-3 text-xs text-slate-500">{t.lockWarn}</p>
        <div className="grid grid-cols-3 gap-2">
          <Select value={form.branch_id} onChange={(e) => setForm({ ...form, branch_id: e.target.value })}>
            <option value="">{t.branch}</option>
            {data.branches.map((b) => <option key={b.id} value={b.id}>{lang === 'ar' ? b.name_ar : b.name_en}</option>)}
          </Select>
          <Select value={form.month} onChange={(e) => setForm({ ...form, month: e.target.value })}>
            {Array.from({ length: 12 }, (_, i) => <option key={i + 1} value={i + 1}>{i + 1}</option>)}
          </Select>
          <Select value={form.year} onChange={(e) => setForm({ ...form, year: e.target.value })}>
            {[now.getFullYear() - 1, now.getFullYear(), now.getFullYear() + 1].map((y) => <option key={y} value={y}>{y}</option>)}
          </Select>
        </div>
        <Btn className="mt-3" onClick={lock}>🔒 {t.lockMonth}</Btn>
      </Card>
      <Card title={t.lockedMonths}>
        {locks === null ? <Empty text={t.loading} /> : locks.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {locks.map((l) => (
              <li key={l.id} className="flex items-center justify-between py-2.5 text-sm">
                <span className="font-semibold text-slate-800">{branchName(l.branch_id)} · {l.month}/{l.year}</span>
                <Btn variant="ghost" size="sm" className="text-rose-600" onClick={() => unlock(l)}>{t.unlock}</Btn>
              </li>
            ))}
          </ul>
        )}
      </Card>
    </>
  );
}

      department_id: form.department_id || null,
      duties: form.duties, requirements: form.requirements,
      salary_note: form.salary_note, commission_note: form.commission_note,
      benefits: form.benefits, schedule_note: form.schedule_note,
      papers: (form.papers || []).filter((p) => p.trim()),
      is_active: form.is_active !== false,
    };
    let res;
    if (form.id) res = await sb.from('job_roles').update(payload).eq('id', form.id).select().single();
    else res = await sb.from('job_roles').insert(payload).select().single();
    if (res.error) return toast(res.error.message, 'error');
    const row = res.data;
    setRoles((prev) => (form.id ? prev.map((x) => (x.id === row.id ? row : x)) : [...prev, row]));
    audit(form.id ? 'update' : 'insert', 'job_roles', row.id, form.id ? form : null, row);
    setForm(null);
    toast(t.saved);
  }

  async function generate() {
    setGen((g) => ({ ...g, busy: true }));
    const { data: res, error } = await sb.functions.invoke('generate-jd', {
      body: {
        role: gen.role, kind: gen.kind, language: gen.language,
        candidate_name: gen.candidate_name || null, custom_notes: gen.custom_notes || null,
        company: data.settings.company || {},
      },
    });
    if (error) {
      let msg = error.message;
      try { const body = await error.context.json(); if (body.error) msg = body.error; } catch (e) {}
      setGen((g) => ({ ...g, busy: false }));
      return toast(t.aiFail + ': ' + msg, 'error');
    }
    setGen((g) => ({ ...g, busy: false, result: res.content_md }));
  }

  async function saveDoc() {
    const { data: row, error } = await sb.from('job_documents').insert({
      role_id: gen.role.id, doc_kind: gen.kind, language: gen.language,
      candidate_name: gen.candidate_name || null, custom_notes: gen.custom_notes || null,
      content_md: gen.result, created_by: me.id,
    }).select().single();
    if (error) return toast(error.message, 'error');
    setDocs((prev) => [row, ...prev]);
    audit('insert', 'job_documents', row.id, null, { role: gen.role.title_en, kind: gen.kind });
    setGen(null);
    toast(t.saved);
  }

  async function removeDoc(d) {
    if (!window.confirm(t.confirmDel)) return;
    const { error } = await sb.from('job_documents').delete().eq('id', d.id);
    if (error) return toast(error.message, 'error');
    setDocs((prev) => prev.filter((x) => x.id !== d.id));
    setViewDoc(null);
    audit('delete', 'job_documents', d.id, d, null);
  }

  const blankRole = () => ({ title_en: '', title_ar: '', department_id: '', duties: '', requirements: '', salary_note: '', commission_note: '', benefits: '', schedule_note: '', papers: [], is_active: true });
  const openGen = (role, kind) => setGen({ role, kind, language: 'both', candidate_name: '', custom_notes: '', result: null, busy: false });
  const docTitle = (d) => { const r = (roles || []).find((x) => x.id === d.role_id); return (d.doc_kind === 'offer' ? t.genOffer : t.genJd) + ' — ' + (r ? rTitle(r) : '') + (d.candidate_name ? ' — ' + d.candidate_name : ''); };
  const Ta = (p) => <textarea {...p} className={cx(inputCls, 'min-h-[90px]', p.className)} />;

  return (
    <>
      <div className="flex justify-end"><Btn onClick={() => setForm(blankRole())}>+ {t.addRole}</Btn></div>

      <Card title={t.jobs}>
        {roles === null ? <Empty text={t.loading} /> : roles.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {roles.map((r) => (
              <li key={r.id} className="py-3">
                <div className="flex items-center justify-between gap-2">
                  <div className="min-w-0">
                    <p className="truncate text-sm font-semibold text-slate-800">{rTitle(r)}</p>
                    <p className="truncate text-xs text-slate-500">{deptName(r.department_id)} · {r.schedule_note || '—'}</p>
                  </div>
                  <Btn variant="ghost" size="sm" onClick={() => setForm({ ...r, papers: r.papers || [] })}>{t.edit}</Btn>
                </div>
                <div className="mt-2 flex gap-2">
                  <Btn variant="soft" size="sm" className="flex-1" onClick={() => openGen(r, 'jd')}>📄 {t.genJd}</Btn>
                  <Btn variant="soft" size="sm" className="flex-1" onClick={() => openGen(r, 'offer')}>✉️ {t.genOffer}</Btn>
                </div>
              </li>
            ))}
          </ul>
        )}
      </Card>

      <Card title={t.savedDocs}>
        {docs.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {docs.map((d) => (
              <li key={d.id} className="flex cursor-pointer items-center justify-between gap-2 py-2.5" onClick={() => setViewDoc(d)}>
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-slate-800">{docTitle(d)}</p>
                  <p className="text-xs text-slate-500">{localDay(d.created_at)} · {d.language === 'both' ? t.bothLangs : d.language === 'ar' ? t.arabicLbl : t.englishLbl}</p>
                </div>
                <Badge tone={d.doc_kind === 'offer' ? 'amber' : 'teal'}>{d.doc_kind === 'offer' ? '✉️' : '📄'}</Badge>
              </li>
            ))}
          </ul>
        )}
      </Card>

      {/* ---------- role form ---------- */}
      <Modal open={!!form} onClose={() => setForm(null)} title={form && form.id ? t.edit : t.addRole}
        footer={<><Btn className="flex-1" onClick={saveRole}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setForm(null)}>{t.cancel}</Btn></>}>
        {form && (
          <>
            <Field label={t.nameAr}><Input value={form.title_ar} onChange={(e) => setForm({ ...form, title_ar: e.target.value })} /></Field>
            <Field label={t.nameEn}><Input value={form.title_en} onChange={(e) => setForm({ ...form, title_en: e.target.value })} /></Field>
            <Field label={t.department}>
              <Select value={form.department_id || ''} onChange={(e) => setForm({ ...form, department_id: e.target.value })}>
                <option value="">—</option>
                {data.departments.map((d) => <option key={d.id} value={d.id}>{lang === 'ar' ? d.name_ar : d.name_en}</option>)}
              </Select>
            </Field>
            <Field label={t.duties}><Ta value={form.duties || ''} onChange={(e) => setForm({ ...form, duties: e.target.value })} /></Field>
            <Field label={t.requirementsLbl}><Ta value={form.requirements || ''} onChange={(e) => setForm({ ...form, requirements: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.salaryNote}><Input value={form.salary_note || ''} onChange={(e) => setForm({ ...form, salary_note: e.target.value })} /></Field>
              <Field label={t.commissionNote}><Input value={form.commission_note || ''} onChange={(e) => setForm({ ...form, commission_note: e.target.value })} /></Field>
            </div>
            <Field label={t.benefitsLbl}><Input value={form.benefits || ''} onChange={(e) => setForm({ ...form, benefits: e.target.value })} /></Field>
            <Field label={t.scheduleNote}><Input value={form.schedule_note || ''} onChange={(e) => setForm({ ...form, schedule_note: e.target.value })} /></Field>
            <div>
              <div className="mb-1 flex items-center justify-between">
                <span className="text-xs font-semibold text-slate-600">{t.papersLbl}</span>
                <Btn variant="soft" size="sm" onClick={() => setForm({ ...form, papers: [...(form.papers || []), ''] })}>+ {t.addPaper}</Btn>
              </div>
              {(form.papers || []).map((p, i) => (
                <div key={i} className="mb-2 flex items-center gap-2">
                  <Input value={p} onChange={(e) => setForm({ ...form, papers: form.papers.map((x, idx) => (idx === i ? e.target.value : x)) })} />
                  <button onClick={() => setForm({ ...form, papers: form.papers.filter((_, idx) => idx !== i) })}
                    className="rounded-lg px-2 py-2 text-lg leading-none text-rose-500 hover:bg-rose-50">&times;</button>
                </div>
              ))}
            </div>
          </>
        )}
      </Modal>

      {/* ---------- generate modal ---------- */}
      <Modal open={!!gen} onClose={() => setGen(null)}
        title={gen ? (gen.kind === 'offer' ? '✉️ ' + t.genOffer : '📄 ' + t.genJd) + ' — ' + rTitle(gen.role) : ''}
        footer={gen && gen.result ? (
          <>
            <Btn className="flex-1" onClick={saveDoc}>{t.save}</Btn>
            <Btn variant="soft" className="flex-1" onClick={() => printDoc(rTitle(gen.role), gen.result, gen.language !== 'en')}>🖨️ {t.print}</Btn>
            <Btn variant="outline" onClick={() => setGen(null)}>{t.cancel}</Btn>
          </>
        ) : null}>
        {gen && !gen.result && (
          <>
            <Field label={t.docLang}>
              <Select value={gen.language} onChange={(e) => setGen({ ...gen, language: e.target.value })}>
                <option value="both">{t.bothLangs}</option>
                <option value="ar">{t.arabicLbl}</option>
                <option value="en">{t.englishLbl}</option>
              </Select>
            </Field>
            {gen.kind === 'offer' && (
              <Field label={t.candidateName}><Input value={gen.candidate_name} onChange={(e) => setGen({ ...gen, candidate_name: e.target.value })} /></Field>
            )}
            <Field label={t.customNotes}>
              <textarea className={cx(inputCls, 'min-h-[90px]')} value={gen.custom_notes} onChange={(e) => setGen({ ...gen, custom_notes: e.target.value })} />
            </Field>
            <Btn size="lg" disabled={gen.busy} onClick={generate}>{gen.busy ? t.generating : t.generate}</Btn>
          </>
        )}
        {gen && gen.result && (
          <>
            <p className="text-xs text-slate-500">{t.regenHint}</p>
            <textarea className={cx(inputCls, 'min-h-[160px] font-mono text-xs')} dir="auto" value={gen.result}
              onChange={(e) => setGen({ ...gen, result: e.target.value })} />
            <div className="max-h-72 overflow-y-auto rounded-xl border border-slate-200 p-4 text-sm [&_h1]:mb-2 [&_h1]:text-lg [&_h1]:font-bold [&_h2]:mt-3 [&_h2]:font-bold [&_li]:ms-4 [&_li]:list-disc [&_p]:my-1"
              dir="auto" dangerouslySetInnerHTML={{ __html: mdToHtml(gen.result) }} />
            <Btn variant="soft" size="sm" disabled={gen.busy} onClick={generate}>{gen.busy ? t.generating : '🔁 ' + t.generate}</Btn>
          </>
        )}
      </Modal>

      {/* ---------- saved doc viewer ---------- */}
      <Modal open={!!viewDoc} onClose={() => setViewDoc(null)} title={viewDoc ? docTitle(viewDoc) : ''}
        footer={viewDoc ? (
          <>
            <Btn variant="soft" className="flex-1" onClick={() => printDoc(docTitle(viewDoc), viewDoc.content_md, viewDoc.language !== 'en')}>🖨️ {t.print}</Btn>
            <Btn variant="ghost" className="text-rose-600" onClick={() => removeDoc(viewDoc)}>{t.del}</Btn>
            <Btn variant="outline" className="flex-1" onClick={() => setViewDoc(null)}>{t.close}</Btn>
          </>
        ) : null}>
        {viewDoc && (
          <div className="text-sm [&_h1]:mb-2 [&_h1]:text-lg [&_h1]:font-bold [&_h2]:mt-3 [&_h2]:font-bold [&_li]:ms-4 [&_li]:list-disc [&_p]:my-1"
            dir="auto" dangerouslySetInnerHTML={{ __html: mdToHtml(viewDoc.content_md) }} />
        )}
      </Modal>
    </>
  );
}
