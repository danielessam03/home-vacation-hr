        {roles === null ? <Empty text={t.loading} /> : roles.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {roles.map((r) => (
              <li key={r.id} className="py-3">
                <div className="flex items-center justify-between gap-2">
                  <div className="min-w-0">
                    <p className="truncate text-sm font-semibold text-slate-800">{rTitle(r)}</p>
                    <p className="truncate text-xs text-slate-500">{deptName(r.department_id)} · {r.schedule_note || '—'}</p>
                  </div>
                  <Btn variant="ghost" size="sm" onClick={() => setForm({ ...r, papers: r.papers || [] })}>{t.edit}</Btn>
                </div>
                <div className="mt-2 flex gap-2">
                  <Btn variant="soft" size="sm" className="flex-1" onClick={() => openGen(r, 'jd')}>📄 {t.genJd}</Btn>
                  <Btn variant="soft" size="sm" className="flex-1" onClick={() => openGen(r, 'offer')}>✉️ {t.genOffer}</Btn>
                </div>
              </li>
            ))}
          </ul>
        )}
      </Card>

      <Card title={t.savedDocs}>
        {docs.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {docs.map((d) => (
              <li key={d.id} className="flex cursor-pointer items-center justify-between gap-2 py-2.5" onClick={() => setViewDoc(d)}>
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-slate-800">{docTitle(d)}</p>
                  <p className="text-xs text-slate-500">{localDay(d.created_at)} · {d.language === 'both' ? t.bothLangs : d.language === 'ar' ? t.arabicLbl : t.englishLbl}</p>
                </div>
                <Badge tone={d.doc_kind === 'offer' ? 'amber' : 'teal'}>{d.doc_kind === 'offer' ? '✉️' : '📄'}</Badge>
              </li>
            ))}
          </ul>
        )}
      </Card>

      {/* ---------- role form ---------- */}
      <Modal open={!!form} onClose={() => setForm(null)} title={form && form.id ? t.edit : t.addRole}
        footer={<><Btn className="flex-1" onClick={saveRole}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setForm(null)}>{t.cancel}</Btn></>}>
        {form && (
          <>
            <Field label={t.nameAr}><Input value={form.title_ar} onChange={(e) => setForm({ ...form, title_ar: e.target.value })} /></Field>
            <Field label={t.nameEn}><Input value={form.title_en} onChange={(e) => setForm({ ...form, title_en: e.target.value })} /></Field>
            <Field label={t.department}>
              <Select value={form.department_id || ''} onChange={(e) => setForm({ ...form, department_id: e.target.value })}>
                <option value="">—</option>
                {data.departments.map((d) => <option key={d.id} value={d.id}>{lang === 'ar' ? d.name_ar : d.name_en}</option>)}
              </Select>
            </Field>
            <Field label={t.duties}><Ta value={form.duties || ''} onChange={(e) => setForm({ ...form, duties: e.target.value })} /></Field>
            <Field label={t.requirementsLbl}><Ta value={form.requirements || ''} onChange={(e) => setForm({ ...form, requirements: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.salaryNote}><Input value={form.salary_note || ''} onChange={(e) => setForm({ ...form, salary_note: e.target.value })} /></Field>
              <Field label={t.commissionNote}><Input value={form.commission_note || ''} onChange={(e) => setForm({ ...form, commission_note: e.target.value })} /></Field>
            </div>
            <Field label={t.benefitsLbl}><Input value={form.benefits || ''} onChange={(e) => setForm({ ...form, benefits: e.target.value })} /></Field>
            <Field label={t.scheduleNote}><Input value={form.schedule_note || ''} onChange={(e) => setForm({ ...form, schedule_note: e.target.value })} /></Field>
            <div>
              <div className="mb-1 flex items-center justify-between">
                <span className="text-xs font-semibold text-slate-600">{t.papersLbl}</span>
                <Btn variant="soft" size="sm" onClick={() => setForm({ ...form, papers: [...(form.papers || []), ''] })}>+ {t.addPaper}</Btn>
              </div>
              {(form.papers || []).map((p, i) => (
                <div key={i} className="mb-2 flex items-center gap-2">
                  <Input value={p} onChange={(e) => setForm({ ...form, papers: form.papers.map((x, idx) => (idx === i ? e.target.value : x)) })} />
                  <button onClick={() => setForm({ ...form, papers: form.papers.filter((_, idx) => idx !== i) })}
                    className="rounded-lg px-2 py-2 text-lg leading-none text-rose-500 hover:bg-rose-50">&times;</button>
                </div>
              ))}
            </div>
          </>
        )}
      </Modal>

      {/* ---------- generate modal ---------- */}
      <Modal open={!!gen} onClose={() => setGen(null)}
        title={gen ? (gen.kind === 'offer' ? '✉️ ' + t.genOffer : '📄 ' + t.genJd) + ' — ' + rTitle(gen.role) : ''}
        footer={gen && gen.result ? (
          <>
            <Btn className="flex-1" onClick={saveDoc}>{t.save}</Btn>
            <Btn variant="soft" className="flex-1" onClick={() => printDoc(rTitle(gen.role), gen.result, gen.language !== 'en')}>🖨️ {t.print}</Btn>
            <Btn variant="outline" onClick={() => setGen(null)}>{t.cancel}</Btn>
          </>
        ) : null}>
        {gen && !gen.result && (
          <>
            <Field label={t.docLang}>
              <Select value={gen.language} onChange={(e) => setGen({ ...gen, language: e.target.value })}>
                <option value="both">{t.bothLangs}</option>
                <option value="ar">{t.arabicLbl}</option>
                <option value="en">{t.englishLbl}</option>
              </Select>
            </Field>
            {gen.kind === 'offer' && (
              <Field label={t.candidateName}><Input value={gen.candidate_name} onChange={(e) => setGen({ ...gen, candidate_name: e.target.value })} /></Field>
            )}
            <Field label={t.customNotes}>
              <textarea className={cx(inputCls, 'min-h-[90px]')} value={gen.custom_notes} onChange={(e) => setGen({ ...gen, custom_notes: e.target.value })} />
            </Field>
            <Btn size="lg" disabled={gen.busy} onClick={generate}>{gen.busy ? t.generating : t.generate}</Btn>
          </>
        )}
        {gen && gen.result && (
          <>
            <p className="text-xs text-slate-500">{t.regenHint}</p>
            <textarea className={cx(inputCls, 'min-h-[160px] font-mono text-xs')} dir="auto" value={gen.result}
              onChange={(e) => setGen({ ...gen, result: e.target.value })} />
            <div className="max-h-72 overflow-y-auto rounded-xl border border-slate-200 p-4 text-sm [&_h1]:mb-2 [&_h1]:text-lg [&_h1]:font-bold [&_h2]:mt-3 [&_h2]:font-bold [&_li]:ms-4 [&_li]:list-disc [&_p]:my-1"
              dir="auto" dangerouslySetInnerHTML={{ __html: mdToHtml(gen.result) }} />
            <Btn variant="soft" size="sm" disabled={gen.busy} onClick={generate}>{gen.busy ? t.generating : '🔁 ' + t.generate}</Btn>
          </>
        )}
      </Modal>

      {/* ---------- saved doc viewer ---------- */}
      <Modal open={!!viewDoc} onClose={() => setViewDoc(null)} title={viewDoc ? docTitle(viewDoc) : ''}
        footer={viewDoc ? (
          <>
            <Btn variant="soft" className="flex-1" onClick={() => printDoc(docTitle(viewDoc), viewDoc.content_md, viewDoc.language !== 'en')}>🖨️ {t.print}</Btn>
            <Btn variant="ghost" className="text-rose-600" onClick={() => removeDoc(viewDoc)}>{t.del}</Btn>
            <Btn variant="outline" className="flex-1" onClick={() => setViewDoc(null)}>{t.close}</Btn>
          </>
        ) : null}>
        {viewDoc && (
          <div className="text-sm [&_h1]:mb-2 [&_h1]:text-lg [&_h1]:font-bold [&_h2]:mt-3 [&_h2]:font-bold [&_li]:ms-4 [&_li]:list-disc [&_p]:my-1"
            dir="auto" dangerouslySetInnerHTML={{ __html: mdToHtml(viewDoc.content_md) }} />
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   7e. Leave management
   ===================================================================== */
function LeavePage({ me, data, toast, audit }) {
  const { lang, t } = useL();
  const isHr = ['ceo', 'hr'].includes(me.role);
  const admin = me.role !== 'staff';
  const myEmp = data.employees.find((e) => e.user_id === me.id);
  const year = new Date().getFullYear();

  const [types, setTypes] = useState([]);
  const [reqs, setReqs] = useState(null);
  const [adjs, setAdjs] = useState([]);
  const [form, setForm] = useState(null);
  const [action, setAction] = useState(null);   // {req, kind: approve|reject|confirm, note}
  const [adjForm, setAdjForm] = useState(null);

  const tabs = [
    ...(myEmp ? [{ k: 'mine', label: t.myLeave }] : []),
    ...(admin ? [{ k: 'approvals', label: t.approvals }] : []),
    ...(['ceo', 'hr', 'accountant'].includes(me.role) ? [{ k: 'balances', label: t.balances }] : []),
  ];
  const [tab, setTab] = useState(tabs.length ? tabs[0].k : 'mine');

  useEffect(() => {
    (async () => {
      const [ty, rq, ad] = await Promise.all([
        sb.from('leave_types').select('*').eq('is_active', true).order('sort'),
        sb.from('leave_requests').select('*').gte('start_date', year + '-01-01').order('created_at', { ascending: false }),
        sb.from('leave_adjustments').select('*').eq('year', year),
      ]);
      setTypes(ty.data || []);
      setReqs(rq.data || []);
      setAdjs(ad.data || []);
    })();
  }, []);

  const eName = (e) => e ? ((lang === 'ar' ? e.full_name_ar : e.full_name_en) || e.full_name_en) : '—';
  const tyName = (ty) => ty ? (lang === 'ar' ? ty.name_ar : ty.name_en) : '—';
  const tyById = (id) => types.find((x) => x.id === id);
  const tyByCode = (c) => types.find((x) => x.code === c);
  const companyWeekend = (data.settings.work_week || {}).weekend_days || [5, 6];
  const empWeekend = (emp) => (emp && emp.weekend_days) || companyWeekend;

  const balance = (emp) => leaveBalance(emp, year, reqs || [], adjs, types);

  /* ---------- create request ---------- */
  function openForm() {
    setForm({ employee_id: myEmp ? myEmp.id : '', leave_type_id: (tyByCode('annual') || types[0] || {}).id || '', start_date: todayISO(), end_date: todayISO(), reason: '' });
  }

  const formEmp = form ? data.employees.find((e) => e.id === form.employee_id) : null;
  const formDays = form && formEmp ? countWorkingDays(form.start_date, form.end_date, empWeekend(formEmp), data.holidays, formEmp.branch_id) : 0;

  async function submitRequest() {
    const emp = formEmp;
    const ty = tyById(form.leave_type_id);
    if (!emp || !ty) return;
    if (formDays <= 0) return toast(t.zeroDays, 'error');
    const overlap = (reqs || []).some((r) => r.employee_id === emp.id && !['rejected', 'cancelled'].includes(r.status)
      && r.start_date <= form.end_date && r.end_date >= form.start_date);
    if (overlap) return toast(t.overlapErr, 'error');
    const b = balance(emp);
    if (ty.code === 'annual' || ty.code === 'casual') {
      if (!b.ent.dueYet) return toast(t.needSixMonths, 'error');
      const room = ty.code === 'annual' ? b.annualRemaining : b.casualRemaining;
      if (formDays > room) return toast(t.notEnoughBalance + ' (' + t.remaining + ': ' + room + ')', 'error');
    }
    if (ty.max_days_per_year && ['sick', 'maternity'].includes(ty.code)) {
      const used = ty.code === 'sick' ? b.sickTaken : b.maternityTaken;
      if (used + formDays > Number(ty.max_days_per_year)) return toast(t.notEnoughBalance, 'error');
    }
    const { data: row, error } = await sb.from('leave_requests').insert({
      employee_id: emp.id, leave_type_id: ty.id,
      start_date: form.start_date, end_date: form.end_date,
      days: formDays, reason: form.reason || null,
    }).select().single();
    if (error) return toast(error.message, 'error');
    setReqs((prev) => [row, ...prev]);
    audit('insert', 'leave_requests', row.id, null, row);
    setForm(null);
    toast(t.saved);
  }

  /* ---------- approvals ---------- */
  async function act() {
    const { req, kind, note } = action;
    const patch = {};
    if (kind === 'reject') {
      patch.status = 'rejected';
      if (isHr || req.status === 'manager_approved') { patch.hr_action_by = me.id; patch.hr_action_at = new Date().toISOString(); patch.hr_note = note || null; }
      else { patch.manager_action_by = me.id; patch.manager_action_at = new Date().toISOString(); patch.manager_note = note || null; }
    } else if (kind === 'manager') {
      patch.status = 'manager_approved';
      patch.manager_action_by = me.id; patch.manager_action_at = new Date().toISOString(); patch.manager_note = note || null;
    } else if (kind === 'hr') {
      patch.status = 'approved';
      patch.hr_action_by = me.id; patch.hr_action_at = new Date().toISOString(); patch.hr_note = note || null;
      if (!req.manager_action_by) { patch.manager_action_by = me.id; patch.manager_action_at = new Date().toISOString(); }
    } else if (kind === 'cancel') {
      patch.status = 'cancelled';
    }
    const { data: row, error } = await sb.from('leave_requests').update(patch).eq('id', req.id).select().single();
    if (error) return toast(error.message, 'error');
    setReqs((prev) => prev.map((r) => (r.id === row.id ? row : r)));
    audit(kind === 'cancel' ? 'cancel' : kind === 'reject' ? 'reject' : 'approve', 'leave_requests', row.id, req, row);
    setAction(null);
    toast(t.saved);
  }

  async function saveAdj() {
    const { data: row, error } = await sb.from('leave_adjustments').insert({
      employee_id: adjForm.employee_id, leave_type_id: adjForm.leave_type_id, year,
      days: Number(adjForm.days), reason: adjForm.reason, created_by: me.id,
    }).select().single();
    if (error) return toast(error.message, 'error');
    setAdjs((prev) => [...prev, row]);
    audit('insert', 'leave_adjustments', row.id, null, row);
    setAdjForm(null);
    toast(t.saved);
  }

  const lvTone = (s) => s === 'approved' ? 'green' : s === 'rejected' ? 'red' : s === 'cancelled' ? 'slate' : 'amber';

  function ReqRow({ r, showName }) {
    const emp = data.employees.find((e) => e.id === r.employee_id);
    const ty = tyById(r.leave_type_id);
    const canManagerAct = r.status === 'pending' && !isHr && admin && emp && myEmp && emp.manager_id === myEmp.id;
    const canHrAct = isHr && ['pending', 'manager_approved'].includes(r.status);
    const canCancel = myEmp && r.employee_id === myEmp.id && ['pending', 'manager_approved'].includes(r.status);
    return (
      <li className="space-y-2 py-3">
        <div className="flex items-center justify-between gap-2">
          <div className="min-w-0">
            <p className="truncate text-sm font-semibold text-slate-800">{showName ? eName(emp) + ' · ' : ''}{tyName(ty)}</p>
            <p className="text-xs text-slate-500">{r.start_date} ← {r.end_date} · {Number(r.days)} {t.daysLbl}{r.reason ? ' · ' + r.reason : ''}</p>
          </div>
          <Badge tone={lvTone(r.status)}>{t.lvStatus[r.status]}</Badge>
        </div>
        {(canManagerAct || canHrAct || canCancel) && (
          <div className="flex gap-2">
            {canManagerAct && <><Btn size="sm" className="flex-1" onClick={() => setAction({ req: r, kind: 'manager', note: '' })}>{t.approve}</Btn>
              <Btn size="sm" variant="danger" className="flex-1" onClick={() => setAction({ req: r, kind: 'reject', note: '' })}>{t.reject}</Btn></>}
            {canHrAct && <><Btn size="sm" className="flex-1" onClick={() => setAction({ req: r, kind: 'hr', note: '' })}>{r.status === 'pending' ? t.approve : t.confirmHr}</Btn>
              <Btn size="sm" variant="danger" className="flex-1" onClick={() => setAction({ req: r, kind: 'reject', note: '' })}>{t.reject}</Btn></>}
            {canCancel && !canHrAct && <Btn size="sm" variant="outline" className="flex-1" onClick={() => setAction({ req: r, kind: 'cancel', note: '' })}>{t.cancelReq}</Btn>}
          </div>
        )}
      </li>
    );
  }

  const myReqs = myEmp && reqs ? reqs.filter((r) => r.employee_id === myEmp.id) : [];
  const pendingForMe = reqs ? reqs.filter((r) => {
    if (isHr) return ['pending', 'manager_approved'].includes(r.status);
    if (!admin || !myEmp) return false;
    const emp = data.employees.find((e) => e.id === r.employee_id);
    return r.status === 'pending' && emp && emp.manager_id === myEmp.id;
  }) : [];
  const myBal = myEmp ? balance(myEmp) : null;

  if (!tabs.length) return <Card><Empty text={t.noEmpLink} /></Card>;

  return (
    <>
      <div className="no-scrollbar flex gap-2 overflow-x-auto pb-1">
        {tabs.map((x) => (
          <button key={x.k} onClick={() => setTab(x.k)}
            className={cx('shrink-0 rounded-full px-3.5 py-1.5 text-sm font-semibold', tab === x.k ? 'bg-brand-700 text-white' : 'border border-slate-300 bg-white text-slate-600')}>
            {x.label}{x.k === 'approvals' && pendingForMe.length > 0 ? ' (' + pendingForMe.length + ')' : ''}
          </button>
        ))}
      </div>

      {tab === 'mine' && myEmp && (
        <>
          {myBal && (
            <div className="grid grid-cols-4 gap-2">
              {[
                [t.annualShort, myBal.ent.dueYet ? myBal.annualRemaining : '—', '🌴'],
                [t.casualShort, myBal.ent.dueYet ? myBal.casualRemaining : '—', '⚡'],
                [t.sickShort, myBal.sickTaken, '🤒'],
                [t.unpaidShort, myBal.unpaidTaken, '⏸️'],
              ].map(([l, v, i], idx) => (
                <div key={idx} className="rounded-2xl border border-slate-200 bg-white p-2.5 text-center">
                  <div>{i}</div>
                  <div className="text-lg font-bold text-slate-800">{v}</div>
                  <div className="text-[10px] text-slate-500">{l}{idx < 2 ? ' · ' + t.remaining : ' · ' + t.taken}</div>
                </div>
              ))}
            </div>
          )}
          {myBal && !myBal.ent.dueYet && <p className="rounded-xl bg-amber-50 p-3 text-xs text-amber-800">{t.needSixMonths}</p>}
          <Btn size="lg" onClick={openForm}>+ {t.newRequest}</Btn>
          <Card title={t.myLeave + ' — ' + year}>
            {reqs === null ? <Empty text={t.loading} /> : myReqs.length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100">{myReqs.map((r) => <ReqRow key={r.id} r={r} showName={false} />)}</ul>
            )}
          </Card>
        </>
      )}

      {tab === 'approvals' && (
        <>
          {isHr && <Btn onClick={openForm}>+ {t.newRequest}</Btn>}
          <Card title={t.approvals}>
            {reqs === null ? <Empty text={t.loading} /> : pendingForMe.length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100">{pendingForMe.map((r) => <ReqRow key={r.id} r={r} showName={true} />)}</ul>
            )}
          </Card>
          <Card title={t.leave + ' — ' + year}>
            {reqs === null ? <Empty text={t.loading} /> : reqs.length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100">{reqs.slice(0, 30).map((r) => <ReqRow key={r.id} r={r} showName={true} />)}</ul>
            )}
          </Card>
        </>
      )}

      {tab === 'balances' && (
        <Card title={t.balances + ' — ' + year}>
          <div className="overflow-x-auto">
            <table className="w-full min-w-[560px] text-sm">
              <thead><tr>
                {[t.selectEmployee, t.entitlement, t.taken, t.remaining, t.casualShort + ' /7', t.sickShort, t.unpaidShort, ''].map((h, i) =>
                  <th key={i} className="py-2 text-start text-xs font-semibold text-slate-400">{h}</th>)}
              </tr></thead>
              <tbody>
                {data.employees.filter((e) => e.status === 'active').map((e) => {
                  const b = balance(e);
                  return (
                    <tr key={e.id} className="border-t border-slate-100">
                      <td className="max-w-[140px] truncate py-2 font-semibold text-slate-800">{eName(e)}</td>
                      <td>{b.ent.dueYet ? b.ent.days : '—'}</td>
                      <td>{b.annualTaken + b.casualTaken}</td>
                      <td className={b.annualRemaining < 0 ? 'font-bold text-rose-600' : 'font-semibold'}>{b.ent.dueYet ? b.annualRemaining : '—'}</td>
                      <td>{b.casualTaken}</td>
                      <td>{b.sickTaken}</td>
                      <td>{b.unpaidTaken}</td>
                      <td>{isHr && <Btn variant="ghost" size="sm" onClick={() => setAdjForm({ employee_id: e.id, leave_type_id: (tyByCode('annual') || {}).id, days: '', reason: '' })}>±</Btn>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* ---------- new request ---------- */}
      <Modal open={!!form} onClose={() => setForm(null)} title={t.newRequest}
        footer={<><Btn className="flex-1" onClick={submitRequest}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setForm(null)}>{t.cancel}</Btn></>}>
        {form && (
          <>
            {isHr && (
              <Field label={t.selectEmployee}>
                <Select value={form.employee_id} onChange={(e) => setForm({ ...form, employee_id: e.target.value })}>
                  <option value="">—</option>
                  {data.employees.filter((e) => e.status === 'active').map((e) => <option key={e.id} value={e.id}>{eName(e)}</option>)}
                </Select>
              </Field>
            )}
            <Field label={t.leaveType}>
              <Select value={form.leave_type_id} onChange={(e) => setForm({ ...form, leave_type_id: e.target.value })}>
                {types.filter((ty) => ty.for_gender === 'any' || !formEmp || !formEmp.gender || ty.for_gender === formEmp.gender)
                  .map((ty) => <option key={ty.id} value={ty.id}>{tyName(ty)}</option>)}
              </Select>
            </Field>
            {(tyById(form.leave_type_id) || {}).code === 'casual' && <p className="text-xs text-amber-700">{t.casualHint}</p>}
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.from}><Input type="date" value={form.start_date} onChange={(e) => setForm({ ...form, start_date: e.target.value, end_date: e.target.value > form.end_date ? e.target.value : form.end_date })} /></Field>
              <Field label={t.to}><Input type="date" value={form.end_date} onChange={(e) => setForm({ ...form, end_date: e.target.value })} /></Field>
            </div>
            <p className="rounded-xl bg-slate-50 p-3 text-center text-sm font-semibold text-slate-700">{t.workingDays}: {formDays}</p>
            <Field label={t.reasonLbl}><Input value={form.reason} onChange={(e) => setForm({ ...form, reason: e.target.value })} /></Field>
          </>
        )}
      </Modal>

      {/* ---------- approve / reject / cancel ---------- */}
      <Modal open={!!action} onClose={() => setAction(null)}
        title={action ? (action.kind === 'reject' ? t.reject : action.kind === 'cancel' ? t.cancelReq : t.approve) : ''}
        footer={<><Btn className="flex-1" variant={action && action.kind === 'reject' ? 'danger' : 'primary'} onClick={act}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setAction(null)}>{t.cancel}</Btn></>}>
        {action && action.kind !== 'cancel' && (
          <Field label={t.noteOpt}><Input value={action.note} onChange={(e) => setAction({ ...action, note: e.target.value })} /></Field>
        )}
        {action && action.kind === 'cancel' && <p className="text-sm text-slate-600">{t.confirmDel}</p>}
      </Modal>

      {/* ---------- balance adjustment ---------- */}
      <Modal open={!!adjForm} onClose={() => setAdjForm(null)} title={t.adjustBalance}
        footer={<><Btn className="flex-1" onClick={saveAdj} disabled={!adjForm || !adjForm.days || !adjForm.reason}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setAdjForm(null)}>{t.cancel}</Btn></>}>
        {adjForm && (
          <>
            <Field label={t.leaveType}>
              <Select value={adjForm.leave_type_id} onChange={(e) => setAdjForm({ ...adjForm, leave_type_id: e.target.value })}>
                {types.map((ty) => <option key={ty.id} value={ty.id}>{tyName(ty)}</option>)}
              </Select>
            </Field>
            <Field label={t.daysLbl} hint={t.creditHint}>
              <Input type="number" step="0.5" inputMode="decimal" value={adjForm.days} onChange={(e) => setAdjForm({ ...adjForm, days: e.target.value })} />
            </Field>
            <Field label={t.reasonLbl}><Input value={adjForm.reason} onChange={(e) => setAdjForm({ ...adjForm, reason: e.target.value })} /></Field>
          </>
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   7f. Payroll
   ===================================================================== */
function PayrollPage({ me, data, toast, audit }) {
  const { lang, t } = useL();
  const canEdit = ['ceo', 'accountant'].includes(me.role);
  const isCeo = me.role === 'ceo';
  const now = new Date();
  const [runs, setRuns] = useState(null);
  const [open, setOpen] = useState(null);       // run being viewed
  const [items, setItems] = useState(null);
  const [monthLocked, setMonthLocked] = useState(true);
  const [newRun, setNewRun] = useState(null);   // {branch_id, year, month, busy}
  const [editItem, setEditItem] = useState(null);

  useEffect(() => {
    sb.from('payroll_runs').select('*').order('year', { ascending: false }).order('month', { ascending: false })
      .then(({ data: d }) => setRuns(d || []));
  }, []);

  useEffect(() => {
    if (!open) { setItems(null); return; }
    let gone = false;
    (async () => {
      const [it, lk] = await Promise.all([
        sb.from('payroll_items').select('*').eq('run_id', open.id),
        sb.from('attendance_locks').select('id').eq('branch_id', open.branch_id).eq('year', open.year).eq('month', open.month).maybeSingle(),
      ]);
      if (gone) return;
      setItems((it.data || []).sort((a, b) => b.net_pay - a.net_pay));
      setMonthLocked(!!lk.data);
    })();
    return () => { gone = true; };
  }, [open && open.id]);

  const eName = (e) => e ? ((lang === 'ar' ? e.full_name_ar : e.full_name_en) || e.full_name_en) : '—';
  const empById = (id) => data.employees.find((e) => e.id === id);
  const branchName = (id) => { const b = data.branches.find((x) => x.id === id); return b ? (lang === 'ar' ? b.name_ar : b.name_en) : '—'; };
  const prTone = (s) => s === 'approved' ? 'green' : s === 'review' ? 'amber' : 'slate';

  /** Everything the calculator needs, from already-loaded app data. */
  function baseCtx(year, month) {
    return {
      year, month,
      shifts: data.shifts, holidays: data.holidays,
      companyWeekend: (data.settings.work_week || {}).weekend_days || [5, 6],
      workWeek: data.settings.work_week || {},
      policy: data.settings.payroll_policy || {},
      insurance: data.insurance, taxBrackets: data.taxBrackets, taxSettings: data.taxSettings,
    };
  }

  async function generate() {
    const { branch_id, year, month } = newRun;
    if (!branch_id) return toast(t.branch, 'error');
    if ((runs || []).some((r) => r.branch_id === branch_id && r.year === Number(year) && r.month === Number(month)))
      return toast(t.runExists, 'error');
    const emps = data.employees.filter((e) => e.status === 'active' && e.branch_id === branch_id);
    if (!emps.length) return toast(t.noEmployees, 'error');
    setNewRun((n) => ({ ...n, busy: true }));

    const pad2 = (n) => String(n).padStart(2, '0');
    const from = year + '-' + pad2(month) + '-01';
    const nextM = month === 12 ? (Number(year) + 1) + '-01-01' : year + '-' + pad2(Number(month) + 1) + '-01';
    const [pu, lv, ty, ln] = await Promise.all([
      sb.from('attendance_punches').select('employee_id, punch_time, direction')
        .gte('punch_time', new Date(from + 'T00:00:00').toISOString())
        .lt('punch_time', new Date(nextM + 'T00:00:00').toISOString()),
      sb.from('leave_requests').select('*').eq('status', 'approved').lte('start_date', year + '-' + pad2(month) + '-31').gte('end_date', from),
      sb.from('leave_types').select('*'),
      sb.from('loans').select('*').eq('status', 'active'),
    ]);

    const ctx = { ...baseCtx(Number(year), Number(month)), leaves: lv.data || [], leaveTypes: ty.data || [], loans: ln.data || [] };
    const { data: run, error: runErr } = await sb.from('payroll_runs')
      .insert({ year: Number(year), month: Number(month), branch_id, created_by: me.id }).select().single();
    if (runErr) { setNewRun((n) => ({ ...n, busy: false })); return toast(runErr.message, 'error'); }

    const rows = emps.map((emp) => ({
      run_id: run.id, employee_id: emp.id,
      ...computePayrollItem(emp, { ...ctx, punches: (pu.data || []).filter((p) => p.employee_id === emp.id) }),
    }));
    const { data: saved, error: itemErr } = await sb.from('payroll_items').insert(rows).select();
    if (itemErr) {
      await sb.from('payroll_runs').delete().eq('id', run.id);
      setNewRun((n) => ({ ...n, busy: false }));
      return toast(itemErr.message, 'error');
    }
    setRuns((prev) => [run, ...prev]);
    audit('insert', 'payroll_runs', run.id, null, { ...run, employees: saved.length });
    setNewRun(null);
    setOpen(run);
    toast(t.saved);
  }

  async function recalc() {
    if (!window.confirm(t.recalc + '?')) return;
    await sb.from('payroll_items').delete().eq('run_id', open.id);
    const emps = data.employees.filter((e) => e.status === 'active' && e.branch_id === open.branch_id);
    const pad2 = (n) => String(n).padStart(2, '0');
    const from = open.year + '-' + pad2(open.month) + '-01';
    const nextM = open.month === 12 ? (open.year + 1) + '-01-01' : open.year + '-' + pad2(open.month + 1) + '-01';
    const [pu, lv, ty, ln] = await Promise.all([
      sb.from('attendance_punches').select('employee_id, punch_time, direction')
        .gte('punch_time', new Date(from + 'T00:00:00').toISOString())
        .lt('punch_time', new Date(nextM + 'T00:00:00').toISOString()),
      sb.from('leave_requests').select('*').eq('status', 'approved').lte('start_date', open.year + '-' + pad2(open.month) + '-31').gte('end_date', from),
      sb.from('leave_types').select('*'),
      sb.from('loans').select('*').eq('status', 'active'),
    ]);
    const ctx = { ...baseCtx(open.year, open.month), leaves: lv.data || [], leaveTypes: ty.data || [], loans: ln.data || [] };
    const rows = emps.map((emp) => ({
      run_id: open.id, employee_id: emp.id,
      ...computePayrollItem(emp, { ...ctx, punches: (pu.data || []).filter((p) => p.employee_id === emp.id) }),
    }));
    const { data: saved, error } = await sb.from('payroll_items').insert(rows).select();
    if (error) return toast(error.message, 'error');
    setItems(saved.sort((a, b) => b.net_pay - a.net_pay));
    audit('update', 'payroll_runs', open.id, null, { action: 'recalculated' });
    toast(t.saved);
  }

  async function setStatus(status) {
    const patch = { status };
    if (status === 'review') { patch.submitted_by = me.id; patch.submitted_at = new Date().toISOString(); }
    if (status === 'approved') { patch.approved_by = me.id; patch.approved_at = new Date().toISOString(); }
    const { data: row, error } = await sb.from('payroll_runs').update(patch).eq('id', open.id).select().single();
    if (error) return toast(error.message, 'error');
    setRuns((prev) => prev.map((r) => (r.id === row.id ? row : r)));
    setOpen(row);
    audit(status === 'approved' ? 'approve' : 'update', 'payroll_runs', row.id, open, row);

    // Approval is the moment loan installments become real payments.
    // The unique (loan, payroll item) index makes this safe to repeat.
    if (status === 'approved' && items) {
      const pays = [];
      for (const i of items) for (const d of (i.loan_details || [])) {
        pays.push({ loan_id: d.loan_id, employee_id: i.employee_id, payroll_item_id: i.id,
          year: row.year, month: row.month, amount: d.amount, kind: 'payroll', created_by: me.id });
      }
      if (pays.length) {
        const { error: pErr } = await sb.from('loan_payments').upsert(pays, { onConflict: 'loan_id,payroll_item_id', ignoreDuplicates: true });
        if (pErr) toast(pErr.message, 'error');
      }
    }
    toast(t.saved);
  }

  async function removeRun(r) {
    if (!window.confirm(t.confirmDel)) return;
    const { error } = await sb.from('payroll_runs').delete().eq('id', r.id);
    if (error) return toast(error.message, 'error');
    setRuns((prev) => prev.filter((x) => x.id !== r.id));
    setOpen(null);
    audit('delete', 'payroll_runs', r.id, r, null);
  }

  async function saveItemEdit() {
    const ctx = baseCtx(open.year, open.month);
    const next = recomputePayrollItem({
      ...editItem,
      other_earnings: r2(editItem.other_earnings), other_deductions: r2(editItem.other_deductions),
    }, ctx);
    const { data: row, error } = await sb.from('payroll_items').update({
      other_earnings: next.other_earnings, other_earnings_note: editItem.other_earnings_note || null,
      other_deductions: next.other_deductions, other_deductions_note: editItem.other_deductions_note || null,
      gross_pay: next.gross_pay, income_tax: next.income_tax,
      total_deductions: next.total_deductions, net_pay: next.net_pay,
    }).eq('id', editItem.id).select().single();
    if (error) return toast(error.message.includes('PAYROLL_LOCKED') ? t.prStatus.approved : error.message, 'error');
    setItems((prev) => prev.map((i) => (i.id === row.id ? row : i)));
    audit('update', 'payroll_items', row.id, editItem, row);
    setEditItem(null);
    toast(t.saved);
  }

  function exportBank() {
    const rows = [[t.empCode, t.selectEmployee, t.bankName, t.bankAccount, t.netLbl]];
    for (const i of items) {
      const emp = empById(i.employee_id);
      rows.push([emp ? emp.employee_code : '', eName(emp), emp && emp.bank_name || '', emp && emp.bank_account || '', i.net_pay]);
    }
    rows.push(['', '', '', t.totalNet, r2(items.reduce((s, i) => s + Number(i.net_pay), 0))]);
    downloadCsv('bank-transfer-' + open.month + '-' + open.year + '.csv', rows);
  }

  const totalNet = items ? r2(items.reduce((s, i) => s + Number(i.net_pay), 0)) : 0;

  /* ---------------- run detail view ---------------- */
  if (open) {
    const editable = canEdit && open.status !== 'approved';
    return (
      <>
        <div className="flex items-center justify-between gap-2">
          <Btn variant="ghost" size="sm" onClick={() => setOpen(null)}>← {t.payroll}</Btn>
          <Badge tone={prTone(open.status)}>{t.prStatus[open.status]}</Badge>
        </div>
        <Card title={branchName(open.branch_id) + ' · ' + open.month + '/' + open.year}>
          {!monthLocked && <p className="mb-3 rounded-xl bg-amber-50 p-3 text-xs text-amber-800">{t.monthNotLocked}</p>}
          <div className="mb-3 grid grid-cols-2 gap-3 text-center">
            <div className="rounded-xl bg-slate-50 p-3"><p className="text-xs text-slate-500">{t.employees}</p><p className="text-lg font-bold">{items ? items.length : '…'}</p></div>
            <div className="rounded-xl bg-brand-50 p-3"><p className="text-xs text-slate-500">{t.totalNet}</p><p className="text-lg font-bold text-brand-800">{money(totalNet)}</p></div>
          </div>
          <div className="flex flex-wrap gap-2">
            {editable && open.status === 'draft' && <Btn size="sm" onClick={() => setStatus('review')}>{t.submitReview}</Btn>}
            {isCeo && open.status === 'review' && <Btn size="sm" onClick={() => { if (window.confirm(t.approveRun + '?')) setStatus('approved'); }}>✅ {t.approveRun}</Btn>}
            {canEdit && open.status === 'review' && <Btn size="sm" variant="outline" onClick={() => setStatus('draft')}>{t.backToDraft}</Btn>}
            {editable && open.status === 'draft' && <Btn size="sm" variant="soft" onClick={recalc}>{t.recalc}</Btn>}
            {editable && open.status === 'draft' && <Btn size="sm" variant="ghost" className="text-rose-600" onClick={() => removeRun(open)}>{t.delRun}</Btn>}
            {items && items.length > 0 && <Btn size="sm" variant="soft" onClick={exportBank}>⬇️ {t.bankSheet}</Btn>}
          </div>
        </Card>

        <Card title={t.employees}>
          {items === null ? <Empty text={t.loading} /> : items.length === 0 ? <Empty text={t.noData} /> : (
            <ul className="divide-y divide-slate-100">
              {items.map((i) => {
                const emp = empById(i.employee_id);
                return (
                  <li key={i.id} className="flex cursor-pointer items-center justify-between gap-2 py-3" onClick={() => setEditItem({ ...i })}>
                    <div className="min-w-0">
                      <p className="truncate text-sm font-semibold text-slate-800">{eName(emp)}</p>
                      <p className="text-xs text-slate-500">{t.grossLbl} {money(i.gross_pay)} · {t.dedLbl} {money(i.total_deductions)}</p>
                    </div>
                    <span className="shrink-0 text-sm font-bold text-brand-800">{money(i.net_pay)}</span>
                  </li>
                );
              })}
            </ul>
          )}
        </Card>

        {/* item breakdown / edit */}
        <Modal open={!!editItem} onClose={() => setEditItem(null)} title={editItem ? eName(empById(editItem.employee_id)) : ''}
          footer={editItem ? (
            <>
              {editable && <Btn className="flex-1" onClick={saveItemEdit}>{t.save}</Btn>}
              <Btn variant="soft" className="flex-1" onClick={() => printPayslip(editItem, empById(editItem.employee_id), open, data.settings.company, t)}>🖨️ {t.payslip}</Btn>
              <Btn variant="outline" onClick={() => setEditItem(null)}>{t.close}</Btn>
            </>
          ) : null}>
          {editItem && (
            <>
              <div className="space-y-1 text-sm">
                {[
                  [t.basicLbl, editItem.basic_salary], [t.allowLbl, editItem.allowances_total],
                  [t.otLbl + ' (' + editItem.ot_minutes + ' ' + t.minutesLbl + ')', editItem.ot_amount],
                  [t.lateDedLbl + ' (' + editItem.late_minutes + ' ' + t.minutesLbl + ')', -editItem.late_deduction],
                  [t.unpaidDedLbl + ' (' + Number(editItem.unpaid_days) + ' ' + t.daysUnit + ')', -editItem.unpaid_deduction],
                  [t.sickDedLbl + ' (' + Number(editItem.sick_days) + ' ' + t.daysUnit + ')', -editItem.sick_deduction],
                  [t.insEmp, -editItem.insurance_employee],
                  [t.taxLbl, -editItem.income_tax],
                  [t.loanDedLbl, -(editItem.loan_deduction || 0)],
                ].filter(([, v]) => Number(v) !== 0).map(([k, v], i) => (
                  <div key={i} className="flex justify-between">
                    <span className="text-slate-500">{k}</span>
                    <b className={Number(v) < 0 ? 'text-rose-600' : ''}>{money(Math.abs(Number(v)))}{Number(v) < 0 ? ' -' : ''}</b>
                  </div>
                ))}
                <div className="flex justify-between border-t border-slate-200 pt-1 text-xs text-slate-400">
                  <span>{t.insEr}</span><span>{money(editItem.insurance_employer)}</span>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field label={t.otherEarn}>
                  <Input type="number" inputMode="decimal" disabled={!editable} value={editItem.other_earnings}
                    onChange={(e) => setEditItem({ ...editItem, other_earnings: e.target.value })} />
                </Field>
                <Field label={t.otherDed}>
                  <Input type="number" inputMode="decimal" disabled={!editable} value={editItem.other_deductions}
                    onChange={(e) => setEditItem({ ...editItem, other_deductions: e.target.value })} />
                </Field>
                <Field label={t.notes}>
                  <Input disabled={!editable} value={editItem.other_earnings_note || ''} onChange={(e) => setEditItem({ ...editItem, other_earnings_note: e.target.value })} />
                </Field>
                <Field label={t.notes}>
                  <Input disabled={!editable} value={editItem.other_deductions_note || ''} onChange={(e) => setEditItem({ ...editItem, other_deductions_note: e.target.value })} />
                </Field>
              </div>
              <div className="flex justify-between rounded-xl bg-brand-700 px-4 py-3 font-bold text-white">
                <span>{t.netLbl}</span><span>{money(editItem.net_pay)}</span>
              </div>
            </>
          )}
        </Modal>
      </>
    );
  }

  /* ---------------- runs list ---------------- */
  return (
    <>
      {canEdit && (
        <Btn size="lg" onClick={() => setNewRun({ branch_id: '', year: now.getFullYear(), month: now.getMonth() === 0 ? 12 : now.getMonth(), busy: false })}>
          + {t.newRun}
        </Btn>
      )}
      <Card title={t.payroll}>
        {runs === null ? <Empty text={t.loading} /> : runs.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {runs.map((r) => (
              <li key={r.id} className="flex cursor-pointer items-center justify-between gap-2 py-3" onClick={() => setOpen(r)}>
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-slate-800">{branchName(r.branch_id)} · {r.month}/{r.year}</p>
                  <p className="text-xs text-slate-500">{localDay(r.created_at)}</p>
                </div>
                <Badge tone={prTone(r.status)}>{t.prStatus[r.status]}</Badge>
              </li>
            ))}
          </ul>
        )}
      </Card>

      <Modal open={!!newRun} onClose={() => setNewRun(null)} title={t.newRun}
        footer={<><Btn className="flex-1" disabled={newRun && newRun.busy} onClick={generate}>{newRun && newRun.busy ? t.loading : t.generateRun}</Btn><Btn variant="outline" className="flex-1" onClick={() => setNewRun(null)}>{t.cancel}</Btn></>}>
        {newRun && (
          <>
            <Field label={t.branch}>
              <Select value={newRun.branch_id} onChange={(e) => setNewRun({ ...newRun, branch_id: e.target.value })}>
                <option value="">—</option>
                {data.branches.filter((b) => b.is_active).map((b) => <option key={b.id} value={b.id}>{lang === 'ar' ? b.name_ar : b.name_en}</option>)}
              </Select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.monthLbl}>
                <Select value={newRun.month} onChange={(e) => setNewRun({ ...newRun, month: Number(e.target.value) })}>
                  {Array.from({ length: 12 }, (_, i) => <option key={i + 1} value={i + 1}>{i + 1}</option>)}
                </Select>
              </Field>
              <Field label={t.yearLbl}>
                <Select value={newRun.year} onChange={(e) => setNewRun({ ...newRun, year: Number(e.target.value) })}>
                  {[now.getFullYear() - 1, now.getFullYear()].map((y) => <option key={y} value={y}>{y}</option>)}
                </Select>
              </Field>
            </div>
          </>
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   7g. Loans & advances
   ===================================================================== */
function LoansPage({ me, data, toast, audit }) {
  const { lang, t } = useL();
  const canEdit = ['ceo', 'hr', 'accountant'].includes(me.role);
  const myEmp = data.employees.find((e) => e.user_id === me.id);
  const now = new Date();
  const [loans, setLoans] = useState(null);
  const [view, setView] = useState(null);
  const [pays, setPays] = useState(null);
  const [form, setForm] = useState(null);
  const [payForm, setPayForm] = useState(null);

  useEffect(() => {
    sb.from('loans').select('*').order('created_at', { ascending: false }).then(({ data: d }) => setLoans(d || []));
  }, []);

  useEffect(() => {
    if (!view) { setPays(null); return; }
    sb.from('loan_payments').select('*').eq('loan_id', view.id).order('year').order('month')
      .then(({ data: d }) => setPays(d || []));
  }, [view && view.id]);

  const eName = (e) => e ? ((lang === 'ar' ? e.full_name_ar : e.full_name_en) || e.full_name_en) : '—';
  const empById = (id) => data.employees.find((e) => e.id === id);
  const remaining = (l) => r2(Number(l.principal) - Number(l.paid_total || 0));
  const tone = (s) => s === 'active' ? 'amber' : s === 'settled' ? 'green' : 'slate';

  async function saveLoan() {
    if (!form.employee_id || !(Number(form.principal) > 0) || !(Number(form.installment_amount) > 0)) return toast(t.principal, 'error');
    const { data: row, error } = await sb.from('loans').insert({
      employee_id: form.employee_id, loan_type: form.loan_type,
      principal: r2(form.principal), installments_count: Number(form.installments_count) || 1,
      installment_amount: r2(form.installment_amount),
      start_year: Number(form.start_year), start_month: Number(form.start_month),
      reason: form.reason || null, created_by: me.id,
    }).select().single();
    if (error) return toast(error.message, 'error');
    setLoans((prev) => [row, ...prev]);
    audit('insert', 'loans', row.id, null, row);
    setForm(null);
    toast(t.saved);
  }

  async function savePayment() {
    const amt = r2(payForm.amount);
    if (!(amt > 0)) return toast(t.principal, 'error');
    const { data: row, error } = await sb.from('loan_payments').insert({
      loan_id: view.id, employee_id: view.employee_id, year: Number(payForm.year), month: Number(payForm.month),
      amount: amt, kind: 'manual', note: payForm.note || null, created_by: me.id,
    }).select().single();
    if (error) return toast(error.message, 'error');
    setPays((prev) => [...(prev || []), row]);
    // the DB trigger updated paid_total/status; reflect it locally
    const { data: fresh } = await sb.from('loans').select('*').eq('id', view.id).single();
    if (fresh) { setView(fresh); setLoans((prev) => prev.map((l) => (l.id === fresh.id ? fresh : l))); }
    audit('insert', 'loan_payments', row.id, null, row);
    setPayForm(null);
    toast(t.saved);
  }

  async function cancelLoan() {
    if (!window.confirm(t.cancelLoan + '?')) return;
    const { data: row, error } = await sb.from('loans').update({ status: 'cancelled' }).eq('id', view.id).select().single();
    if (error) return toast(error.message, 'error');
    setLoans((prev) => prev.map((l) => (l.id === row.id ? row : l)));
    setView(row);
    audit('cancel', 'loans', row.id, view, row);
  }

  const list = loans ? (canEdit ? loans : loans.filter((l) => myEmp && l.employee_id === myEmp.id)) : null;
  const setInst = (f) => ({ ...f, installment_amount: f.principal && f.installments_count ? r2(Number(f.principal) / Number(f.installments_count)) : '' });

  return (
    <>
      {canEdit && (
        <Btn size="lg" onClick={() => setForm({ employee_id: '', loan_type: 'advance', principal: '', installments_count: 1, installment_amount: '', start_year: now.getFullYear(), start_month: now.getMonth() + 1, reason: '' })}>
          + {t.newLoan}
        </Btn>
      )}
      <Card title={canEdit ? t.loans : t.myLoans}>
        {list === null ? <Empty text={t.loading} /> : list.length === 0 ? <Empty text={t.noData} /> : (
          <ul className="divide-y divide-slate-100">
            {list.map((l) => (
              <li key={l.id} className="flex cursor-pointer items-center justify-between gap-2 py-3" onClick={() => setView(l)}>
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-slate-800">{canEdit ? eName(empById(l.employee_id)) + ' · ' : ''}{t.loanTypes[l.loan_type]}</p>
                  <p className="text-xs text-slate-500">{money(l.principal)} · {t.paidLbl} {money(l.paid_total)} · {t.remaining} <b>{money(remaining(l))}</b></p>
                </div>
                <Badge tone={tone(l.status)}>{t.loanStatus[l.status]}</Badge>
              </li>
            ))}
          </ul>
        )}
      </Card>

      <Modal open={!!view} onClose={() => setView(null)} title={view ? eName(empById(view.employee_id)) + ' · ' + t.loanTypes[view.loan_type] : ''}
        footer={view && canEdit && view.status === 'active' ? (
          <>
            <Btn className="flex-1" onClick={() => setPayForm({ year: now.getFullYear(), month: now.getMonth() + 1, amount: remaining(view), note: '' })}>{t.addPayment}</Btn>
            <Btn variant="ghost" className="text-rose-600" onClick={cancelLoan}>{t.cancelLoan}</Btn>
          </>
        ) : null}>
        {view && (
          <>
            <div className="grid grid-cols-2 gap-2 text-sm">
              {[[t.principal, money(view.principal)], [t.installmentAmt, money(view.installment_amount)],
                [t.installments, view.installments_count], [t.startFrom, view.start_month + '/' + view.start_year],
                [t.paidLbl, money(view.paid_total)], [t.remaining, money(remaining(view))]].map(([k, v], i) => (
                <div key={i}><dt className="text-xs text-slate-400">{k}</dt><dd className="font-semibold text-slate-800">{v}</dd></div>
              ))}
            </div>
            {view.reason && <p className="text-xs text-slate-500">{view.reason}</p>}
            <p className="text-xs font-semibold text-slate-600">{t.payments}</p>
            {pays === null ? <Empty text={t.loading} /> : pays.length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100 text-sm">
                {pays.map((p) => (
                  <li key={p.id} className="flex justify-between py-2">
                    <span className="text-slate-600">{p.month}/{p.year} · {t.paymentKind[p.kind]}{p.note ? ' · ' + p.note : ''}</span>
                    <b>{money(p.amount)}</b>
                  </li>
                ))}
              </ul>
            )}
          </>
        )}
      </Modal>

      <Modal open={!!form} onClose={() => setForm(null)} title={t.newLoan}
        footer={<><Btn className="flex-1" onClick={saveLoan}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setForm(null)}>{t.cancel}</Btn></>}>
        {form && (
          <>
            <Field label={t.selectEmployee}>
              <Select value={form.employee_id} onChange={(e) => setForm({ ...form, employee_id: e.target.value })}>
                <option value="">—</option>
                {data.employees.filter((e) => e.status === 'active').map((e) => <option key={e.id} value={e.id}>{eName(e)}</option>)}
              </Select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.loanTypes.loan + ' / ' + t.loanTypes.advance}>
                <Select value={form.loan_type} onChange={(e) => setForm({ ...form, loan_type: e.target.value })}>
                  {Object.keys(t.loanTypes).map((k) => <option key={k} value={k}>{t.loanTypes[k]}</option>)}
                </Select>
              </Field>
              <Field label={t.principal}><Input type="number" inputMode="decimal" value={form.principal} onChange={(e) => setForm(setInst({ ...form, principal: e.target.value }))} /></Field>
              <Field label={t.installments}><Input type="number" inputMode="numeric" min="1" value={form.installments_count} onChange={(e) => setForm(setInst({ ...form, installments_count: e.target.value }))} /></Field>
              <Field label={t.installmentAmt}><Input type="number" inputMode="decimal" value={form.installment_amount} onChange={(e) => setForm({ ...form, installment_amount: e.target.value })} /></Field>
              <Field label={t.startFrom + ' — ' + t.monthLbl}>
                <Select value={form.start_month} onChange={(e) => setForm({ ...form, start_month: e.target.value })}>
                  {Array.from({ length: 12 }, (_, i) => <option key={i + 1} value={i + 1}>{i + 1}</option>)}
                </Select>
              </Field>
              <Field label={t.yearLbl}>
                <Select value={form.start_year} onChange={(e) => setForm({ ...form, start_year: e.target.value })}>
                  {[now.getFullYear(), now.getFullYear() + 1].map((y) => <option key={y} value={y}>{y}</option>)}
                </Select>
              </Field>
            </div>
            <Field label={t.reasonLbl}><Input value={form.reason} onChange={(e) => setForm({ ...form, reason: e.target.value })} /></Field>
          </>
        )}
      </Modal>

      <Modal open={!!payForm} onClose={() => setPayForm(null)} title={t.addPayment}
        footer={<><Btn className="flex-1" onClick={savePayment}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setPayForm(null)}>{t.cancel}</Btn></>}>
        {payForm && (
          <>
            <Field label={t.principal}><Input type="number" inputMode="decimal" value={payForm.amount} onChange={(e) => setPayForm({ ...payForm, amount: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.monthLbl}>
                <Select value={payForm.month} onChange={(e) => setPayForm({ ...payForm, month: e.target.value })}>
                  {Array.from({ length: 12 }, (_, i) => <option key={i + 1} value={i + 1}>{i + 1}</option>)}
                </Select>
              </Field>
              <Field label={t.yearLbl}><Input type="number" value={payForm.year} onChange={(e) => setPayForm({ ...payForm, year: e.target.value })} /></Field>
            </div>
            <Field label={t.notes}><Input value={payForm.note} onChange={(e) => setPayForm({ ...payForm, note: e.target.value })} /></Field>
          </>
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   7h. Compliance -- filing calendar + NOSI forms
   ===================================================================== */
function CompliancePage({ me, data, toast, audit }) {
  const { lang, t } = useL();
  const [tab, setTab] = useState('calendar');
  const [tasks, setTasks] = useState(null);
  const [showDone, setShowDone] = useState(false);
  const [form, setForm] = useState(null);
  const [empId, setEmpId] = useState('');
  const company = data.settings.company || {};

  useEffect(() => {
    sb.from('compliance_tasks').select('*').order('due_date').then(({ data: d }) => setTasks(d || []));
  }, []);

  const eName = (e) => e ? ((lang === 'ar' ? e.full_name_ar : e.full_name_en) || e.full_name_en) : '—';
  const tTitle = (x) => (lang === 'ar' ? x.title_ar : x.title_en);
  const branchName = (id) => { const b = data.branches.find((x) => x.id === id); return b ? (lang === 'ar' ? b.name_ar : b.name_en) : '—'; };
  const deptName = (id) => { const d = data.departments.find((x) => x.id === id); return d ? (lang === 'ar' ? d.name_ar : d.name_en) : '—'; };

  function nextDue(due, rec) {
    const d = new Date(due + 'T00:00:00');
    if (rec === 'monthly') d.setMonth(d.getMonth() + 1);
    else if (rec === 'quarterly') d.setMonth(d.getMonth() + 3);
    else if (rec === 'annual') d.setFullYear(d.getFullYear() + 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  async function markDone(task) {
    const { data: row, error } = await sb.from('compliance_tasks')
      .update({ status: 'done', done_by: me.id, done_at: new Date().toISOString() }).eq('id', task.id).select().single();
    if (error) return toast(error.message, 'error');
    let next = null;
    if (task.recurrence !== 'once') {
      const res = await sb.from('compliance_tasks').insert({
        title_en: task.title_en, title_ar: task.title_ar, category: task.category,
        due_date: nextDue(task.due_date, task.recurrence), recurrence: task.recurrence, notes: task.notes,
      }).select().single();
      next = res.data;
    }
    setTasks((prev) => [...prev.map((x) => (x.id === row.id ? row : x)), ...(next ? [next] : [])].sort((a, b) => a.due_date.localeCompare(b.due_date)));
    audit('update', 'compliance_tasks', row.id, task, row);
    toast(t.saved);
  }

  async function saveTask() {
    const { data: row, error } = await sb.from('compliance_tasks').insert({
      title_en: form.title_en || form.title_ar, title_ar: form.title_ar || form.title_en,
      category: form.category, due_date: form.due_date, recurrence: form.recurrence, notes: form.notes || null,
    }).select().single();
    if (error) return toast(error.message, 'error');
    setTasks((prev) => [...prev, row].sort((a, b) => a.due_date.localeCompare(b.due_date)));
    setForm(null);
    toast(t.saved);
  }

  const employerRows = () => [
    [lang === 'ar' ? 'اسم المنشأة' : 'Employer', (company.name_ar || '') + ' — ' + (company.name_en || '')],
    [t.employerNo, company.nosi_employer_no], [t.nosiOffice, company.nosi_office],
    [t.commercialReg, company.commercial_reg], [t.taxFileNo, company.tax_file_no], [t.address, company.address],
  ];
  const employeeRows = (e) => [
    [t.fullNameAr, e.full_name_ar], [t.fullNameEn, e.full_name_en], [t.empCode, e.employee_code],
    [t.nationalId, e.national_id], [t.birthDate, e.birth_date], [t.gender, e.gender ? t[e.gender] : ''],
    [t.address, e.address], [t.phone, e.phone],
    [t.jobTitleAr, e.job_title_ar || e.job_title_en], [t.department, deptName(e.department_id)], [t.branch, branchName(e.branch_id)],
    [t.hireDate, e.hire_date], [t.contractType, t.contractTypes[e.contract_type]],
    [t.basicSalary, money(e.basic_salary)], [t.insuranceBase, money(e.insurance_base)], [t.nosiEmployeeNo, e.nosi_number],
  ];

  function printForm1(e) {
    printDataSheet(t.form1, [{ title: lang === 'ar' ? 'بيانات المنشأة' : 'Employer', rows: employerRows() },
      { title: lang === 'ar' ? 'بيانات المؤمن عليه' : 'Employee', rows: employeeRows(e) }], company);
  }
  function printForm6(e) {
    if (!e.termination_date) return toast(t.noTermination, 'error');
    printDataSheet(t.form6, [{ title: lang === 'ar' ? 'بيانات المنشأة' : 'Employer', rows: employerRows() },
      { title: lang === 'ar' ? 'بيانات المؤمن عليه' : 'Employee', rows: [...employeeRows(e), [t.terminationDate, e.termination_date], [t.notes, e.notes]] }], company);
  }
  function printForm2() {
    const emps = data.employees.filter((e) => e.status === 'active' && Number(e.insurance_base) > 0);
    printDataSheet(t.form2 + ' — ' + new Date().getFullYear(), [
      { title: lang === 'ar' ? 'بيانات المنشأة' : 'Employer', rows: employerRows() },
      { title: (lang === 'ar' ? 'المؤمن عليهم' : 'Insured employees') + ' (' + emps.length + ')',
        rows: emps.map((e) => [eName(e) + ' · ' + (e.nosi_number || '—'), (e.national_id || '—') + ' · ' + t.insuranceBase + ' ' + money(e.insurance_base)]) },
    ], company);
  }

  const visible = (tasks || []).filter((x) => showDone || x.status === 'open');
  const emp = data.employees.find((e) => e.id === empId);

  return (
    <>
      <div className="flex gap-2">
        {[['calendar', t.calendarTab], ['forms', t.formsTab]].map(([k, l]) => (
          <button key={k} onClick={() => setTab(k)}
            className={cx('rounded-full px-3.5 py-1.5 text-sm font-semibold', tab === k ? 'bg-brand-700 text-white' : 'border border-slate-300 bg-white text-slate-600')}>{l}</button>
        ))}
      </div>

      {tab === 'calendar' && (
        <>
          <div className="flex items-center justify-between">
            <label className="flex items-center gap-2 text-sm text-slate-600">
              <input type="checkbox" className="h-4 w-4 accent-brand-700" checked={showDone} onChange={(e) => setShowDone(e.target.checked)} />{t.showDone}
            </label>
            <Btn size="sm" onClick={() => setForm({ title_ar: '', title_en: '', category: 'other', due_date: todayISO(), recurrence: 'once', notes: '' })}>+ {t.addTask}</Btn>
          </div>
          <Card title={t.calendarTab}>
            {tasks === null ? <Empty text={t.loading} /> : visible.length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100">
                {visible.map((x) => {
                  const d = daysUntil(x.due_date);
                  return (
                    <li key={x.id} className="flex items-center justify-between gap-2 py-3">
                      <div className="min-w-0">
                        <p className="truncate text-sm font-semibold text-slate-800">{tTitle(x)}</p>
                        <p className="text-xs text-slate-500">{t.category[x.category]} · {t.recurrence[x.recurrence]} · {t.dueLbl} {x.due_date}{x.notes ? ' · ' + x.notes : ''}</p>
                      </div>
                      {x.status === 'done' ? <Badge tone="green">{t.doneLbl}</Badge> : (
                        <div className="flex shrink-0 items-center gap-2">
                          <Badge tone={d < 0 ? 'red' : d <= 7 ? 'amber' : 'slate'}>{d < 0 ? t.overdue : d + 'd'}</Badge>
                          <Btn size="sm" variant="soft" onClick={() => markDone(x)}>✓</Btn>
                        </div>
                      )}
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>
        </>
      )}

      {tab === 'forms' && (
        <>
          <Card title={t.formsTab}>
            <Field label={t.selectEmployee}>
              <Select value={empId} onChange={(e) => setEmpId(e.target.value)}>
                <option value="">—</option>
                {data.employees.map((e) => <option key={e.id} value={e.id}>{eName(e)} · {t.empStatus[e.status]}</option>)}
              </Select>
            </Field>
            <div className="mt-3 grid gap-2 sm:grid-cols-2">
              <Btn variant="soft" disabled={!emp} onClick={() => printForm1(emp)}>🖨️ {t.form1}</Btn>
              <Btn variant="soft" disabled={!emp} onClick={() => printForm6(emp)}>🖨️ {t.form6}</Btn>
            </div>
            <p className="mt-2 text-xs text-slate-400">{t.form1Hint}</p>
            <p className="text-xs text-slate-400">{t.form6Hint}</p>
          </Card>
          <Card title={t.form2}>
            <p className="mb-3 text-xs text-slate-500">{t.form2Hint}</p>
            <Btn variant="soft" onClick={printForm2}>🖨️ {t.form2}</Btn>
          </Card>
        </>
      )}

      <Modal open={!!form} onClose={() => setForm(null)} title={t.addTask}
        footer={<><Btn className="flex-1" disabled={!form || !(form.title_ar || form.title_en)} onClick={saveTask}>{t.save}</Btn><Btn variant="outline" className="flex-1" onClick={() => setForm(null)}>{t.cancel}</Btn></>}>
        {form && (
          <>
            <Field label={t.titleLbl + ' (ع)'}><Input value={form.title_ar} onChange={(e) => setForm({ ...form, title_ar: e.target.value })} /></Field>
            <Field label={t.titleLbl + ' (EN)'}><Input value={form.title_en} onChange={(e) => setForm({ ...form, title_en: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label={t.category.other}>
                <Select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
                  {Object.keys(t.category).map((k) => <option key={k} value={k}>{t.category[k]}</option>)}
                </Select>
              </Field>
              <Field label={t.recurrence.once}>
                <Select value={form.recurrence} onChange={(e) => setForm({ ...form, recurrence: e.target.value })}>
                  {Object.keys(t.recurrence).map((k) => <option key={k} value={k}>{t.recurrence[k]}</option>)}
                </Select>
              </Field>
            </div>
            <Field label={t.dueLbl}><Input type="date" value={form.due_date} onChange={(e) => setForm({ ...form, due_date: e.target.value })} /></Field>
            <Field label={t.notes}><Input value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
          </>
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   7i. Self-service -- "My HR"
   ===================================================================== */
function MyPage({ me, data, toast, setPage }) {
  const { lang, t } = useL();
  const myEmp = data.employees.find((e) => e.user_id === me.id);
  const year = new Date().getFullYear();
  const [d, setD] = useState(null);
  const [slip, setSlip] = useState(null);

  useEffect(() => {
    if (!myEmp) return;
    const mStart = new Date(); mStart.setDate(1); mStart.setHours(0, 0, 0, 0);
    (async () => {
      const [items, runs, reqs, adjs, types, punches, trips, loans, docs] = await Promise.all([
        sb.from('payroll_items').select('*').eq('employee_id', myEmp.id),
        sb.from('payroll_runs').select('*').eq('status', 'approved').order('year', { ascending: false }).order('month', { ascending: false }),
        sb.from('leave_requests').select('*').eq('employee_id', myEmp.id).gte('start_date', year + '-01-01').order('created_at', { ascending: false }),
        sb.from('leave_adjustments').select('*').eq('employee_id', myEmp.id).eq('year', year),
        sb.from('leave_types').select('*'),
        sb.from('attendance_punches').select('*').eq('employee_id', myEmp.id).gte('punch_time', mStart.toISOString()).order('punch_time', { ascending: false }),
        sb.from('trips').select('*').eq('employee_id', myEmp.id).gte('started_at', mStart.toISOString()),
        sb.from('loans').select('*').eq('employee_id', myEmp.id).eq('status', 'active'),
        sb.from('employee_documents').select('*').eq('employee_id', myEmp.id).order('created_at', { ascending: false }),
      ]);
      setD({
        items: items.data || [], runs: runs.data || [], reqs: reqs.data || [], adjs: adjs.data || [], types: types.data || [],
        punches: punches.data || [], trips: trips.data || [], loans: loans.data || [], docs: docs.data || [],
      });
    })();
  }, [myEmp && myEmp.id]);

  if (!myEmp) return <Card><Empty text={t.noEmpLink} /></Card>;
  const name = (lang === 'ar' ? myEmp.full_name_ar : myEmp.full_name_en) || myEmp.full_name_en;
  const branch = data.branches.find((b) => b.id === myEmp.branch_id);
  const bal = d ? leaveBalance(myEmp, year, d.reqs, d.adjs, d.types) : null;
  const tyName = (id) => { const ty = d && d.types.find((x) => x.id === id); return ty ? (lang === 'ar' ? ty.name_ar : ty.name_en) : '—'; };
  const lvTone = (s) => s === 'approved' ? 'green' : s === 'rejected' ? 'red' : s === 'cancelled' ? 'slate' : 'amber';
  const slips = d ? d.runs.map((r) => ({ run: r, item: d.items.find((i) => i.run_id === r.id) })).filter((x) => x.item) : [];
  const presentDays = d ? new Set(d.punches.map((p) => localDay(p.punch_time))).size : 0;
  const shift = data.shifts.find((s) => s.id === myEmp.shift_id) || data.shifts[0];
  const lateTotal = d && shift ? Object.values(d.punches.reduce((acc, p) => { (acc[localDay(p.punch_time)] = acc[localDay(p.punch_time)] || []).push(p); return acc; }, {}))
    .reduce((s, list) => { const first = list[list.length - 1]; return s + Math.max(0, minutesOf(first.punch_time) - (timeToMin(shift.start_time) + shift.grace_minutes)); }, 0) : 0;
  const km = d ? d.trips.reduce((s, x) => s + (x.manual_km != null ? Number(x.manual_km) : Number(x.distance_km) || 0), 0) : 0;

  async function openDoc(doc) {
    const { data: s, error } = await sb.storage.from('employee-docs').createSignedUrl(doc.file_path, 300);
    if (error) return toast(error.message, 'error');
    window.open(s.signedUrl, '_blank');
  }

  return (
    <>
      <div className="rounded-2xl bg-gradient-to-br from-brand-700 to-brand-900 p-5 text-white">
        <p className="text-sm text-brand-200">{t.welcome}</p>
        <p className="text-xl font-bold">{name}</p>
        <p className="mt-1 text-sm text-brand-200">{(lang === 'ar' ? myEmp.job_title_ar : myEmp.job_title_en) || '—'} · {branch ? (lang === 'ar' ? branch.name_ar : branch.name_en) : '—'} · {myEmp.employee_code}</p>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <Btn variant="soft" className="flex-col !py-3 text-xs" onClick={() => setPage('attendance')}>🕐<span>{t.goCheckIn}</span></Btn>
        <Btn variant="soft" className="flex-col !py-3 text-xs" onClick={() => setPage('leave')}>🌴<span>{t.goLeave}</span></Btn>
        <Btn variant="soft" className="flex-col !py-3 text-xs" onClick={() => setPage('attendance')}>🚗<span>{t.goTrip}</span></Btn>
      </div>

      {!d ? <Empty text={t.loading} /> : (
        <>
          <div className="grid grid-cols-4 gap-2">
            {[
              [t.annualShort, bal.ent.dueYet ? bal.annualRemaining : '—', '🌴'],
              [t.casualShort, bal.ent.dueYet ? bal.casualRemaining : '—', '⚡'],
              [t.presentDays, presentDays, '🕐'],
              [t.lateTotal, lateTotal, '⏰'],
            ].map(([l, v, i], idx) => (
              <div key={idx} className="rounded-2xl border border-slate-200 bg-white p-2.5 text-center">
                <div>{i}</div><div className="text-lg font-bold text-slate-800">{v}</div><div className="text-[10px] leading-tight text-slate-500">{l}</div>
              </div>
            ))}
          </div>

          <Card title={t.myPayslips}>
            {slips.length === 0 ? <Empty text={t.noPayslips} /> : (
              <ul className="divide-y divide-slate-100">
                {slips.map(({ run, item }) => (
                  <li key={item.id} className="flex cursor-pointer items-center justify-between py-3" onClick={() => setSlip({ run, item })}>
                    <span className="text-sm font-semibold text-slate-800">{run.month}/{run.year}</span>
                    <span className="text-sm font-bold text-brand-800">{money(item.net_pay)}</span>
                  </li>
                ))}
              </ul>
            )}
          </Card>

          <Card title={t.myRequests}>
            {d.reqs.length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100">
                {d.reqs.slice(0, 8).map((r) => (
                  <li key={r.id} className="flex items-center justify-between gap-2 py-2.5">
                    <div className="min-w-0"><p className="truncate text-sm font-semibold text-slate-800">{tyName(r.leave_type_id)}</p>
                      <p className="text-xs text-slate-500">{r.start_date} ← {r.end_date} · {Number(r.days)} {t.daysLbl}</p></div>
                    <Badge tone={lvTone(r.status)}>{t.lvStatus[r.status]}</Badge>
                  </li>
                ))}
              </ul>
            )}
          </Card>

          <Card title={t.myPunches + ' — ' + t.thisMonth}>
            {d.punches.length === 0 ? <Empty text={t.noData} /> : (
              <ul className="divide-y divide-slate-100">
                {d.punches.slice(0, 10).map((p) => (
                  <li key={p.id} className="flex items-center justify-between py-2 text-sm">
                    <span className="text-slate-700">{localDay(p.punch_time)} · {fmtTime(p.punch_time)}</span>
                    <span className="text-xs text-slate-500">{p.direction === 'in' ? t.dirIn : p.direction === 'out' ? t.dirOut : '—'} · {p.source}</span>
                  </li>
                ))}
              </ul>
            )}
          </Card>

          {(d.trips.length > 0 || d.loans.length > 0) && (
            <div className="grid grid-cols-2 gap-3">
              <Card title={t.myTrips}><p className="text-center text-2xl font-bold text-slate-800">{km.toFixed(1)} <span className="text-sm text-slate-500">{t.km}</span></p><p className="text-center text-xs text-slate-500">{d.trips.length} · {t.thisMonth}</p></Card>
              <Card title={t.myLoans}>
                {d.loans.length === 0 ? <Empty text={t.noData} /> : d.loans.map((l) => (
                  <p key={l.id} className="text-sm"><b>{money(r2(Number(l.principal) - Number(l.paid_total)))}</b> <span className="text-xs text-slate-500">{t.remaining} · {money(l.installment_amount)}/{t.monthLbl}</span></p>
                ))}
              </Card>
            </div>
          )}

          {d.docs.length > 0 && (
            <Card title={t.myDocs}>
              <ul className="divide-y divide-slate-100">
                {d.docs.map((x) => (
                  <li key={x.id} className="flex items-center justify-between py-2.5 text-sm">
                    <span className="truncate font-semibold text-slate-800">{x.title} <span className="text-xs font-normal text-slate-500">· {t.docTypes[x.doc_type]}</span></span>
                    <Btn variant="ghost" size="sm" onClick={() => openDoc(x)}>{t.download}</Btn>
                  </li>
                ))}
              </ul>
            </Card>
          )}
        </>
      )}

      <Modal open={!!slip} onClose={() => setSlip(null)} title={slip ? t.payslip + ' ' + slip.run.month + '/' + slip.run.year : ''}
        footer={slip ? <><Btn variant="soft" className="flex-1" onClick={() => printPayslip(slip.item, myEmp, slip.run, data.settings.company, t)}>🖨️ {t.print}</Btn><Btn variant="outline" className="flex-1" onClick={() => setSlip(null)}>{t.close}</Btn></> : null}>
        {slip && (
          <div className="space-y-1 text-sm">
            {[
              [t.basicLbl, slip.item.basic_salary], [t.allowLbl, slip.item.allowances_total], [t.otLbl, slip.item.ot_amount], [t.otherEarn, slip.item.other_earnings],
              [t.lateDedLbl, -slip.item.late_deduction], [t.unpaidDedLbl, -slip.item.unpaid_deduction], [t.sickDedLbl, -slip.item.sick_deduction],
              [t.insEmp, -slip.item.insurance_employee], [t.taxLbl, -slip.item.income_tax], [t.loanDedLbl, -(slip.item.loan_deduction || 0)], [t.otherDed, -slip.item.other_deductions],
            ].filter(([, v]) => Number(v) !== 0).map(([k, v], i) => (
              <div key={i} className="flex justify-between"><span className="text-slate-500">{k}</span><b className={Number(v) < 0 ? 'text-rose-600' : ''}>{money(Math.abs(Number(v)))}{Number(v) < 0 ? ' -' : ''}</b></div>
            ))}
            <div className="mt-2 flex justify-between rounded-xl bg-brand-700 px-4 py-3 font-bold text-white"><span>{t.netLbl}</span><span>{money(slip.item.net_pay)}</span></div>
          </div>
        )}
      </Modal>
    </>
  );
}

/* =====================================================================
   7j. Reports
   ===================================================================== */
function ReportsPage({ me, data, toast }) {
  const { lang, t } = useL();
  const now = new Date();
  const ym = (y, m) => y * 100 + m;
  const [tab, setTab] = useState('payroll');
  const [range, setRange] = useState({ fy: now.getFullYear(), fm: 1, ty: now.getFullYear(), tm: now.getMonth() + 1, from: todayISO().slice(0, 8) + '01', to: todayISO(), approvedOnly: true });
  const [pr, setPr] = useState(null);      // {runs, items}
  const [att, setAtt] = useState(null);    // punches
  const [lv, setLv] = useState(null);      // {reqs, adjs, types}

  const eName = (e) => e ? ((lang === 'ar' ? e.full_name_ar : e.full_name_en) || e.full_name_en) : '—';
  const empById = (id) => data.employees.find((e) => e.id === id);
  const branchName = (id) => { const b = data.branches.find((x) => x.id === id); return b ? (lang === 'ar' ? b.name_ar : b.name_en) : '—'; };
  const deptName = (id) => { const d = data.departments.find((x) => x.id === id); return d ? (lang === 'ar' ? d.name_ar : d.name_en) : '—'; };
  const active = data.employees.filter((e) => e.status === 'active');

  /* ---- data loading per tab ---- */
  useEffect(() => {
    if (tab !== 'payroll' && tab !== 'overtime') return;
    setPr(null);
    (async () => {
      let q = sb.from('payroll_runs').select('*');
      if (range.approvedOnly) q = q.eq('status', 'approved');
      const { data: runs } = await q;
      const inRange = (runs || []).filter((r) => ym(r.year, r.month) >= ym(range.fy, range.fm) && ym(r.year, r.month) <= ym(range.ty, range.tm));
      const ids = inRange.map((r) => r.id);
      const { data: items } = ids.length ? await sb.from('payroll_items').select('*').in('run_id', ids) : { data: [] };
      setPr({ runs: inRange, items: items || [] });
    })();
  }, [tab, range.fy, range.fm, range.ty, range.tm, range.approvedOnly]);

  useEffect(() => {
    if (tab !== 'attendance') return;
    setAtt(null);
    const end = new Date(range.to + 'T00:00:00'); end.setDate(end.getDate() + 1);
    sb.from('attendance_punches').select('employee_id, punch_time, direction')
      .gte('punch_time', new Date(range.from + 'T00:00:00').toISOString()).lt('punch_time', end.toISOString()).order('punch_time')
      .then(({ data: d }) => setAtt(d || []));
  }, [tab, range.from, range.to]);

  useEffect(() => {
    if (tab !== 'leave') return;
    setLv(null);
    const year = now.getFullYear();
    Promise.all([
      sb.from('leave_requests').select('*').gte('start_date', year + '-01-01'),
      sb.from('leave_adjustments').select('*').eq('year', year),
      sb.from('leave_types').select('*'),
    ]).then(([r, a, ty]) => setLv({ reqs: r.data || [], adjs: a.data || [], types: ty.data || [] }));
  }, [tab]);

  /* ---- aggregations ---- */
  const groupSum = (rows, keyFn, fields) => {
    const out = {};
    for (const r of rows) {
      const k = keyFn(r);
      out[k] = out[k] || { key: k, count: 0, ...Object.fromEntries(fields.map((f) => [f, 0])) };
      out[k].count++;
      for (const f of fields) out[k][f] += Number(r[f]) || 0;
    }
    return Object.values(out);
  };
  const payrollRows = pr ? pr.items.map((i) => {
    const run = pr.runs.find((r) => r.id === i.run_id), emp = empById(i.employee_id) || {};
    return { ...i, branch_id: run ? run.branch_id : null, department_id: emp.department_id, cost: Number(i.gross_pay) + Number(i.insurance_employer) };
  }) : [];
  const costFields = ['gross_pay', 'total_deductions', 'net_pay', 'insurance_employer', 'cost'];

  const attRows = useMemo(() => {
    if (!att) return [];
    const weekendC = (data.settings.work_week || {}).weekend_days || [5, 6];
    const byEmp = {};
    for (const p of att) { if (!p.employee_id) continue; const k = p.employee_id + '|' + localDay(p.punch_time); (byEmp[k] = byEmp[k] || []).push(p); }
    const out = {};
    for (const [k, list] of Object.entries(byEmp)) {
      const [empId, date] = k.split('|');
      const emp = empById(empId); if (!emp) continue;
      const weekend = emp.weekend_days || weekendC;
      if (weekend.includes(new Date(date + 'T00:00:00').getDay())) continue;
      const shift = data.shifts.find((s) => s.id === emp.shift_id) || data.shifts[0];
      const ins = list.filter((p) => p.direction === 'in'), outs = list.filter((p) => p.direction === 'out');
      const firstIn = ins[0] || list[0];
      const lastOut = outs.length ? outs[outs.length - 1] : (list.length > 1 ? list[list.length - 1] : null);
      const o = out[empId] = out[empId] || { emp, days: 0, late: 0, ot: 0, missing: 0 };
      o.days++;
      if (shift && firstIn) o.late += Math.max(0, minutesOf(firstIn.punch_time) - (timeToMin(shift.start_time) + shift.grace_minutes));
